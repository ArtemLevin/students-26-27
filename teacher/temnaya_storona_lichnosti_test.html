const QUESTIONS = DATA.questions, SCALES=DATA.scales;

const STORAGE='dark-light-triads-42-v1';

let state={screen:'intro',index:0,answers:{}};
try{let p=JSON.parse(localStorage.getItem(STORAGE)||'null');if(p&&p.version===1&&p.answers&&typeof p.answers==='object'){
 const accepted={};for(const q of QUESTIONS){let v=p.answers[q.id];if(Number.isInteger(v)&&v>=1&&v<=5)accepted[q.id]=v;}
 state.answers=accepted;state.index=Number.isInteger(p.index)?Math.max(0,Math.min(QUESTIONS.length-1,p.index)):0;
 }}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const answered=()=>QUESTIONS.filter(q=>state.answers[q.id]!==undefined).length;
const allDone=()=>answered()===QUESTIONS.length;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({version:1,answers:state.answers,index:state.index}));}catch(e){}}
function navTop(){window.scrollTo({top:0,behavior:'instant'});}
function setScreen(screen){state.screen=screen;render();navTop();}
function reset(){if(answered()&&!confirm('Удалить все сохранённые ответы и начать заново?'))return;state={screen:'intro',index:0,answers:{}};try{localStorage.removeItem(STORAGE)}catch(e){}render();navTop();}
function intro(){let progress=answered();return `<section class="hero"><div><div class="eyebrow">Интерактивное исследование мотивов</div><h1>Тёмная<br><em>сторона</em><br>личности.</h1><p class="lead">Что вы выбираете, когда сталкиваются личная выгода, статус, доверие и сочувствие? 42 неоднозначные жизненные ситуации помогут исследовать ваши привычные решения.</p><div class="cta-row"><button type="button" class="cta" data-act="start">${progress?'Продолжить исследование':'Начать исследование'} <span aria-hidden="true">↗</span></button>${progress?`<button type="button" class="cta ghost" data-act="reset">Сбросить ответы</button>`:''}</div><div class="submeta">${progress?`Сохранено ответов: <strong>${progress} из 42</strong>. `:''}Ответы сохраняются только в вашем браузере.</div></div><div class="orbit-wrap" aria-hidden="true"><div class="orb-outer"><div class="orb-center">D / L</div><div class="orb-label">Влияние</div><div class="orb-label">Статус</div><div class="orb-label">Границы</div><div class="orb-label">Гуманизм</div><div class="orb-label">Доверие</div><div class="orb-label">Риск</div><i class="point a"></i><i class="point b"></i><i class="point c"></i><i class="point light d"></i><i class="point light e"></i><i class="point light f"></i></div></div></section><section class="intro-strip"><div class="stat"><b>42</b><span>провокационные ситуации</span></div><div class="stat"><b>06</b><span>личностных тенденций</span></div><div class="stat"><b>10–15</b><span>минут на прохождение</span></div></section><div class="twocol"><div class="model-card"><div class="num">01 / Тёмная триада</div><h3>Влияние и самосохранение</h3><p>Макиавеллизм, нарциссические черты, черты эмоциональной холодности и импульсивной жёсткости.</p></div><div class="model-card light"><div class="num">02 / Светлая триада</div><h3>Доверие и достоинство</h3><p>Кантианство, гуманизм и вера в человечность. Эти качества могут сосуществовать с более жёсткими мотивами.</p></div></div><div class="note"><strong>Прежде чем начать.</strong> Представляйте себя в предложенной ситуации и выбирайте привычную реакцию. Здесь нет правильных ответов. Тест составлен специально для этого сайта: он <strong>не является</strong> валидированными шкалами SD3 или LTS и не определяет клинический диагноз, «опасность» или истинные скрытые намерения.</div>`}
function quiz(){const q=QUESTIONS[state.index];let chosen=state.answers[q.id];let pct=Math.round(answered()/QUESTIONS.length*100);
return `<section class="quiz-shell"><div class="quiz-header"><div class="eyebrow">Ситуация ${String(state.index+1).padStart(2,'0')} / ${QUESTIONS.length}</div><div class="progress-meta"><strong>${answered()}</strong> из ${QUESTIONS.length} отвечено</div></div><div class="progressbar" role="progressbar" aria-valuenow="${answered()}" aria-valuemin="0" aria-valuemax="42" aria-label="Прогресс"><div class="progressbar-fill" style="width:${pct}%"></div></div><article class="case-card"><div class="case-id">${esc(q.theme)} · Жизненная дилемма</div><h2>${esc(q.scene)}</h2><p class="scenario-text">${esc(q.statement)}</p><div class="response-title">Насколько вы согласны с этим решением?</div><div class="answer-grid" role="group" aria-label="Варианты ответа">${labels.map((label,i)=>`<button type="button" class="answer ${chosen===i+1?'selected':''}" aria-pressed="${chosen===i+1}" aria-label="${esc(label)}" data-answer="${i+1}"><span class="answer-num">${i+1}</span><span class="answer-label">${esc(SHORT[i])}</span></button>`).join('')}</div><div class="quiz-actions"><button type="button" class="cta ghost small" data-act="prev" ${state.index===0?'disabled':''}>← Назад</button><span class="submeta">Клавиши 1–5 для выбора</span><button type="button" class="cta small" data-act="next" ${chosen===undefined?'disabled':''}>${state.index===41?(allDone()?'Увидеть профиль ↗':'К пропущенным ↗'):'Далее →'}</button></div></article><div class="quiz-footer"><details><summary>Карта вопросов · вернуться к любому ответу</summary><div class="dot-grid">${QUESTIONS.map((x,i)=>`<button type="button" class="dot ${state.answers[x.id]!==undefined?'done':''} ${i===state.index?'current':''}" data-jump="${i}" aria-label="Вопрос ${i+1}${state.answers[x.id]!==undefined?', отвечен':''}">${i+1}</button>`).join('')}</div></details><div class="privacy-row">◉ &nbsp; Прогресс сохраняется локально. Данные никуда не отправляются. <button class="topnavbtn" type="button" data-act="backIntro">На главную</button></div></div></section>`}
function compute(){return SCALES.map(s=>{const questions=QUESTIONS.filter(q=>q.scale===s.id);const values=questions.map(q=>q.reverse?6-state.answers[q.id]:state.answers[q.id]);const mean=values.reduce((a,b)=>a+b,0)/values.length;const pct=Math.round((mean-1)*25);let tier=pct>=67?'Высокая':pct<=33?'Низкая':'Средняя';return {...s,values,mean,pct,tier,interpret:pct>=67?s.high:pct<=33?s.low:s.mid};});}
function radar(scores){const r=134,c=175;const angles=scores.map((_,i)=>(-Math.PI/2)+i*2*Math.PI/6);const coords=(vals)=>vals.map((v,i)=>{const rr=r*v;return[(c+Math.cos(angles[i])*rr).toFixed(1),(c+Math.sin(angles[i])*rr).toFixed(1)].join(',')}).join(' ');const lineArray=[];for(let i=1;i<=4;i++)lineArray.push(`<polygon points="${coords(scores.map(()=>i/4))}" fill="none" stroke="rgba(245,241,232,.13)" stroke-width="1"/>`);const axes=scores.map((s,i)=>`<line x1="${c}" y1="${c}" x2="${c+Math.cos(angles[i])*r}" y2="${c+Math.sin(angles[i])*r}" stroke="rgba(245,241,232,.17)"/><circle cx="${c+Math.cos(angles[i])*r*s.pct/100}" cy="${c+Math.sin(angles[i])*r*s.pct/100}" r="3" fill="${s.color}"/>`).join('');const fills=`<polygon points="${coords(scores.map(s=>s.pct/100))}" fill="rgba(206,171,169,.17)" stroke="#dfb4a4" stroke-width="2.5" stroke-linejoin="round"/>`;return `<svg class="chart-svg" viewBox="0 0 350 350" role="img" aria-label="Шестилучевая диаграмма шести личностных тенденций">${lineArray.join('')}${axes}${fills}<circle cx="175" cy="175" r="3" fill="#f9eee0"/></svg>`;}
function chooseMain(scores, side){let pool=scores.filter(s=>s.side===side).sort((a,b)=>b.pct-a.pct);const top=pool[0],second=pool[1]; if(top.pct<=55)return {name:'Без явного лидера',text:'В этих трёх измерениях не выявилось отчётливо выраженной доминанты по условной шкале.'};const near=pool.filter(s=>top.pct-s.pct<=5);if(near.length===3)return {name:'Смешанный профиль',text:'Все три мотива выражены примерно одинаково. Выделять единственный ведущий тип на основании этих ответов было бы произвольно.'};if(near.length===2)return {name:near[0].short+' · '+near[1].short,text:'Два мотива получили близкие оценки, поэтому единый ведущий тип на основании этих ответов не выделяется.'};return {name:top.short,text:top.interpret};}
function insights(scores){const by=Object.fromEntries(scores.map(s=>[s.id,s]));const out=[];const put=(headline,body)=>out.push({headline,body});
if(by.mach.pct>=65&&by.kant.pct>=65)put('Стратегия и уважение к выбору','Вы одинаково часто соглашались с утверждениями о прагматичном влиянии и с необходимостью учитывать автономию других. Такое сочетание может означать зависимость решений от ставок и контекста.');
if(by.narc.pct>=65&&by.hum.pct>=65)put('Признание и уважение','Для вас могут быть одновременно важны внимание к собственным заслугам и достоинство других людей. Интересно посмотреть, что происходит, когда эти потребности сталкиваются.');
if(by.call.pct>=65&&by.faith.pct>=65)put('Решительность и доверие','Вы склонны рассчитывать на добро в людях, но допускаете резкие решения в конфликте. Разница между ожиданиями и реальной реакцией заслуживает отдельного размышления.');
if(by.hum.pct>=67&&by.faith.pct<=33)put('Сочувствие без идеализации','По ответам вы готовы признавать достоинство другого человека, сохраняя осторожность относительно его намерений. Сочувствие и доверие действительно могут различаться.');
if(by.mach.pct>=67&&by.faith.pct>=67)put('Расчёт и оптимизм','Вы допускаете стратегическое управление впечатлением и одновременно верите в добрые намерения других. Это может отражать разные стратегии в разных социальных ролях.');
if(by.narc.pct>=67&&by.kant.pct>=67)put('Статус и границы','Вам важно личное признание, но вы также описываете уважение к независимости другого. Стоит посмотреть, как эти ориентиры сочетаются в конкуренции.');
const dark=scores.filter(s=>s.side==='dark').sort((a,b)=>b.pct-a.pct)[0]; const light=scores.filter(s=>s.side==='light').sort((a,b)=>b.pct-a.pct)[0];
if(out.length===0)put('Сложный, контекстный портрет',`Наиболее заметные измерения в ответах: «${dark.name}» и «${light.name}». Их совместное присутствие не обязано означать противоречие — поведение зависит от контекста и значимости ситуации.`);
const allSame=Object.values(state.answers);const counts=[1,2,3,4,5].map(x=>allSame.filter(v=>v===x).length);if(Math.max(...counts)>=34)put('Ответы требуют осторожной интерпретации','В подавляющем большинстве ситуаций выбран один и тот же вариант. Такой стиль ответа ограничивает различимость шкал; при желании можно пересмотреть отдельные ответы.');
return out.slice(0,3);}
function result(){const scores=compute(),d=scores.filter(s=>s.side==='dark'),l=scores.filter(s=>s.side==='light'),dm=chooseMain(scores,'dark'),lm=chooseMain(scores,'light');let avgD=Math.round(d.reduce((a,b)=>a+b.pct,0)/3),avgL=Math.round(l.reduce((a,b)=>a+b.pct,0)/3);
return `<section class="result-shell"><div class="result-hero"><div><div class="eyebrow">Ваш авторский психологический профиль</div><h1>Портрет <em style="color:var(--peach);font-style:italic">мотивов.</em></h1><p>Шесть измерений описывают, как вы ответили на 42 жизненные дилеммы. Здесь нет клинических диагнозов, а «тёмное» и «светлое» — имена исследовательских конструктов, без оценки человека как хорошего или плохого.</p></div><div class="result-actions"><button type="button" class="cta ghost small" data-act="copy">Копировать</button><button type="button" class="cta ghost small" data-act="download">Скачать .txt</button><button type="button" class="cta ghost small" data-act="print">Печать / PDF</button></div></div><div class="result-intro"><div class="summary-box dark"><span class="overline">Тёмная триада · ведущая тема</span><h3>${esc(dm.name)}</h3><p>${esc(dm.text)}</p><div class="submeta" style="margin-top:13px">Среднее по шкалам: ${avgD} / 100*</div></div><div class="summary-box light"><span class="overline">Светлая триада · ведущая тема</span><h3>${esc(lm.name)}</h3><p>${esc(lm.text)}</p><div class="submeta" style="margin-top:13px">Среднее по шкалам: ${avgL} / 100*</div></div></div><div class="chart-section"><div class="panel"><h3>Карта тенденций</h3><p class="panel-desc">Шесть шкал в одном поле</p>${radar(scores)}<div class="chart-legend"><span><i style="background:var(--peach)"></i>Тёмная триада</span><span><i style="background:var(--mint)"></i>Светлая триада</span></div></div><div class="panel"><h3>Все шесть измерений</h3><p class="panel-desc">0–100 · преобразование средних оценок, не процентили</p>${scores.map(s=>`<div class="dimension"><div class="dimhead"><span>${esc(s.name)}</span><b style="color:${s.color}">${s.pct} / 100</b></div><div class="track"><div class="fill" style="width:${s.pct}%;background:${s.color}"></div></div></div>`).join('')}</div></div><h2 class="sectiontitle">Что говорят ваши ответы</h2><p class="sectiondesc">Каждая шкала рассчитана по семи вопросам, включая обратные формулировки.</p><div class="insight-grid">${scores.map(s=>`<article class="insight-card" style="border-top:2px solid ${s.color}"><div class="topline"><span>${s.side==='dark'?'Тёмная триада':'Светлая триада'}</span><span class="pill">${s.tier} выраженность</span></div><h4>${esc(s.name)}</h4><p style="color:${s.color};margin-bottom:9px">${esc(s.sub)}</p><p>${esc(s.interpret)}</p><p style="margin-top:12px"><strong style="color:var(--ink)">Возможный ресурс:</strong> ${esc(s.resource)}</p><p style="margin-top:9px"><strong style="color:var(--ink)">На что обратить внимание:</strong> ${esc(s.risk)}</p></article>`).join('')}</div><h2 class="sectiontitle">Пересечения мотивов</h2><p class="sectiondesc">Эти гипотезы основаны на сочетаниях ответов и требуют проверки на реальных примерах.</p>${insights(scores).map((x,i)=>`<div class="insight-block"><b>${String(i+1).padStart(2,'0')} · ${esc(x.headline)}</b><p>${esc(x.body)}</p></div>`).join('')}<h2 class="sectiontitle">Вопросы к самому себе</h2><div class="reflection"><div class="question">В каком недавнем конфликте вы поступили иначе, чем предполагали бы ваши ответы?</div><div class="question">Как меняются ваши решения, когда цена ошибки велика, а чужую реакцию никто не увидит?</div></div><div class="note"><strong>* О методике.</strong> Это <strong>самостоятельный авторский опросник</strong> по мотивам Тёмной и Светлой триад. Средние значения ответов от 1 до 5 линейно переведены в диапазон 0–100. Они <strong>не являются процентилями, вероятностью диагноза или сравнением с населением</strong>. Пороги «низкая» (0–33), «средняя» (34–66) и «высокая» (67–100) условные и научно не нормированы. Ответы могут меняться с обстоятельствами, настроением и стремлением выглядеть определённым образом.</div><div class="result-actions" style="justify-content:flex-start;margin-top:25px"><button type="button" class="cta" data-act="review">Вернуться к ответам →</button><button type="button" class="cta ghost" data-act="reset">Пройти заново</button></div><div class="sources"><h3>Научная основа и ограничения</h3><div>Jones D. N., Paulhus D. L. (2014). <a href="https://doi.org/10.1177/1073191113514105" target="_blank" rel="noopener noreferrer">Introducing the Short Dark Triad (SD3)</a>. В валидированной методике SD3 27 оригинальных пунктов; они здесь не воспроизводятся.</div><div>Kaufman S. B. et al. (2019). <a href="https://doi.org/10.3389/fpsyg.2019.00467" target="_blank" rel="noopener noreferrer">The Light vs. Dark Triad of Personality</a>. В научной шкале LTS 12 пунктов; данный сайт использует собственные сценарии.</div><div>Составление утверждений, подсчёт и текстовые интерпретации на этой странице не прошли независимую психометрическую валидацию. Для клинических выводов необходимо профессиональное обследование.</div></div></section>`}
function render(){document.getElementById('topRestart').classList.toggle('hidden',state.screen==='intro'&&answered()===0);root.innerHTML=state.screen==='intro'?intro():state.screen==='quiz'?quiz():result();document.title=(state.screen==='result'?'Ваш профиль':state.screen==='quiz'?'Вопрос '+(state.index+1):'Тёмная сторона личности')+' — Тёмная сторона личности';}
function next(){if(state.answers[QUESTIONS[state.index].id]===undefined)return;if(state.index<QUESTIONS.length-1){state.index+=1;save();render();navTop();return;}if(allDone()){setScreen('result');return;}state.index=QUESTIONS.findIndex(q=>state.answers[q.id]===undefined);save();render();navTop();}
function reportText(){const scores=compute();const dark=scores.filter(s=>s.side==='dark'),light=scores.filter(s=>s.side==='light');return ['ТЁМНАЯ СТОРОНА ЛИЧНОСТИ — АВТОРСКИЙ ОПРОСНИК','42 вопроса · 6 измерений · Дата: '+new Date().toLocaleDateString('ru-RU'),'','ТЁМНАЯ ТРИАДА',...dark.map(s=>`${s.name}: ${s.pct} / 100 (${s.tier.toLowerCase()} выраженность)\n${s.interpret}`),'','СВЕТЛАЯ ТРИАДА',...light.map(s=>`${s.name}: ${s.pct} / 100 (${s.tier.toLowerCase()} выраженность)\n${s.interpret}`),'','ПЕРЕСЕЧЕНИЯ МОТИВОВ',...insights(scores).map(s=>s.headline+': '+s.body),'','ОГРАНИЧЕНИЕ: оригинальный авторский опросник, не валидированные SD3 или LTS. Баллы не являются процентилями и не позволяют ставить диагноз.'].join('\n');}
async function copyReport(){const text=reportText();try{await navigator.clipboard.writeText(text);toast('Результат скопирован');}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Результат скопирован')}catch(err){toast('Используйте кнопку «Скачать .txt»')}ta.remove();}}
function toast(message){const el=document.createElement('div');el.textContent=message;Object.assign(el.style,{position:'fixed',right:'20px',bottom:'20px',background:'#e8cfb5',color:'#221a16',fontSize:'13px',padding:'12px 18px',borderRadius:'7px',zIndex:1000,boxShadow:'0 8px 30px #0008'});document.body.appendChild(el);setTimeout(()=>el.remove(),2700)}
function download(){const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='temnaya-storona-profil.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;
if(button.dataset.answer){state.answers[QUESTIONS[state.index].id]=Number(button.dataset.answer);save();render();return;}
if(button.dataset.jump!==undefined){state.index=Number(button.dataset.jump);save();render();navTop();return;}
switch(button.dataset.act){case'start':setScreen('quiz');break;case'backIntro':setScreen('intro');break;case'prev':if(state.index>0){state.index--;save();render();navTop()}break;case'next':next();break;case'copy':copyReport();break;case'download':download();break;case'print':window.print();break;case'reset':reset();break;case'review':state.index=0;save();setScreen('quiz');break;}}
);
document.getElementById('topRestart').addEventListener('click',reset);
document.getElementById('brand').addEventListener('click',e=>{e.preventDefault();setScreen('intro')});
document.addEventListener('keydown',e=>{if(state.screen!=='quiz'||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(/^[1-5]$/.test(e.key)){e.preventDefault();state.answers[QUESTIONS[state.index].id]=Number(e.key);save();render()}else if(e.key==='Enter'&&state.answers[QUESTIONS[state.index].id]!==undefined){e.preventDefault();next()}else if(e.key==='ArrowLeft'&&state.index>0){e.preventDefault();state.index--;save();render()}});
render();
</script></body></html>
