e":false,"text":"После удачной встречи с людьми я часто ощущаю прилив сил."},{"id":17,"dimension":"H","reverse":false,"text":"Я верну деньги, которые мне по ошибке дали сверх положенного, даже если это неудобно."},{"id":18,"dimension":"C","reverse":false,"text":"Большую сложную задачу мне комфортнее заранее разделить на последовательные шаги."},{"id":19,"dimension":"A","reverse":true,"text":"Чужие повторяющиеся ошибки быстро выводят меня из себя."},{"id":20,"dimension":"E","reverse":true,"text":"Даже явная физическая опасность редко заставляет меня испытывать страх."},{"id":21,"dimension":"X","reverse":true,"text":"Я стараюсь избегать заметных ролей, даже когда хорошо разбираюсь в теме."},{"id":22,"dimension":"O","reverse":true,"text":"Я предпочитаю сохранять привычные взгляды и редко вижу смысл их пересматривать."},{"id":23,"dimension":"H","reverse":true,"text":"Я допускаю обход правил ради собственной выгоды, когда шанс быть пойманным очень мал."},{"id":24,"dimension":"C","reverse":true,"text":"Если работа в целом сделана, небольшие неточности меня почти не волнуют."},{"id":25,"dimension":"C","reverse":false,"text":"Я соблюдаю согласованные сроки даже без напоминаний со стороны."},{"id":26,"dimension":"O","reverse":false,"text":"Мне нравится искать неожиданные связи между далёкими друг от друга явлениями."},{"id":27,"dimension":"X","reverse":false,"text":"Если у группы нет ведущего, я могу спокойно взять слово."},{"id":28,"dimension":"H","reverse":true,"text":"Мне важно, чтобы окружающие замечали признаки моего материального успеха."},{"id":29,"dimension":"A","reverse":false,"text":"Я стараюсь сохранить уважительный тон даже в очень остром споре."},{"id":30,"dimension":"E","reverse":false,"text":"Когда близкому больно, я остро переживаю вместе с ним."},{"id":31,"dimension":"E","reverse":true,"text":"Неопределённое будущее обычно вызывает у меня очень мало тревоги."},{"id":32,"dimension":"H","reverse":false,"text":"Я спокойно откажусь от привилегии, если она предос const DIMS=[{"id":"H","name":"Честность — скромность","short":"Честность","low":"Вы более чувствительны к статусу, выгоде и возможностям стратегического влияния. Это повод исследовать, какие границы вы считаете допустимыми, когда ставки высоки.","mid":"Ваши ответы описывают гибкое отношение к статусу, личной выгоде и принципам справедливости. Контекст, вероятно, существенно влияет на решения.","high":"Вы склонны дистанцироваться от манипуляций, нечестной выгоды и особых привилегий; статусные символы, вероятно, имеют для вас меньший вес.","lowTitle":"Приоритет выгоды и статуса","highTitle":"Прямота и скромность","prompt":"Где проходит моя граница между разумным продвижением себя и использованием других?"},{"id":"E","name":"Эмоциональность","short":"Эмоциональность","low":"Вы описываете себя как сравнительно спокойного перед риском, независимого от эмоциональной поддержки и менее сентиментального. Такая устойчивость может сочетаться с дистанцией в переживаниях.","mid":"Вам, вероятно, знакомы и спокойная самостоятельность, и ситуации, в которых тревога либо привязанность оказываются очень значимыми.","high":"Вы, вероятно, остро чувствуете опасность и неопределённость, дорожите эмоциональной связью и воспринимаете поддержку как значимый ресурс.","lowTitle":"Эмоциональная автономия","highTitle":"Эмоциональная чувствительность","prompt":"В каких ситуациях близость и поддержка помогают мне, а когда я предпочитаю справляться самостоятельно?"},{"id":"X","name":"Экстраверсия","short":"Экстраверсия","low":"Вам может быть комфортнее наблюдать, выбирать узкий круг общения и дозировать публичность; новые социальные ситуации иногда требуют дополнительных усилий.","mid":"Вы, вероятно, легко переключаетесь между активным общением и уединением, ориентируясь на обстоятельства.","high":"Вы склонны увереннее чувствовать себя среди людей, легче брать слово, испытывать удовольствие от общения и проявлять энтузиазм.","lowTitle":"Социальная избирательность","highTitle":"Социальная уверенность","prompt":"От какого общения я набираюсь энергии и какое приводит к утомлению?"},{"id":"A","name":"Доброжелательность","short":"Доброжелательность","low":"Вы можете энергично защищать позицию, труднее прощать обиды и жёстче реагировать на несправедливость. Стоит различать защиту границ и затяжной конфликт.","mid":"В разных отношениях вы способны чередовать компромисс, терпение и твёрдое отстаивание своих интересов.","high":"Вы склонны искать компромисс, прощать ошибки, сохранять терпение и контролировать гнев даже при разногласиях.","lowTitle":"Принципиальная жёсткость","highTitle":"Терпимость и примирение","prompt":"Какие обиды я готов отпустить, а где важно сохранить жёсткие границы?"},{"id":"C","name":"Добросовестность","short":"Добросовестность","low":"Вы можете предпочитать гибкость, спонтанность и работу по вдохновению. Структура и контроль качества могут требовать специальных инструментов.","mid":"Вы способны планировать, когда это важно, и импровизировать, когда обстоятельства требуют свободы действий.","high":"Вы склонны организовывать работу, выдерживать сроки, проверять качество и осмотрительно принимать решения.","lowTitle":"Гибкая импровизация","highTitle":"Организованность и дисциплина","prompt":"Какие правила действительно поддерживают мою продуктивность, а какие создают ненужную жёсткость?"},{"id":"O","name":"Открытость опыту","short":"Открытость","low":"Вам может быть ближе практичность, проверенные подходы и привычная эстетика, чем экспериментальные идеи или отвлечённые рассуждения.","mid":"Вы проявляете интерес к новому выборочно: некоторые идеи вдохновляют, а другие кажутся чрезмерно абстрактными.","high":"Вас привлекают необычные идеи, искусство, интеллектуальные вопросы и новые способы смотреть на привычные вещи.","lowTitle":"Практичность и традиция","highTitle":"Любознательность и воображение","prompt":"Какая новая идея недавно заставила меня пересмотреть привычный взгляд на мир?"}];
const COLORS={H:'#dca56a',E:'#c98a91',X:'#83bca9',A:'#88a9d0',C:'#b4b388',O:'#d0a7d9'};
const STORAGE_KEY='six-facets-hexaco-v1';
let answers=Array(QUESTIONS.length).fill(null),position=0,screen='home',mapOpen=false;
const app=document.getElementById('app');
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function load(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(data?.version===1&&Array.isArray(data.answers)&&data.answers.length===60){answers=data.answers.map(a=>Number.isInteger(a)&&a>=1&&a<=5?a:null);position=Number.isInteger(data.position)?Math.max(0,Math.min(59,data.position)):0;}}catch(e){}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,answers,position}))}catch(e){}}
function answeredCount(){return answers.filter(x=>x!==null).length;}
function btn(label,action,kind=''){return `<button class="button ${kind}" data-action="${action}">${label}</button>`}
function icon(){return `<svg class="hero-orbit" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Шестиугольная диаграмма шести измерений личности"><defs><linearGradient id="orbitLine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2d4a5"/><stop offset="1" stop-color="#7bc3a0"/></linearGradient></defs><circle cx="210" cy="210" r="182" stroke="#aecbb856" stroke-width="1" fill="none"/><circle cx="210" cy="210" r="137" stroke="#aecbb856" fill="none"/><circle cx="210" cy="210" r="91" stroke="#aecbb856" fill="none"/><path d="M210 29 L367 120 L367 300 L210 391 L53 300 L53 120 Z" stroke="url(#orbitLine)" stroke-width="2" fill="#84b9a012"/><path d="M210 84 L320 147 L320 273 L210 336 L100 273 L100 147 Z" stroke="#e7c49c80" stroke-width="1" fill="#e7c49c12"/><path d="M210 29 V391 M53 120 L367 300 M367 120 L53 300" stroke="#bdd5c421"/><path d="M210 84 L320 147 L320 273 L210 336 L100 273 L100 147 Z" fill="#e9c89b16"/><g fill="#f4d5a3"><circle cx="210" cy="29" r="5"/><circle cx="367" cy="120" r="5"/><circle cx="367" cy="300" r="5"/><circle cx="210" cy="391" r="5"/><circle cx="53" cy="300" r="5"/><circle cx="53" cy="120" r="5"/></g><text x="210" y="215" text-anchor="middle" fill="#fbf4e4" font-size="76" font-family="Georgia,serif">6</text><text x="210" y="244" text-anchor="middle" fill="#c7decb" font-size="11" letter-spacing="4">HEXACO</text></svg>`}
function renderHome(){const saved=answeredCount();screen='home';app.innerHTML=`<section class="hero"><div><div class="eyebrow">Серия психологических исследований / 07</div><h1>У личности<br>шесть граней.</h1><p class="lead">Что вы делаете, когда честность мешает выгоде? Как переживаете угрозу, ведёте спор, держите слово и относитесь к новым идеям? <strong>60 непростых утверждений</strong> помогут составить собственный шестимерный профиль.</p><div class="inline-tags"><span>60 вопросов</span><span>6 измерений</span><span>12–18 минут</span><span>Автоматический отчёт</span></div><div class="actions">${btn(saved?'Продолжить — '+saved+'/60':'Начать исследование →','start')}${saved?btn('Начать заново','reset','alt'):''}</div><div class="micro">Каждый ответ — от 1 до 5. Выберите то, что ближе к вашему обычному поведению. Данных на сервер мы не отправляем: прогресс хранится только в этом браузере.</div></div><div class="hero-art">${icon()}<span class="art-caption">Личность шире одного ярлыка</span></div></section><section class="sections"><div class="section-head"><div><span class="eyebrow">Что покажет результат</span><h2>Шесть измерений личности</h2></div><p>Каждая ось отражает собственную тенденцию. Низкий показатель не означает «плохой», а высокий не означает «лучший».</p></div><div class="dim-grid">${DIMS.map(d=>`<article class="dimcard"><div class="dim-letter" style="color:${COLORS[d.id]}">${d.id}</div><h3>${esc(d.name)}</h3><p>${esc(d.lowTitle)} ↔ ${esc(d.highTitle)}</p></article>`).join('')}</div><p class="disclaimer" style="margin-top:30px"><strong>О методике.</strong> HEXACO — исследовательская модель личности Кибома Ли и Майкла Эштона. Вопросы на этом сайте написаны специально для данного проекта и не являются официальным HEXACO-PI-R. Баллы нельзя сопоставлять с нормативными процентилями, использовать для диагностики или кадрового отбора.</p><p class="micro">Информация о модели: <a href="https://hexaco.org/" target="_blank" rel="noopener noreferrer">официальный сайт HEXACO</a>.</p></section>`;}
function renderQuiz(){screen='quiz';const q=QUESTIONS[position],value=answers[position],count=answeredCount();app.innerHTML=`<section class="test-layout"><aside class="panel side"><div><div class="eyebrow">Ваш прогресс</div><div class="progressbig">${count}<span style="font-size:23px;color:var(--muted)"> / 60</span></div><div class="quiet">Ответов заполнено</div></div><div><div class="eyebrow">Шаг ${position+1}</div><div class="micro">Можете вернуться к любому вопросу.</div></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="60" aria-valuenow="${count}" aria-label="Заполнено вопросов"><div class="progress-fill" style="width:${count/60*100}%"></div></div><div class="map-block"><button class="map-toggler" data-action="map" aria-expanded="${mapOpen}">${mapOpen?'Скрыть':'Показать'} карту вопросов ↓</button>${mapOpen?`<nav class="number-map" aria-label="Карта вопросов">${QUESTIONS.map((p,i)=>`<button class="qdot ${answers[i]!==null?'answered':''} ${i===position?'current':''}" data-jump="${i}" title="Вопрос ${i+1}" aria-label="Вопрос ${i+1}${answers[i]!==null?', отвечен':''}" ${i===position?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav>`:''}</div></aside><div class="panel question-card"><div class="question-caption">Утверждение ${String(position+1).padStart(2,'0')} / 60</div><h2 class="question-title">${esc(q.text)}</h2><div class="scale-legend"><span>Совсем не согласен</span><span>Полностью согласен</span></div><div class="choice-grid" role="group" aria-label="Насколько вы согласны с утверждением">${['Нет','Скорее нет','Не уверен','Скорее да','Да'].map((s,i)=>`<button class="choice" data-answer="${i+1}" aria-pressed="${value===i+1}"><strong>${i+1}</strong><small>${s}</small></button>`).join('')}</div><div class="question-controls"><button class="button alt" data-action="prev" ${position===0?'disabled':''}>← Назад</button><button class="button" data-action="${position===59?'finish':'next'}" ${value===null?'disabled':''}>${position===59?'Результаты →':'Далее →'}</button></div><div class="keys">Клавиши 1–5 — выбор ответа · Enter — следующий вопрос · ← / → — переход · Esc — карта вопросов</div><p class="micro" style="margin:14px 0 0">У каждого человека бывают исключения. Отвечайте исходя из вашего обычного поведения за последние месяцы.</p></div></section>`;}
function calculate(){return DIMS.map(d=>{const picked=QUESTIONS.filter(q=>q.dimension===d.id);const values=picked.map(q=>q.reverse?6-answers[q.id-1]:answers[q.id-1]);const raw=values.reduce((a,b)=>a+b,0)/values.length;return {...d,score:raw,level:raw>=3.6?'Выше условного центра':raw<=2.4?'Ниже условного центра':'Около условного центра',description:raw>=3.6?d.high:raw<=2.4?d.low:d.mid,accent:raw>=3.6?d.highTitle:raw<=2.4?d.lowTitle:'Сбалансированная выраженность'};});}
function pointsFor(values,r=145,cx=205,cy=203){return values.map((v,i)=>{let a=-Math.PI/2+i*Math.PI/3,rr=r*v/5;return `${(cx+Math.cos(a)*rr).toFixed(1)},${(cy+Math.sin(a)*rr).toFixed(1)}`}).join(' ')}
function chart(scores){const vals=scores.map(s=>s.score);const cx=205,cy=203,r=145;const rings=[1,2,3,4,5].map(v=>`<polygon class="chart-grid" points="${pointsFor(Array(6).fill(v))}"/>`).join('');const axes=DIMS.map((d,i)=>{const a=-Math.PI/2+i*Math.PI/3,x=(cx+Math.cos(a)*r).toFixed(1),y=(cy+Math.sin(a)*r).toFixed(1),lx=(cx+Math.cos(a)*178).toFixed(1),ly=(cy+Math.sin(a)*178).toFixed(1);return `<line class="chart-axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/><text x="${lx}" y="${ly}" dominant-baseline="middle" text-anchor="middle" class="chart-label">${d.id}</text>`}).join('');const dots=vals.map((v,i)=>{const a=-Math.PI/2+i*Math.PI/3,rr=v/5*r;return `<circle cx="${cx+Math.cos(a)*rr}" cy="${cy+Math.sin(a)*rr}" r="5" fill="${COLORS[DIMS[i].id]}" stroke="#f1f7ed" stroke-width="2"/>`}).join('');return `<svg class="chart-svg" viewBox="0 0 410 410" role="img" aria-label="Радарная диаграмма: ${scores.map(s=>s.id+' '+s.score.toFixed(2)).join(', ')}">${rings}${axes}<polygon points="${pointsFor(vals)}" fill="#a5d5b044" stroke="#dfc593" stroke-width="2.8" stroke-linejoin="round"/>${dots}</svg>`}
function interpretSummary(scores){const distinct=scores.map(s=>({...s,diff:Math.abs(s.score-3)})).sort((a,b)=>b.diff-a.diff);const strong=distinct.filter(s=>s.diff>=.6);if(strong.length===0)return 'Ответы лежат близко к середине всех шести шкал. Возможно, ваше поведение особенно чувствительно к ситуации; здесь трудно выделить выраженную доминирующую черту.';const best=strong.slice(0,2);return 'Самые заметные отклонения от условного центра: '+best.map(s=>`${s.name.toLowerCase()} (${s.score.toFixed(2)} из 5)`).join(' и ')+'. Это относительные акценты внутри ваших ответов, без сравнения с населением.';}
function renderResults(){if(answeredCount()!==60){screen='quiz';position=answers.findIndex(a=>a===null);renderQuiz();return;}screen='results';const scores=calculate();const frequencies=[1,2,3,4,5].map(v=>answers.filter(a=>a===v).length);const maxfreq=Math.max(...frequencies);const caution=maxfreq>=54?'В ваших ответах одна и та же оценка встречается минимум в 90% случаев. Такой способ прохождения снижает различимость черт: интерпретируйте результат особенно осторожно.':'';app.innerHTML=`<section class="results-header"><span class="eyebrow">Ваш личный отчёт · 60 / 60</span><h1>Ваши шесть граней.</h1><p class="lead">Психологический профиль по шести измерениям HEXACO. Баллы отражают только самооценки в этом авторском опроснике.</p></section><section class="report-grid"><div class="score-pane"><h3>Карта личности</h3>${chart(scores)}<p class="score-summary">Каждая ось имеет диапазон 1–5. Центральная форма показывает сочетание черт; отсутствие резких пиков совершенно нормально.</p></div><div class="snapshot"><span class="eyebrow">Шесть измерений</span><h2>Профиль ответов</h2>${scores.map(s=>`<div class="barline"><strong>${esc(s.name)}</strong><b>${s.score.toFixed(2)}</b></div><div class="meter"><span style="--bar:${COLORS[s.id]};width:${(s.score-1)/4*100}%"></span></div><div class="barlabel"><span>1 · меньше</span><span>5 · больше</span></div>`).join('')}<p class="micro" style="margin-top:23px">Значение 3 — математическая середина шкалы, не среднее по популяции. Условные границы интерпретации: до 2,4; 2,5–3,5; от 3,6.</p></div></section><section class="report-actions no-print">${btn('Сохранить TXT ↓','txt')}${btn('Скачать JSON ↓','json','alt')}${btn('Печать / PDF','print','alt')}${btn('Скопировать итог','copy','alt')}${btn('Изменить ответы','edit','ghost')}${btn('Стереть ответы','reset','ghost')}</section><section class="report-section"><div class="eyebrow">Интерпретация</div><h2>Наиболее заметные особенности</h2><div class="refnote">${esc(interpretSummary(scores))}${caution?`<br><br><strong>Ограничение качества ответов:</strong> ${esc(caution)}`:''}</div></section><section class="report-section"><div class="eyebrow">Подробный разбор</div><h2>Значение каждой грани</h2><div class="interpret-grid">${scores.map(s=>`<article class="interpret-card"><div class="grade">${s.id} · ${esc(s.level)} · ${s.score.toFixed(2)} / 5</div><h3>${esc(s.name)}</h3><div class="eyebrow" style="color:${COLORS[s.id]};margin-top:12px">${esc(s.accent)}</div><p class="desc">${esc(s.description)}</p><div class="reflect"><b>Вопрос для размышления:</b> ${esc(s.prompt)}</div></article>`).join('')}</div></section><section class="report-section"><h2>Как читать результаты</h2><p class="disclaimer">У HEXACO нет единственного правильного «психотипа». Шесть шкал являются непрерывными; черты могут сочетаться практически любым способом. Этот сайт использует авторские вопросы и описательные пороги, поэтому не выдаёт клинических диагнозов, научных процентилей или заключений о пригодности человека к профессии и отношениям.</p><p class="refnote"><strong>Конфиденциальность.</strong> Ответы сохраняются в localStorage только на текущем устройстве. Кнопка «Стереть ответы» удаляет их из браузера. Экспортируемый файл остаётся под вашим контролем. Интернет для работы теста не требуется.</p><p class="micro">Научная основа модели: Lee & Ashton, HEXACO. Официальные описания шкал и оригинальные опросники: <a href="https://hexaco.org/scaledescriptions" target="_blank" rel="noopener noreferrer">hexaco.org</a>. Этот сайт не является официальной методикой HEXACO-PI-R.</p></section>`;}
function showTop(){window.scrollTo({top:0,behavior:'instant'});}
function updateAnswer(n){if(screen!=='quiz')return;answers[position]=n;save();renderQuiz();const root=document.querySelector('.question-card');if(root)root.focus?.();}
function forward(){if(answers[position]===null)return;if(position<59){position++;save();renderQuiz();showTop();}else if(answeredCount()===60){renderResults();showTop();}else{position=answers.findIndex(a=>a===null);save();renderQuiz();showTop();}}
function restart(){if(!confirm('Удалить все ответы и начать заново?'))return;answers=Array(60).fill(null);position=0;save();renderHome();showTop();}
function textReport(){const ss=calculate(),date=new Date().toLocaleDateString('ru-RU');return `ШЕСТЬ ГРАНЕЙ — авторский тест по модели HEXACO\nДата: ${date}\n\n${ss.map(s=>`${s.id} · ${s.name}: ${s.score.toFixed(2)} / 5\n${s.description}`).join('\n\n')}\n\n${interpretSummary(ss)}\n\nЭто авторский самоотчётный опросник, а не официальный HEXACO-PI-R. Баллы не являются нормативными процентилями или диагнозом.\nhttps://hexaco.org/`;}
function download(filename,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function action(a){switch(a){case 'start':position=answers.findIndex(x=>x===null);if(position===-1){renderResults()}else renderQuiz();showTop();break;case 'reset':restart();break;case 'prev':if(position>0){position--;save();renderQuiz();showTop()}break;case 'next':case 'finish':forward();break;case 'map':mapOpen=!mapOpen;renderQuiz();break;case 'edit':position=0;renderQuiz();showTop();break;case 'print':window.print();break;case 'txt':download('shest_graney_report.txt',textReport(),'text/plain;charset=utf-8');break;case 'json':download('shest_graney_report.json',JSON.stringify({test:'Шесть граней / авторский тест по модели HEXACO',version:1,createdAt:new Date().toISOString(),scale:'1–5',scores:calculate().map(s=>({id:s.id,name:s.name,value:Number(s.score.toFixed(3))})),answers:QUESTIONS.map((q,i)=>({id:i+1,dimension:q.dimension,reverse:q.reverse,response:answers[i]})),validated:false},null,2),'application/json;charset=utf-8');break;case 'copy':{const text=textReport();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>alert('Результат скопирован')).catch(()=>prompt('Скопируйте результат:',text));else prompt('Скопируйте результат:',text);break;} }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-answer],[data-action],[data-jump]');if(!b)return;if(b.hasAttribute('data-answer'))updateAnswer(Number(b.getAttribute('data-answer')));else if(b.hasAttribute('data-jump')){position=Number(b.getAttribute('data-jump'));save();renderQuiz();showTop()}else action(b.getAttribute('data-action'));});
document.getElementById('brand-home').addEventListener('click',()=>{renderHome();showTop()});
document.addEventListener('keydown',e=>{if(screen!=='quiz'||e.altKey||e.metaKey||e.ctrlKey||e.target.closest('input,textarea,select'))return;if(/^[1-5]$/.test(e.key)){e.preventDefault();updateAnswer(Number(e.key))}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();forward()}else if(e.key==='ArrowRight'&&e.target.tagName!=='BUTTON'){e.preventDefault();forward()}else if(e.key==='ArrowLeft'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(position>0){position--;save();renderQuiz();showTop();}}else if(e.key==='Escape'){e.preventDefault();mapOpen=!mapOpen;renderQuiz();}});
load();renderHome();
</script>
</body></html>
