lor:var(--ink)}.export-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.toast{position:fixed;bottom:22px;right:22px;background:var(--accent);color:var(--accentInk);padding:11px 17px;border-radius:12px;box-shadow:0 10px 35px #0004;z-index:20;font-size:13px}

<script id="dataset" type="application/json">{"number":18,"slug":"thoughts","title":"Мышление под воздействием эмоций","tag":"ИСКАЖЕНИЯ МЫШЛЕНИЯ","leadin":"Раздражение, обида, страх или стыд способны менять значение событий. Какие мысленные ходы становятся привычными именно у вас?","disclaimer":"Склонность к когнитивным искажениям по авторскому самоотчёту. Эти ответы не устанавливают расстройство и не заменяют клиническую оценку.","dimensions":[{"id":"cat","name":"Катастрофизация","short":"Катастрофа","low":"В описанных обстоятельствах вы сравнительно редко предполагаете наихудший исход. Иногда это помогает сохранять масштаб проблемы.","mid":"Негативные прогнозы возникают ситуативно. Имеет смысл наблюдать, какие темы запускают их чаще.","high":"При неопределённости мысли могут быстро переходить к самому неблагоприятному сценарию. Полезно отделять вероятность от тяжести возможного исхода.","probe":"Какой конкретный факт подтверждает ваш худший прогноз?"},{"id":"mind","name":"Чтение мыслей","short":"Чтение мыслей","low":"Вы реже приписываете людям мотивы без прямого разговора, хотя иногда можно упустить тонкие сигналы.","mid":"Вы периодически достраиваете чужие намерения, но способны проверить их на практике.","high":"Вы можете воспринимать догадки о намерениях другого человека как достаточно надёжные объяснения. Помогает вопрос, какую альтернативу вы ещё не проверили.","probe":"Что вы знаете точно о мотивах другого человека?"},{"id":"personal","name":"Персонализация","short":"Вина за всё","low":"Вы относительно редко принимаете чужое настроение или последствия сложных событий исключительно на свой счёт.","mid":"Степень личной ответственности может казаться вам больше реальной в отдельных ситуациях.","high":"Вы можете связывать с собой события, возникшие по множеству причин, и брать на себя избыточную ответственность.","probe":"Какие внешние факторы тоже могли повлиять на результат?"},{"id":"binary","name":"Чёрно-белое мышление","short":"Чёрно-белое","low":"Вам чаще удаётся видеть промежуточные оттенки между успехом и провалом.","mid":"Категоричность может усиливаться при личной значимости оценки.","high":"Под давлением ситуация может выглядеть как выбор между абсолютным успехом и полным поражением, без промежуточных вариантов.","probe":"Каким был бы достаточно хороший результат, даже если он несовершенен?"},{"id":"emotion","name":"Эмоциональное обоснование","short":"Чувство = факт","low":"Вы чаще различаете силу переживания и достоверность мысли, которая его сопровождает.","mid":"Иногда интенсивная эмоция служит для вас дополнительным аргументом.","high":"Сильное чувство может восприниматься как доказательство того, что ваше объяснение событий верно.","probe":"Какая оценка ситуации осталась бы, если бы интенсивность эмоции снизилась?"},{"id":"general","name":"Сверхобобщение","short":"Обобщение","low":"Вы реже делаете вывод о целой области жизни на основании одного случая.","mid":"Обобщения проявляются прежде всего после повторяющихся сложностей.","high":"Одна неудача или отказ могут превращаться в общий вывод о себе, других людях или будущем.","probe":"Сколько действительно независимых примеров поддерживают этот вывод?"},{"id":"reframe","name":"Проверка интерпретаций","short":"Переоценка","low":"В напряжённый момент вам может быть трудно проверить первую трактовку и найти альтернативу.","mid":"Вы способны искать другие объяснения, хотя при сильных эмоциях это даётся сложнее.","high":"Вы сообщаете о привычке делать паузу, проверять факты и искать несколько правдоподобных объяснений событий.","probe":"Какую ещё версию ситуации вы могли бы проверить без самообвинения?"}],"items":[{"id":1,"scale":"cat","text":"Когда руководитель просит срочно поговорить, я мысленно готовлюсь к худшим последствиям.","reverse":false},{"id":2,"scale":"mind","text":"Если человек отвечает коротко, я почти сразу делаю вывод, что он недоволен мной.","reverse":false},{"id":3,"scale":"personal","text":"Если компания замолчала после моей реплики, я думаю, что испортил атмосферу.","reverse":false},{"id":4,"scale":"binary","text":"Если я не выполнил план полностью, день кажется почти потерянным.","reverse":false},{"id":5,"scale":"emotion","text":"Когда мне стыдно, я воспринимаю это как доказательство того, что поступил ужасно.","reverse":false},{"id":6,"scale":"general","text":"После одного отказа мне легко подумать, что у меня вообще ничего не получится.","reverse":false},{"id":7,"scale":"reframe","text":"Когда меня задевает чужая фраза, я спрашиваю себя, возможна ли менее болезненная трактовка.","reverse":false},{"id":8,"scale":"cat","text":"Неожиданный симптом или мелкая ошибка легко запускают у меня цепочку тревожных сценариев.","reverse":false},{"id":9,"scale":"mind","text":"По одному взгляду или паузе я часто решаю, что знаю, что собеседник обо мне думает.","reverse":false},{"id":10,"scale":"personal","text":"Когда близкий человек раздражён, я прежде всего ищу причину в своём поведении.","reverse":false},{"id":11,"scale":"binary","text":"После серьёзной ошибки мне трудно назвать свою работу хотя бы частично успешной.","reverse":false},{"id":12,"scale":"emotion","text":"Если я чувствую тревогу перед событием, оно кажется мне объективно опаснее.","reverse":false},{"id":13,"scale":"general","text":"Если человек однажды подвёл меня, я склонен считать его ненадёжным во всём.","reverse":false},{"id":14,"scale":"reframe","text":"Перед важным обвинением я стараюсь различить наблюдения и собственные выводы.","reverse":false},{"id":15,"scale":"cat","text":"Если важное письмо остаётся без ответа, я представляю, что ситуация уже складывается плохо.","reverse":false},{"id":16,"scale":"mind","text":"Когда коллеги беседуют без меня, мне легко представить их скрытое отношение ко мне.","reverse":false},{"id":17,"scale":"personal","text":"Если совместный проект пошёл плохо, я беру на себя больше вины, чем другие участники.","reverse":false},{"id":18,"scale":"binary","text":"В конфликте я нередко вижу только две роли: правый и неправый.","reverse":false},{"id":19,"scale":"emotion","text":"Когда я сильно обижен, мне трудно допустить, что другой человек мог не хотеть причинить боль.","reverse":false},{"id":20,"scale":"general","text":"Один неудачный разговор иногда становится для меня доказательством, что я плохо общаюсь.","reverse":false},{"id":21,"scale":"reframe","text":"Если мысль кажется бесспорной, я всё равно иногда проверяю её с помощью фактов.","reverse":false},{"id":22,"scale":"cat","text":"После небольшой неудачи мне трудно не думать о том, как всё может окончательно разрушиться.","reverse":false},{"id":23,"scale":"mind","text":"Я редко сомневаюсь в своей первой догадке о настоящих мотивах другого человека.","reverse":false},{"id":24,"scale":"personal","text":"Чужое разочарование я нередко воспринимаю как свидетельство собственной ошибки.","reverse":false},{"id":25,"scale":"binary","text":"Незначительное несовпадение с идеалом может перечеркнуть для меня весь результат.","reverse":false},{"id":26,"scale":"emotion","text":"Неприятное предчувствие нередко кажется мне достаточным основанием для отрицательного вывода.","reverse":false},{"id":27,"scale":"general","text":"После повторной ошибки мне хочется сказать себе: «Так будет всегда».","reverse":false},{"id":28,"scale":"reframe","text":"В напряжённом разговоре я могу сделать паузу, чтобы посмотреть на ситуацию иначе.","reverse":false},{"id":29,"scale":"cat","text":"При неприятной новости я обычно сначала оцениваю несколько возможных исходов, включая обычные.","reverse":true},{"id":30,"scale":"mind","text":"Прежде чем объяснять чужую холодность личным отношением, я стараюсь спросить о причинах.","reverse":true},{"id":31,"scale":"personal","text":"Я легко допускаю, что настроение другого человека может совсем не быть связано со мной.","reverse":true},{"id":32,"scale":"binary","text":"Даже при посредственном результате я могу отметить, какие части получились хорошо.","reverse":true},{"id":33,"scale":"emotion","text":"Даже при сильной обиде я могу различить переживание и проверяемые факты.","reverse":true},{"id":34,"scale":"general","text":"Я стараюсь не делать общих выводов о своих способностях по одному случаю.","reverse":true},{"id":35,"scale":"reframe","text":"Когда я расстроен, альтернативные объяснения кажутся мне бессмысленными.","reverse":true},{"id":36,"scale":"cat","text":"Даже когда ситуация неопределённа, мне удаётся не считать худший исход наиболее вероятным.","reverse":true},{"id":37,"scale":"mind","text":"При неоднозначном поведении человека я держу в уме несколько разных объяснений.","reverse":true},{"id":38,"scale":"personal","text":"Разбирая общий провал, я обычно разделяю личный вклад и обстоятельства.","reverse":true},{"id":39,"scale":"binary","text":"Я обычно способен признать, что обе стороны спора частично правы.","reverse":true},{"id":40,"scale":"emotion","text":"Я способен сказать себе: «Это чувство настоящее, но его объяснение ещё стоит проверить».","reverse":true},{"id":41,"scale":"general","text":"Даже если знакомый разочаровал, я отдельно оцениваю другие его поступки.","reverse":true},{"id":42,"scale":"reframe","text":"Если первая версия событий вызывает сильную эмоцию, я редко пытаюсь её перепроверить.","reverse":true}]}</script><script>
(() => {'use strict';
const D=JSON.parse(document.getElementById('dataset').textContent);
const APP=document.getElementById('app');
const KEY='atlas-selfstudy-v2-'+D.slug;
let A={};let index=0;let screen='home';let mapOpen=false;
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const data=JSON.parse(localStorage.getItem(KEY)||'{}');if(data.version===2&&data.answers&&typeof data.answers==='object'){for(const q of D.items){let val=Number(data.answers[q.id]);if([1,2,3,4,5].includes(val))A[q.id]=val;}}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:2,answers:A}));}catch(e){}}
function answered(){return Object.keys(A).length;}
function ready(){return D.items.every(q=>A[q.id]!=null);}
function goTop(){window.scrollTo({top:0,behavior:'instant'});}
function choice(q,n){A[q.id]=n;persist();render();}
function goto(i){index=Math.max(0,Math.min(D.items.length-1,i));screen='quiz';mapOpen=false;render();goTop();}
function results(){if(!ready())return;screen='results';render();goTop();}
function scores(){return D.dimensions.map(d=>{const qq=D.items.filter(x=>x.scale===d.id);let n=qq.reduce((sum,q)=>sum+(q.reverse?6-A[q.id]:A[q.id]),0)/qq.length;return {...d,value:n,level:n<=2.4?'Ниже середины':n>=3.6?'Выше середины':'Вблизи середины',interpret:n<=2.4?d.low:n>=3.6?d.high:d.mid};});}
function summary(S){const ranked=[...S].sort((a,b)=>Math.abs(b.value-3)-Math.abs(a.value-3));if(Math.abs(ranked[0].value-3)<.5)return 'Ваши ответы не показывают резко выделяющихся тенденций в рамках этих семи шкал.';const leaders=ranked.filter(s=>Math.abs(s.value-3)>=.5).slice(0,2);return 'Наиболее заметные отклонения от средней точки авторской шкалы: '+leaders.map(x=>x.name.toLowerCase()+' ('+x.value.toFixed(2)+' из 5)').join(' и ')+'. Это описание ответов, без сравнения с нормами населения.';}
function button(text,id,kind='secondary',disabled=false){return `<button class="${kind}" id="${id}" ${disabled?'disabled':''}>${text}</button>`;}
function home(){const cnt=answered();return `<div class="hero"><div><div class="overline">${E(D.tag)} · ИССЛЕДОВАНИЕ ${D.number}</div><h1 class="display">${E(D.title)}</h1><p class="intro">${E(D.leadin)}</p><div class="info-line"><span>42 вопроса</span><span>7 измерений</span><span>Автономная работа</span></div><div class="action-row">${button(cnt?'Продолжить исследование →':'Начать исследование →','start','primary')}${cnt?button('Начать заново','reset'):''}</div><p class="mininote">${E(D.disclaimer)} Ответы сохраняются только в браузере на этом устройстве, если разрешено локальное хранилище.</p></div><div class="orb-zone" aria-hidden="true"><div class="orb"><span class="a"></span><span class="b"></span><div class="core">${D.number}</div></div><span class="orb-label">Самонаблюдение / ${D.number}</span></div></div><div class="blurb-box"><strong>Как проходить</strong><p>Оценивайте, насколько каждое утверждение соответствует вашему обычному поведению за последние несколько месяцев. Шкала от 1 («совсем не похоже») до 5 («очень похоже»). Выбирайте наиболее близкий ответ, включая неоднозначные ситуации. Можно возвращаться к вопросам и изменять ответы.</p></div>`;}
function quiz(){const q=D.items[index];const count=answered();const sel=A[q.id];return `<section class="quizlayout"><div class="eyebrowrow"><span>ВОПРОС ${index+1} / ${D.items.length}</span><span>ОТВЕЧЕНО ${count} / ${D.items.length}</span></div><div class="track"><div class="fill" style="width:${count/D.items.length*100}%"></div></div><div class="qcard"><span class="qtop">ОЦЕНИТЕ УТВЕРЖДЕНИЕ</span><h1 class="qtext">${E(q.text)}</h1><p class="qhint">Насколько это похоже на вас в обычной жизни?</p><div class="choices" role="group" aria-label="Оцените от одного до пяти">${[1,2,3,4,5].map(n=>`<button class="choice" type="button" data-value="${n}" aria-pressed="${sel===n}" aria-label="${n} из 5">${n}</button>`).join('')}</div><div class="scalelabels"><span>Совсем не похоже</span><span>Очень похоже</span></div></div><div class="navrow"><div class="navleft">${button('← Назад','prev','secondary',index===0)}<button class="quiet" id="mapToggle" aria-expanded="${mapOpen}">${mapOpen?'Скрыть карту':'Карта вопросов'}</button></div>${index===D.items.length-1?button('Показать результаты →','next','primary',!ready()):button('Следующий →','next','primary',sel==null)}</div>${mapOpen?`<div class="map-wrap"><strong>Перейти к вопросу</strong><div class="mapgrid">${D.items.map((x,i)=>`<button class="mapbtn ${A[x.id]!=null?'done':''} ${index===i?'current':''}" data-jump="${i}" aria-label="Вопрос ${i+1}, ${A[x.id]!=null?'отвечен':'без ответа'}">${i+1}</button>`).join('')}</div></div>`:''}<p class="mininote">Подсказка: клавиши 1–5 выбирают ответ; Enter открывает следующий вопрос. До завершения можно менять решения.</p></section>`;}
function radar(S){const n=S.length;const cx=205,cy=205,R=142;
 function pt(i,v){let a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
 const lines=[.25,.5,.75,1].map(fr=>`<polygon class="rule" points="${S.map((s,i)=>pt(i,fr).join(',')).join(' ')}"></polygon>`).join('');
 const axes=S.map((s,i)=>`<line class="axis" x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}"></line>`).join('');
 const vertices=S.map((s,i)=>pt(i,(s.value-1)/4));
 const polygon=`<polygon class="poly" points="${vertices.map(p=>p.join(',')).join(' ')}"></polygon>`;
 const dots=vertices.map(([x,y])=>`<circle class="dot" cx="${x}" cy="${y}" r="4"></circle>`).join('');
 const labs=S.map((s,i)=>{const [x,y]=pt(i,1.21);let anchor=x>cx+10?'start':x<cx-10?'end':'middle';return `<text class="rlab" x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="central">${E(s.short)}</text>`}).join('');
 return `<svg class="radar" viewBox="0 0 410 410" role="img" aria-label="Радарная диаграмма семи авторских шкал">${lines}${axes}${polygon}${dots}${labs}</svg>`;
}
function warnings(){const values=Object.values(A),freq={};values.forEach(v=>freq[v]=(freq[v]||0)+1);return Math.max(...Object.values(freq))>=34?'<p class="warning"><strong>Обратите внимание.</strong> Большинство ответов одинаковы. Это допустимо, но ограничивает различимость шкал. Вопросы с обратной формулировкой дополнительно влияют на результат.</p>':'';}
function reportText(S){return `${D.title}\nПсихологический атлас · Исследование № ${D.number}\nДата: ${new Date().toLocaleDateString('ru-RU')}\n\n${summary(S)}\n\n`+S.map(s=>`${s.name}: ${s.value.toFixed(2)} / 5 (${s.level}).\n${s.interpret}\nВопрос для наблюдения: ${s.probe}`).join('\n\n')+`\n\n${D.disclaimer}\nБаллы являются средними по 6 утверждениям на шкалу с обратным кодированием. Нормативных процентилей нет.\n`}
function report(){const S=scores();return `<section class="results"><div class="results-head"><p class="overline">РЕЗУЛЬТАТ · ИССЛЕДОВАНИЕ ${D.number}</p><h1>Ваш профиль</h1><p>${E(summary(S))}</p></div><div class="report-top"><div class="panel"><h2>Карта семи измерений</h2><div class="chartwrap">${radar(S)}</div><p class="muted">Диаграмма показывает средние баллы от 1 до 5. Значения сравнимы только внутри этого авторского опросника. Шкалы описывают разные стороны опыта и не складываются в общий «психотип».</p></div><div class="panel"><h2>Выраженность шкал</h2>${S.map(s=>`<div class="barlabel"><span>${E(s.name)}</span><b>${s.value.toFixed(2)} / 5</b></div><div class="bar"><div class="v" style="width:${((s.value-1)/4*100).toFixed(1)}%"></div></div>`).join('')}<div class="observation"><div class="chip">${E(D.disclaimer)}</div></div></div></div><h2 class="subhead">Что показывают ваши ответы</h2><div class="detail-grid">${S.map(s=>`<article class="detail"><div class="grade">${s.value.toFixed(2)} / 5 · ${s.level}</div><h3>${E(s.name)}</h3><p>${E(s.interpret)}</p><small>Для размышления: ${E(s.probe)}</small></article>`).join('')}</div>${warnings()}<div class="warning"><strong>Как читать результаты.</strong> Значения усреднены по шести пунктам каждой шкалы (с учётом обратных вопросов). Уровни определены условными границами 2,4 и 3,6; стандартизация на выборке отсутствует. Повторное прохождение может дать иной профиль.</div><div class="export-row">${button('Изменить ответы','edit','secondary')}${button('Скопировать отчёт','copy','secondary')}${button('Скачать TXT','txt','secondary')}${button('Скачать JSON','json','secondary')}${button('Печать / PDF','print','primary')}</div><p class="mininote">Результаты можно сохранить вручную. При нажатии «Начать заново» локальные ответы очищаются.</p></section>`;}
function render(){APP.innerHTML=screen==='home'?home():screen==='quiz'?quiz():report();bind();}
function bind(){let el=id=>document.getElementById(id);let listen=(id,fn)=>{let x=el(id);if(x)x.addEventListener('click',fn)};
 listen('start',()=>goto(Math.max(0,D.items.findIndex(q=>A[q.id]==null))));
 listen('reset',()=>{if(confirm('Сбросить все ответы и начать заново?')){A={};persist();goto(0)}});
 listen('homeLink',(e)=>{e.preventDefault();screen='home';render();goTop()});
 if(screen==='quiz'){
  document.querySelectorAll('[data-value]').forEach(x=>x.addEventListener('click',()=>choice(D.items[index],Number(x.dataset.value))));
  listen('prev',()=>goto(index-1));listen('next',()=>{if(index===D.items.length-1)results();else goto(index+1)});
  listen('mapToggle',()=>{mapOpen=!mapOpen;render()});
  document.querySelectorAll('[data-jump]').forEach(x=>x.addEventListener('click',()=>goto(Number(x.dataset.jump))));
 }
 if(screen==='results'){
  listen('edit',()=>goto(0));listen('txt',()=>download(reportText(scores()),'text/plain;charset=utf-8','.txt'));
  listen('json',()=>download(JSON.stringify({title:D.title,number:D.number,created:new Date().toISOString(),scores:scores().map(x=>({id:x.id,name:x.name,value:+x.value.toFixed(3)})),answers:D.items.map(q=>({id:q.id,response:A[q.id]})),notice:D.disclaimer},null,2),'application/json;charset=utf-8','.json'));
  listen('print',()=>window.print());listen('copy',async()=>{try{await navigator.clipboard.writeText(reportText(scores()));toast('Отчёт скопирован')}catch(e){toast('Копирование ограничено браузером. Можно скачать TXT.')}});
 }
}
function download(content,type,ext){let blob=new Blob([content],{type});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='atlas_'+D.number+'_'+D.slug+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);}
function toast(message){const n=document.createElement('div');n.className='toast';n.textContent=message;document.body.appendChild(n);setTimeout(()=>n.remove(),2400);}
document.addEventListener('keydown',e=>{if(screen!=='quiz'||e.altKey||e.metaKey||e.ctrlKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(/^[1-5]$/.test(e.key)){choice(D.items[index],Number(e.key));}else if(e.key==='Enter' && A[D.items[index].id]!=null){e.preventDefault();if(index===D.items.length-1)results();else goto(index+1)}else if(e.key==='ArrowLeft'&&index>0){goto(index-1)}else if(e.key==='ArrowRight'&&A[D.items[index].id]!=null){if(index===D.items.length-1)results();else goto(index+1)}});
render();
})();</script></body></html>
