name: Sofya 2026-11-15 lesson publication (temporary)
on:
  push:
    branches:
      - feat/sofya-20261115-lesson
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript embedded in both lesson pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for path in [
              Path("students/sofya_kalney/site/15.11.26.html"),
              Path("students/sofya_kalney/site/15.11.26-lab.html"),
          ]:
              body=path.read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',body)
              assert len(scripts)==1, f"{path}: expected one inline script"
              tmp=Path("/tmp")/(path.stem.replace(".","_")+".js")
              tmp.write_text(scripts[0])
              subprocess.run(["node","--check",str(tmp)],check=True)
          PY
      - name: Publication dry run (required)
        run: node scripts/publish-lesson.mjs sofya_kalney 15.11.26 --intent students/sofya_kalney/site/data/lesson-publication-intents/2026-11-15.json --dry-run
      - name: Transactional v2 publication
        run: node scripts/publish-lesson.mjs sofya_kalney 15.11.26 --intent students/sofya_kalney/site/data/lesson-publication-intents/2026-11-15.json
      - name: Validate student platform package
        run: |
          node scripts/student.mjs validate sofya_kalney
          node shared/practice/validate-configs.mjs
      - name: Commit generated projections to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/sofya_kalney/site/lesson-registry.js \
            students/sofya_kalney/site/dashboard.js \
            students/sofya_kalney/site/data/lessons/2026-11-15.lesson.json \
            students/sofya_kalney/site/data/ktp-state.json \
            students/sofya_kalney/site/data/mastery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(sofya): publish 15 November lesson through v2 pipeline"
            git push origin HEAD:feat/sofya-20261115-lesson
          fi
