name: One-shot material upload
on:
  push:
    paths:
      - '.upload-temp/READY'

permissions:
  contents: write

jobs:
  decode-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode TeX and poster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p students/grisha_arkhipov/tex_docs students/grisha_arkhipov/pdf_docs students/grisha_arkhipov/images
          cat .upload-temp/tex.* | base64 --decode > students/grisha_arkhipov/tex_docs/07.10.26.tex
          cat .upload-temp/png.* | base64 --decode > students/grisha_arkhipov/images/07.10.26.png
          test -s students/grisha_arkhipov/tex_docs/07.10.26.tex
          test -s students/grisha_arkhipov/images/07.10.26.png

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: students/grisha_arkhipov/tex_docs/07.10.26.tex
          latexmk_use_xelatex: false

      - name: Verify and commit outputs
        shell: bash
        run: |
          set -euo pipefail
          PDF_SRC="$(find . -type f -name '07.10.26.pdf' ! -path './students/grisha_arkhipov/pdf_docs/*' -print -quit)"
          test -n "$PDF_SRC"
          cp "$PDF_SRC" students/grisha_arkhipov/pdf_docs/07.10.26.pdf
          test -s students/grisha_arkhipov/pdf_docs/07.10.26.pdf
          rm -rf .upload-temp
          rm -f .github/workflows/one-shot-grisha-071026.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 07.10.26 materials for Grigory Arkhipov"
          git push origin HEAD:main
