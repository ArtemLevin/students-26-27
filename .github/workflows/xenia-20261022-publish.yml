name: One-shot Xenia 22 October publication
on:
  push:
    branches:
      - lesson/xenia-2026-10-22-divisibility
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lesson/xenia-2026-10-22-divisibility
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run publication and verify executable plan
        shell: bash
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 22.10.26 --intent students/xenia_klykova/site/data/publication-intents/2026-10-22.json --dry-run | tee /tmp/xenia-plan.json
          node -e "const p=require('/tmp/xenia-plan.json'); if (!p.executable || p.conflicts.length || p.reviewItems.length) process.exit(1)"
      - name: Transactional publish using official v2 script
        run: node scripts/publish-lesson.mjs xenia_klykova 22.10.26 --intent students/xenia_klykova/site/data/publication-intents/2026-10-22.json
      - name: Release validation
        run: |
          node scripts/student.mjs validate xenia_klykova
          node students/xenia_klykova/site/tests/dashboard-regression.mjs
      - name: Commit publisher outputs and retire this one-shot runner
        shell: bash
        run: |
          rm .github/workflows/xenia-20261022-publish.yml
          git add students/xenia_klykova/site/data/lessons/2026-10-22.lesson.json students/xenia_klykova/site/lesson-registry.js students/xenia_klykova/site/data/ktp-state.json students/xenia_klykova/site/data/mastery-state.json .github/workflows/xenia-20261022-publish.yml
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish Xenia 22 Oct lesson with v2 transaction'
          git push origin HEAD:lesson/xenia-2026-10-22-divisibility
