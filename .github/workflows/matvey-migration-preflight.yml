name: Matvey migration preflight

on:
  push:
    branches:
      - 'feat/student-platform-v2-migrate-matvey-gorbachev'

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-migrate-matvey-gorbachev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect reconciled source
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state matvey_gorbachev --json > /tmp/matvey.json
          node - <<'NODE'
          const r=require('/tmp/matvey.json');
          const counts={};
          for(const item of r.mastery.resolved)counts[item.level]=(counts[item.level]||0)+1;
          if(!r.automaticEligible)process.exit(1);
          if(r.catalog?.count!==342||r.mastery?.resolved?.length!==342)process.exit(2);
          if(counts[0]!==281||counts[2]!==61||Object.keys(counts).length!==2)process.exit(3);
          if(r.mastery?.conflicts?.length||r.diagnostics?.orphanClaims?.length||r.diagnostics?.warnings?.length)process.exit(4);
          if(!r.mastery.resolved.every(x=>x.sourceKind==='mastery-authority'&&x.sourcePath==='site/mastery-authority.js'))process.exit(5);
          NODE

      - name: Generate candidate manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report=require('/tmp/matvey.json');
          const manifest={
            version:1,
            studentId:'matvey_gorbachev',
            identity:{
              studentName:'Матвей Горбачёв',
              program:'ЕГЭ · профильная математика'
            },
            sourceArchitecture:'legacy-structured',
            planning:{mode:'rolling',ktpExtraction:null},
            lessonMappings:[
              {lessonDate:'2026-09-13',ktpMatches:[]},
              {lessonDate:'2026-09-17',ktpMatches:[]},
              {lessonDate:'2026-09-20',ktpMatches:[]},
              {lessonDate:'2026-09-24',ktpMatches:[]},
              {lessonDate:'2026-09-27',ktpMatches:[]}
            ],
            competencyMappings:[],
            preserveMastery:report.mastery.resolved.map(item=>({
              competencyId:item.competencyId,
              level:item.level,
              sourcePath:item.sourcePath,
              sourceKind:item.sourceKind,
              confidence:'exact',
              basis:item.basis
            })),
            ambiguities:[],
            blockers:[],
            warnings:[]
          };
          fs.mkdirSync('pipeline/migration/manifests',{recursive:true});
          fs.writeFileSync('pipeline/migration/manifests/matvey_gorbachev.json',JSON.stringify(manifest,null,2)+'\n');
          NODE

      - name: Validate manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/matvey_gorbachev.json --json

      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate matvey_gorbachev \
            --manifest pipeline/migration/manifests/matvey_gorbachev.json \
            --date 2026-10-02 \
            --dry-run \
            --json > /tmp/dry-run.json
          node - <<'NODE'
          const p=require('/tmp/dry-run.json'),c=p.coverage;
          console.log(JSON.stringify({warnings:p.warnings,reviewItems:p.reviewItems,blockers:p.blockers,coverage:c,projectedBaseline:p.projectedBaseline},null,2));
          if(!p.executable||!c?.complete)process.exit(1);
          if(c.lessons?.source!==5||c.lessons?.candidate!==5)process.exit(2);
          if(c.ktp?.mappedHistoricalLessons!==0)process.exit(3);
          if(c.competencies?.source!==342||c.competencies?.candidate!==342)process.exit(4);
          if(c.mastery?.resolvedSource!==342||c.mastery?.candidate!==342||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(5);
          if((p.reviewItems||[]).length||(p.blockers||[]).length||(p.warnings||[]).length)process.exit(6);
          NODE

      - name: Commit candidate manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/migration/manifests/matvey_gorbachev.json
          git diff --cached --quiet && exit 1 || true
          git commit -m "Reconciliation: generate Matvey migration manifest"
          git push origin HEAD:feat/student-platform-v2-migrate-matvey-gorbachev
