name: Publish Timofey October 27 lesson (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - "students/timofey/site/27.10.26.html"
      - "students/timofey/site/data/publication-intents/2026-10-27.json"
      - ".github/workflows/publish-timofey-20261027.yml"
permissions:
  contents: write
jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/timofey-20261027-trigonometry
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Transactional publish with dry-run
        shell: bash
        run: |
          set -euo pipefail
          if test -f students/timofey/site/data/lessons/2026-10-27.lesson.json; then
            echo 'Already published; no duplicate publication.'
            exit 0
          fi
          node scripts/publish-lesson.mjs timofey 27.10.26 --intent students/timofey/site/data/publication-intents/2026-10-27.json --dry-run
          node scripts/publish-lesson.mjs timofey 27.10.26 --intent students/timofey/site/data/publication-intents/2026-10-27.json
          node scripts/student.mjs validate timofey
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- students/timofey/site/lesson-registry.js students/timofey/site/data/lessons/2026-10-27.lesson.json students/timofey/site/data/ktp-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(timofey): publish lesson via v2 transaction'
            git push origin HEAD:feat/timofey-20261027-trigonometry
          fi
