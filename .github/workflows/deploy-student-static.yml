name: Student static deployment

on:
  pull_request:
    paths:
      - 'deploy/student-static/**'
      - '.github/workflows/deploy-student-static.yml'
  push:
    branches:
      - main
    paths:
      - 'students/**'
      - 'shared/student-dashboard/**'
      - 'shared/practice/**'
      - 'deploy/student-static/**'
      - '.github/workflows/deploy-student-static.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-static-production
  cancel-in-progress: true

jobs:
  verify:
    name: verify deployment builder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deploy/student-static/build.test.mjs

  deploy:
    name: deploy to VPS
    needs: verify
    if: >-
      vars.ENABLE_VPS_DEPLOY == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      STUDENT_URL_MAP: ${{ secrets.STUDENT_URL_MAP }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      DEPLOY_BUILD_DIR: .deploy-dist
      DEPLOY_ROOT: /srv/students-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STUDENT_URL_MAP" || { echo 'Missing STUDENT_URL_MAP secret'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo 'Missing VPS_SSH_KEY secret'; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo 'Missing VPS_KNOWN_HOSTS secret'; exit 1; }
          test -n "$VPS_HOST" || { echo 'Missing VPS_HOST variable'; exit 1; }
          test -n "$VPS_USER" || { echo 'Missing VPS_USER variable'; exit 1; }

      - name: Build static bundle
        run: node deploy/student-static/build.mjs

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ARCHIVE="$RUNNER_TEMP/student-static-${GITHUB_SHA}.tar.gz"
          tar -C "$DEPLOY_BUILD_DIR" -czf "$ARCHIVE" .
          scp -q -P "$PORT" "$ARCHIVE" "$VPS_USER@$VPS_HOST:/tmp/student-static-${GITHUB_SHA}.tar.gz"

      - name: Activate release atomically
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "RELEASE_SHA='$GITHUB_SHA' DEPLOY_ROOT='$DEPLOY_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/student-static-${RELEASE_SHA}.tar.gz"
          release="${DEPLOY_ROOT}/releases/${RELEASE_SHA}"
          next_link="${DEPLOY_ROOT}/current.next"
          current_link="${DEPLOY_ROOT}/current"

          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"
          rm -f "$archive"

          ln -sfn "$release" "$next_link"
          mv -Tf "$next_link" "$current_link"

          # Keep the five newest releases for quick manual rollback.
          mapfile -t old_releases < <(ls -1dt "${DEPLOY_ROOT}"/releases/* 2>/dev/null | tail -n +6 || true)
          if ((${#old_releases[@]})); then
            rm -rf -- "${old_releases[@]}"
          fi
          REMOTE
