name: Timofey 14 Nov 2026 lesson publication
on:
  push:
    branches:
      - lesson/timofey-2026-11-14-optimization
    paths:
      - .github/workflows/timofey-20261114-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry run canonical publisher
        run: node scripts/publish-lesson.mjs timofey 14.11.26 --intent students/timofey/site/data/publication-intents/2026-11-14.json --dry-run
      - name: Publish with Student Platform v2
        run: node scripts/publish-lesson.mjs timofey 14.11.26 --intent students/timofey/site/data/publication-intents/2026-11-14.json
      - name: Validate student package
        run: node scripts/student.mjs validate timofey
      - name: Validate practice configuration
        run: node shared/practice/validate-configs.mjs
      - name: Check lesson HTML and inline JavaScript
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const site='students/timofey/site';
          for(const file of ['14.11.26.html','14.11.26-lab.html']){
            const name=path.join(site,file),html=fs.readFileSync(name,'utf8');
            const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            assert.ok(scripts.length,file+' has no script');
            for(const [,body] of scripts)new vm.Script(body,{filename:file});
            const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]);
            assert.equal(new Set(ids).size,ids.length,file+' duplicate IDs');
            for(const [,href] of html.matchAll(/\bhref=["']([^"']+)["']/g)){
              if(href.startsWith('#')||href.includes('://'))continue;
              assert.ok(fs.existsSync(path.resolve(site,href.split('#')[0])),file+' missing link '+href);
            }
            console.log('PASS',file,'scripts',scripts.length,'IDs',ids.length);
          }
          const lesson=fs.readFileSync(path.join(site,'14.11.26.html'),'utf8');
          const meta=JSON.parse(fs.readFileSync(path.join(site,'data/lessons/2026-11-14.lesson.json'),'utf8'));
          for(const item of meta.outcomes)assert.ok(lesson.includes('id="'+item.evidenceAnchor+'"'),item.competencyId+' missing anchor');
          const workers=t=>4*t*t+(24-t)**2,plants=t=>4*t**3+(20-t)**3,price=x=>x/2+1+32/x,tax=t=>7000*t-t*t/2;
          assert.equal(workers(5),461);assert.equal(plants(7),3569);assert.equal(price(8),9);assert.equal(tax(7000),24500000);
          console.log('PASS source mathematics and evidence anchors');
          JS
      - name: Commit generated publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/timofey/site/lesson-registry.js students/timofey/site/data/lessons/2026-11-14.lesson.json students/timofey/site/data/ktp-state.json students/timofey/site/data/mastery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(timofey): publish 14 Nov lesson via v2"
            git push origin HEAD:lesson/timofey-2026-11-14-optimization
          fi
