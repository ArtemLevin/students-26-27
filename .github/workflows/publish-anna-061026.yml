name: Publish Anna lesson 06.10.26

on:
  push:
    branches: [site-anna-061026]
    paths:
      - ".github/workflows/publish-anna-061026.yml"
      - "students/anna_trapeznikova/site/06.10.26.html"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-anna-061026
          fetch-depth: 0

      - name: Prepare reviewed publication intent
        shell: bash
        run: |
          cat > /tmp/anna-061026-intent.json <<'JSON'
          {
            "version": 1,
            "studentId": "anna_trapeznikova",
            "lessonDate": "2026-10-06",
            "topics": [
              "неравенства с модулем",
              "замена t = |x|",
              "несколько модулей и интервалы",
              "вложенные модули",
              "сравнение модулей через квадраты"
            ],
            "actualSummary": "Отработаны четыре маршрута решения неравенств с модулем: замена t = |x| с обязательным t ≥ 0, разбиение оси по нулям подмодульных выражений, последовательное раскрытие вложенных модулей и сравнение модулей через квадраты при обоснованной неотрицательности. Уровни mastery автоматически не повышаются: занятие фиксируется как практика.",
            "ktpMatches": [],
            "outcomes": [
              {
                "competencyId": "real_numbers_15",
                "evidenceAnchor": "squares",
                "relation": "practiced",
                "confidence": "exact",
                "decision": "apply",
                "masteryClaim": null,
                "basis": "На странице закреплено свойство неотрицательности модуля и равносильное сравнение квадратов двух модулей."
              },
              {
                "competencyId": "real_numbers_16",
                "evidenceAnchor": "nested",
                "relation": "practiced",
                "confidence": "exact",
                "decision": "apply",
                "masteryClaim": null,
                "basis": "Занятие содержит практику неравенств с вложенным модулем и переход к обычным неравенствам."
              },
              {
                "competencyId": "rational_equations_08",
                "evidenceAnchor": "intervals",
                "relation": "practiced",
                "confidence": "exact",
                "decision": "apply",
                "masteryClaim": null,
                "basis": "При нескольких модулях каждое раскрытие решается как система с условием принадлежности соответствующему промежутку."
              },
              {
                "competencyId": "rational_equations_09",
                "evidenceAnchor": "substitution",
                "relation": "practiced",
                "confidence": "exact",
                "decision": "apply",
                "masteryClaim": null,
                "basis": "После замены t = |x| ученик решает квадратное неравенство относительно t."
              },
              {
                "competencyId": "sets_logic_03",
                "evidenceAnchor": "intervals",
                "relation": "practiced",
                "confidence": "exact",
                "decision": "apply",
                "masteryClaim": null,
                "basis": "Итог нескольких разобранных случаев собирается объединением подходящих множеств решений."
              },
              {
                "competencyId": "sets_logic_04",
                "evidenceAnchor": "intervals",
                "relation": "practiced",
                "confidence": "exact",
                "decision": "apply",
                "masteryClaim": null,
                "basis": "Внутри каждого случая решение раскрытого неравенства пересекается с условием соответствующего промежутка."
              }
            ],
            "warnings": []
          }
          JSON

      - name: Publication dry-run
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs anna_trapeznikova 06.10.26 --intent /tmp/anna-061026-intent.json --dry-run | tee /tmp/dry-run.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/dry-run.json','utf8'));
          if(!p.executable) {
            console.error(JSON.stringify({reviewItems:p.reviewItems,conflicts:p.conflicts,warnings:p.warnings},null,2));
            process.exit(1);
          }
          console.log(JSON.stringify({executable:p.executable,reviewItems:p.reviewItems,conflicts:p.conflicts,warnings:p.warnings,changedFiles:p.changedFiles},null,2));
          NODE

      - name: Publish through Student Platform v2
        run: node scripts/publish-lesson.mjs anna_trapeznikova 06.10.26 --intent /tmp/anna-061026-intent.json

      - name: Validate student package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/student.mjs validate anna_trapeznikova
          node students/anna_trapeznikova/site/tests/student-platform-v2.test.mjs

      - name: Static lesson checks
        shell: bash
        run: |
          set -euo pipefail
          test -f students/anna_trapeznikova/site/06.10.26.html
          test -f students/anna_trapeznikova/pdf_docs/06.10.26.pdf
          test -f students/anna_trapeznikova/tex_docs/06.10.26.tex
          test -f students/anna_trapeznikova/images/06.10.26.png
          ! grep -nE 'TODO|FIXME|href="#"' students/anna_trapeznikova/site/06.10.26.html
          grep -q 'id="substitution"' students/anna_trapeznikova/site/06.10.26.html
          grep -q 'id="intervals"' students/anna_trapeznikova/site/06.10.26.html
          grep -q 'id="nested"' students/anna_trapeznikova/site/06.10.26.html
          grep -q 'id="squares"' students/anna_trapeznikova/site/06.10.26.html

      - name: Commit publication outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/anna_trapeznikova/site/data/lessons/2026-10-06.lesson.json                   students/anna_trapeznikova/site/data/ktp-state.json                   students/anna_trapeznikova/site/data/mastery-state.json                   students/anna_trapeznikova/site/lesson-registry.js
          if git diff --cached --quiet; then
            echo "No publisher changes."
          else
            git commit -m "Анна Трапезникова: публикация занятия 06.10.26"
            git push origin HEAD:site-anna-061026
          fi
