name: Ekaterina Gnedkova reconciliation verify

on:
  push:
    branches:
      - 'feat/student-platform-v2-reconcile-ekaterina-gnedkova'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-reconcile-ekaterina-gnedkova

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check reconciliation modules
        run: |
          node --check pipeline/migration/legacy/sandbox.mjs
          node --check pipeline/migration/legacy/inspect-learning-state.mjs
          node --check students/ekaterina_gnedkova/site/mastery-authority.js

      - name: Run focused migration tests
        run: |
          node --test pipeline/migration/test/legacy-state.test.mjs
          node --test pipeline/migration/test/readiness-inventory.test.mjs

      - name: Verify real Ekaterina reconciliation
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state ekaterina_gnedkova --json > /tmp/ekaterina-g.json
          node -e "const r=require('/tmp/ekaterina-g.json'); if(r.catalog?.count!==369)process.exit(1); if(r.mastery?.resolved?.length!==369)process.exit(2); if(r.mastery?.conflicts?.length)process.exit(3); if(r.diagnostics?.orphanClaims?.length)process.exit(4); if(r.diagnostics?.warnings?.length)process.exit(5); if(!r.automaticEligible)process.exit(6); const deps=r.diagnostics?.scriptDependencies||[]; if(deps.length!==5)process.exit(7); const zero=r.mastery.resolved.find(x=>x.competencyId==='ege27_01_001'); const vector=r.mastery.resolved.find(x=>x.competencyId==='ege27_02_001'); if(zero?.level!==0||vector?.level!==3)process.exit(8); console.log(JSON.stringify({catalog:r.catalog.count,mastery:r.mastery.resolved.length,dependencies:deps.length,automaticEligible:r.automaticEligible},null,2));"

      - name: Verify readiness transition
        shell: bash
        run: |
          node pipeline/migration/readiness-inventory.mjs --json > /tmp/readiness.json
          node -e "const r=require('/tmp/readiness.json'); const x=r.students.find(s=>s.studentId==='ekaterina_gnedkova'); if(!x)process.exit(1); if(x.status!=='ready'||x.competencies!==369||x.mastery!==369)process.exit(2); console.log(JSON.stringify(x,null,2));"
