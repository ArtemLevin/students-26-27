name: Nastya Pavlova migration apply

on:
  push:
    branches:
      - 'feat/student-platform-v2-migrate-nastya-pavlova'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-migrate-nastya-pavlova
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate reviewed manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/nastya_pavlova.json --json

      - name: Reconcile manifest against current authority
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state nastya_pavlova --json > /tmp/nastya.json
          node - <<'NODE'
          const manifest=require('./pipeline/migration/manifests/nastya_pavlova.json');
          const report=require('/tmp/nastya.json');
          if(!report.automaticEligible)process.exit(1);
          if(report.catalog?.count!==379||report.mastery?.resolved?.length!==367)process.exit(2);
          const expected=new Map(report.mastery.resolved.map(x=>[x.competencyId,x.level]));
          if(manifest.preserveMastery.length!==expected.size)process.exit(3);
          for(const item of manifest.preserveMastery){
            if(expected.get(item.competencyId)!==item.level)process.exit(4);
            if(item.sourcePath!=='mastery-authority.js'||item.sourceKind!=='mastery-authority'||item.confidence!=='exact')process.exit(5);
          }
          const newIds=[
            'ege2027_t6_random_variable','ege2027_t6_distribution','ege2027_t6_expectation',
            'ege2027_t6_variance','ege2027_t6_stddev','ege2027_t6_distributions',
            'ege2027_t17_variables','ege2027_t17_relations','ege2027_t17_constraints',
            'ege2027_t17_analysis','ege2027_t17_optimization','ege2027_t17_interpretation'
          ];
          const manifestIds=new Set(manifest.preserveMastery.map(x=>x.competencyId));
          if(newIds.some(id=>manifestIds.has(id)))process.exit(6);
          NODE

      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate nastya_pavlova \
            --manifest pipeline/migration/manifests/nastya_pavlova.json \
            --date 2026-10-02 \
            --dry-run \
            --json > /tmp/dry-run.json
          node - <<'NODE'
          const p=require('/tmp/dry-run.json'),c=p.coverage;
          if(!p.executable||!c?.complete)process.exit(1);
          if(c.lessons?.source!==9||c.lessons?.candidate!==9)process.exit(2);
          if(c.ktp?.mappedHistoricalLessons!==0)process.exit(3);
          if(c.competencies?.source!==379||c.competencies?.candidate!==379)process.exit(4);
          if(c.mastery?.resolvedSource!==367||c.mastery?.candidate!==367||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(5);
          if((p.reviewItems||[]).length||(p.blockers||[]).length)process.exit(6);
          const warnings=(p.warnings||[]).map(value=>typeof value==='string'?JSON.parse(value):value);
          const canonical=item=>[item.type,item.lessonDate,item.count].join('|');
          const actual=warnings.map(canonical).sort();
          const expected=['legacy-outcomes-preserved|2026-08-26|8','legacy-outcomes-preserved|2026-09-03|9'].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected))process.exit(7);
          NODE

      - name: Transactional apply
        run: |
          node scripts/student.mjs migrate nastya_pavlova \
            --manifest pipeline/migration/manifests/nastya_pavlova.json \
            --date 2026-10-02 \
            --apply \
            --json

      - name: Validate migrated package
        run: node scripts/student.mjs validate nastya_pavlova --json

      - name: Verify canonical catalog and mastery preservation
        run: |
          node - <<'NODE'
          const catalog=require('./students/nastya_pavlova/site/data/competency-catalog.json');
          const state=require('./students/nastya_pavlova/site/data/mastery-state.json');
          const catalogIds=new Set(catalog.groups.flatMap(group=>group.items).map(item=>item.id));
          const values=Object.values(state.levels);
          const counts={};
          for(const value of values){
            counts[value.level]=(counts[value.level]||0)+1;
            if(value.sourcePath!=='mastery-authority.js'||value.sourceKind!=='mastery-authority')process.exit(1);
          }
          if(catalogIds.size!==379||values.length!==367)process.exit(2);
          if(counts[0]!==314||counts[2]!==53||Object.keys(counts).length!==2)process.exit(3);
          const newIds=[
            'ege2027_t6_random_variable','ege2027_t6_distribution','ege2027_t6_expectation',
            'ege2027_t6_variance','ege2027_t6_stddev','ege2027_t6_distributions',
            'ege2027_t17_variables','ege2027_t17_relations','ege2027_t17_constraints',
            'ege2027_t17_analysis','ege2027_t17_optimization','ege2027_t17_interpretation'
          ];
          for(const id of newIds){
            if(!catalogIds.has(id))process.exit(4);
            if(Object.prototype.hasOwnProperty.call(state.levels,id))process.exit(5);
          }
          NODE

      - name: Verify migration report and ratchet target
        run: |
          node - <<'NODE'
          const report=require('./pipeline/migration/reports/nastya_pavlova.json');
          const baseline=require('./pipeline/migration/baseline.json');
          if(!report.complete)process.exit(1);
          if(report.lessons.source!==9||report.lessons.candidate!==9)process.exit(2);
          if(report.ktp.mappedHistoricalLessons!==0)process.exit(3);
          if(report.competencies.source!==379||report.competencies.candidate!==379)process.exit(4);
          if(report.mastery.resolvedSource!==367||report.mastery.candidate!==367||report.mastery.conflicts!==0||report.mastery.orphans!==0)process.exit(5);
          if(report.materials.html!==9||report.materials.pdf!==8||report.materials.tex!==9||report.materials.lab!==7)process.exit(6);
          if(report.preservation.protectedFilesChanged.length)process.exit(7);
          if(report.reviewItems.length||report.blockers.length)process.exit(8);
          const warnings=(report.warnings||[]).map(value=>typeof value==='string'?JSON.parse(value):value);
          const canonical=item=>[item.type,item.lessonDate,item.count].join('|');
          const actual=warnings.map(canonical).sort();
          const expected=['legacy-outcomes-preserved|2026-08-26|8','legacy-outcomes-preserved|2026-09-03|9'].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected))process.exit(9);
          if(baseline.minV2!==22||baseline.maxNonV2!==2||baseline.byArchitecture?.v2!==22||baseline.byArchitecture?.['legacy-structured']!==2)process.exit(10);
          NODE

      - name: Run migration regression suite
        run: node --test pipeline/migration/test/*.test.mjs

      - name: Enforce architecture ratchet
        run: node pipeline/migration/audit-ratchet.mjs

      - name: Commit generated migration state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/migration/baseline.json \
            pipeline/migration/reports/nastya_pavlova.json \
            students/nastya_pavlova/student-contract.json \
            students/nastya_pavlova/site/data \
            students/nastya_pavlova/site/lesson-registry.js \
            students/nastya_pavlova/site/tests/student-platform-v2.test.mjs
          if git diff --cached --quiet; then
            echo "Migration produced no generated changes"
            exit 1
          fi
          git commit -m "Reconciliation: apply Nastya Pavlova Student Platform v2 migration"
          git push origin HEAD:feat/student-platform-v2-migrate-nastya-pavlova
