name: Temporary Xenia lesson publication
on:
  push:
    branches:
      - codex/xenia-lesson-20261015-site
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review publication dry-run
        run: node scripts/publish-lesson.mjs xenia_vasilchenko 15.10.26 --intent students/xenia_vasilchenko/site/data/publication-intents/2026-10-15.json --dry-run
      - name: Transactional lesson publication
        run: node scripts/publish-lesson.mjs xenia_vasilchenko 15.10.26 --intent students/xenia_vasilchenko/site/data/publication-intents/2026-10-15.json
      - name: Validate student
        run: node scripts/student.mjs validate xenia_vasilchenko
      - name: Commit canonical publisher output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/xenia_vasilchenko/site/data/lessons/2026-10-15.lesson.json students/xenia_vasilchenko/site/data/ktp-state.json students/xenia_vasilchenko/site/lesson-registry.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(xenia): publish October 15 lesson via v2 publisher"
            git push origin HEAD:codex/xenia-lesson-20261015-site
          fi
