name: Historical learning coverage recovery
on:
  pull_request:
    paths:
      - 'scripts/recover-learning-coverage*'
      - '.github/workflows/learning-coverage-recovery.yml'
      - 'docs/heatmap-recovery/timofey-2026-07-21.preview.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recovery unit tests
        run: node --test scripts/recover-learning-coverage.test.mjs scripts/audit-learning-coverage.test.mjs
      - name: Read-only pilot and seal candidate
        shell: bash
        run: |
          node scripts/recover-learning-coverage.mjs docs/heatmap-recovery/timofey-2026-07-21.preview.json --dry-run > "$RUNNER_TEMP/preview.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/preview.json","utf8"));
            const manifest=JSON.parse(fs.readFileSync("docs/heatmap-recovery/timofey-2026-07-21.preview.json","utf8"));
            assert.equal(report.applicable,5);
            assert.equal(report.reviewItems.length,0);
            assert.equal(report.changes.length,2);
            assert.ok(report.afterCoverage.covered>=report.beforeCoverage.covered);
            fs.writeFileSync(process.env.RUNNER_TEMP+"/sealed.json",JSON.stringify({...manifest,expectedAfter:report.expectedAfter},null,2));
            console.log("RECOVERY_PREVIEW "+JSON.stringify(report));
          '
          test -z "$(git status --porcelain)"
      - name: Apply and replay on disposable CI checkout only
        shell: bash
        run: |
          node scripts/recover-learning-coverage.mjs "$RUNNER_TEMP/sealed.json" --apply > "$RUNNER_TEMP/applied.json"
          node scripts/recover-learning-coverage.mjs "$RUNNER_TEMP/sealed.json" --apply > "$RUNNER_TEMP/replay.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const read=n=>JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/"+n+".json","utf8"));
            const applied=read("applied"),replay=read("replay");
            assert.equal(applied.transaction.changedFiles.length,2);
            assert.equal(replay.replay,true);
            assert.deepEqual(replay.transaction.changedFiles,[]);
            assert.deepEqual(applied.afterCoverage,replay.afterCoverage);
            console.log("RECOVERY_APPLIED "+JSON.stringify({changes:applied.transaction.changedFiles,coverage:applied.afterCoverage,replay:replay.replay}));
          '
          expected="$(printf '%s\n' students/timofey/site/data/lessons/2026-07-21.lesson.json students/timofey/site/lesson-registry.js)"
          test "$(git diff --name-only | sort)" = "$expected"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Platform contracts and coverage
        run: |
          node scripts/student.mjs validate
          node scripts/sync-learning-coverage.mjs --check
          node --test shared/student-dashboard/learning-coverage.test.mjs
          node --test pipeline/student/test/*.test.mjs
          node --test pipeline/student/publish/test/*.test.mjs
          node shared/student-dashboard/test-index-inventory.mjs
          node design-system/test-contract.mjs
          node --test deploy/student-static/build.test.mjs
      - name: Browser QA of all coverage pages
        run: node shared/student-dashboard/learning-coverage.browser.mjs
