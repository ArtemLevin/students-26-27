name: Historical learning coverage recovery
on:
  pull_request:
    paths:
      - 'scripts/recover-learning-coverage*'
      - '.github/workflows/learning-coverage-recovery.yml'
      - 'docs/heatmap-recovery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recovery unit tests
        run: node --test scripts/recover-learning-coverage.test.mjs scripts/audit-learning-coverage.test.mjs
      - name: Verify newly sealed migrations on PR checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only --diff-filter=AM HEAD^1 HEAD -- docs/heatmap-recovery/ | grep '\.sealed\.json$' > "$RUNNER_TEMP/sealed-manifests" || true
          while IFS= read -r manifest; do
            node scripts/recover-learning-coverage.mjs "$manifest" --apply > "$RUNNER_TEMP/replay.json"
            node --input-type=module -e '
              import fs from "node:fs";
              import assert from "node:assert/strict";
              const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/replay.json","utf8"));
              assert.equal(r.replay,true);
              assert.equal(r.sealed,true);
              assert.equal(r.reviewItems.length,0);
              assert.deepEqual(r.transaction.changedFiles,[]);
              console.log("RECOVERY_REPLAY "+JSON.stringify(r));
            '
          done < "$RUNNER_TEMP/sealed-manifests"
          test -z "$(git status --porcelain)"
      - name: Scoped audit
        run: |
          node scripts/audit-learning-coverage.mjs --json > "$RUNNER_TEMP/audit.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/audit.json","utf8"));
            for(const k of ["unknownIds","badAnchors","missingHtml"])assert.equal(a.totals[k],0,k);
            assert.deepEqual(a.totals.parityFailures,[]);
            assert.deepEqual(a.totals.masteryUnresolved,[]);
            console.log("AUDIT_TOTAL "+JSON.stringify(a.totals));
            for(const s of a.students)console.log("AUDIT_ROW "+JSON.stringify({id:s.id,lessons:s.lessons.length,empty:s.lessons.filter(l=>!l.coveredIds.length).length,covered:s.covered,catalog:s.catalogSize}));
          '
      - name: Platform contracts and coverage
        run: |
          node scripts/student.mjs validate
          node scripts/sync-learning-coverage.mjs --check
          node --test shared/student-dashboard/learning-coverage.test.mjs
          node --test pipeline/student/test/*.test.mjs
          node --test pipeline/student/publish/test/*.test.mjs
          node shared/student-dashboard/test-index-inventory.mjs
          node design-system/test-contract.mjs
          node --test deploy/student-static/build.test.mjs
      - name: Browser QA of all coverage pages
        run: node shared/student-dashboard/learning-coverage.browser.mjs
