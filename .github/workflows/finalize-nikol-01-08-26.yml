name: Finalize Nikol 01.08.26 lesson

on:
  push:
    branches:
      - main
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate and validate lesson
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp/nikol-010826/finalize.py
          node --check /tmp/nikol-010826.js

      - name: Commit final files and remove one-shot assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/nikol-010826
          rm -f .github/workflows/one-shot-nikol-010826.yml
          rm -f .github/workflows/finalize-nikol-01-08-26.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(nikol): add interactive 01.08.26 lesson"
          git push origin HEAD:main
