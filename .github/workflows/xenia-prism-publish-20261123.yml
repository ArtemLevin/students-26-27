name: Publish Xenia prism lesson 2026-11-23 (temporary)
on:
  push:
    branches:
      - site/xenia-prism-2026-11-23
    paths:
      - '.github/workflows/xenia-prism-publish-20261123.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML scripts
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          for name in ("23.11.26.html", "23.11.26-lab.html"):
              p = pathlib.Path("students/xenia_klykova/site")/name
              t=p.read_text(encoding="utf8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", t, re.S|re.I)
              assert len(scripts)==1, (name, len(scripts))
              tmp = pathlib.Path("/tmp")/(name+".js")
              tmp.write_text(scripts[0], encoding="utf8")
              import subprocess
              subprocess.run(["node","--check",str(tmp)],check=True)
          PY
      - name: Dry-run official v2 publisher
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 23.11.26 \
            --intent students/xenia_klykova/site/data/publication-intents/2026-11-23.json \
            --dry-run
      - name: Publish and validate
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 23.11.26 \
            --intent students/xenia_klykova/site/data/publication-intents/2026-11-23.json
          node scripts/student.mjs validate xenia_klykova
          node scripts/student.mjs audit
          node --test students/xenia_klykova/site/tests/student-platform-v2.test.mjs
      - name: Commit only official publisher outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/xenia_klykova/site/lesson-registry.js \
            students/xenia_klykova/site/data/lessons/2026-11-23.lesson.json \
            students/xenia_klykova/site/data/ktp-state.json \
            students/xenia_klykova/site/data/mastery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(xenia): publish 23.11.26 via canonical v2 workflow"
            git push origin HEAD:site/xenia-prism-2026-11-23
          fi
