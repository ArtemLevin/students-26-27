name: Nastya reconciliation verify

on:
  push:
    branches:
      - 'feat/student-platform-v2-reconcile-nastya-pavlova'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-reconcile-nastya-pavlova
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check pipeline/migration/legacy/inspect-learning-state.mjs
          node --check students/nastya_pavlova/mastery-authority.js

      - name: Run focused migration tests
        run: |
          node --test pipeline/migration/test/legacy-state.test.mjs
          node --test pipeline/migration/test/readiness-inventory.test.mjs

      - name: Verify reconciled Nastya source
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state nastya_pavlova --json > /tmp/nastya.json
          node - <<'NODE'
          const r=require('/tmp/nastya.json');
          const counts={};
          for(const item of r.mastery.resolved)counts[item.level]=(counts[item.level]||0)+1;
          const ids=new Set(r.catalog?.ids||[]);
          if(!r.automaticEligible)process.exit(1);
          if(r.catalog?.count!==379||r.mastery?.resolved?.length!==367)process.exit(2);
          if(counts[0]!==314||counts[2]!==53||Object.keys(counts).length!==2)process.exit(3);
          if(r.mastery?.conflicts?.length||r.diagnostics?.orphanClaims?.length||r.diagnostics?.warnings?.length)process.exit(4);
          if(!r.mastery.resolved.every(x=>x.sourceKind==='mastery-authority'&&x.sourcePath==='mastery-authority.js'))process.exit(5);
          if(!r.diagnostics.catalogTransforms.some(x=>x.transform==='ege-profile-2027'&&x.runtimeSourcePath==='competency-map.js'))process.exit(6);
          for(const id of ['ege2027_t6_variance','ege2027_t6_stddev','ege2027_t17_optimization'])if(!ids.has(id))process.exit(7);
          console.log(JSON.stringify({catalog:r.catalog.count,mastery:r.mastery.resolved.length,levelCounts:counts,automaticEligible:r.automaticEligible},null,2));
          NODE

      - name: Verify readiness transition
        shell: bash
        run: |
          node pipeline/migration/readiness-inventory.mjs --json > /tmp/readiness.json
          node -e "const r=require('/tmp/readiness.json'); const x=r.students.find(s=>s.studentId==='nastya_pavlova'); if(!x)process.exit(1); if(x.status!=='ready'||x.competencies!==379||x.mastery!==367)process.exit(2); console.log(JSON.stringify(x,null,2));"
