name: Nastya reconciliation baseline inspect

on:
  push:
    branches:
      - 'feat/student-platform-v2-reconcile-nastya-pavlova'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-reconcile-nastya-pavlova
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect migration view and runtime catalog
        run: |
          node scripts/student.mjs inspect-legacy-state nastya_pavlova --json > /tmp/legacy.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import {transformEgeProfile2027Catalog} from './shared/student-dashboard/ege-profile-2027.js';

          const window={};
          const context=vm.createContext({window,console});
          vm.runInContext(
            fs.readFileSync('students/nastya_pavlova/competency-map-data.js','utf8'),
            context,
            {filename:'competency-map-data.js'}
          );
          const html=fs.readFileSync('students/nastya_pavlova/site/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match=>!/\bsrc\s*=/i.test(match[1]||''));
          for(const match of scripts){
            if(/item\.level\s*=/.test(match[2])) vm.runInContext(match[2],context,{filename:'index-mastery-overlay.js'});
          }
          const source=window.COMPETENCY_MAP_DATA;
          const normalized=source.groups.map((group,index)=>({...group,id:`task_${index+1}`}));
          const transformed=transformEgeProfile2027Catalog(normalized);
          const rawItems=source.groups.flatMap(group=>group.items);
          const transformedItems=transformed.flatMap(group=>group.items);
          const rawLevels=rawItems.reduce((m,item)=>{m[item.level]=(m[item.level]||0)+1;return m;},{});
          const transformedLevels=transformedItems.reduce((m,item)=>{m[item.level]=(m[item.level]||0)+1;return m;},{});
          const rawIds=new Set(rawItems.map(item=>item.id));
          const newItems=transformedItems.filter(item=>!rawIds.has(item.id));
          const report=JSON.parse(fs.readFileSync('/tmp/legacy.json','utf8'));
          console.log(JSON.stringify({
            inspector:{
              catalog:report.catalog?.count,
              mastery:report.mastery?.resolved?.length,
              warnings:report.diagnostics?.warnings,
              automaticEligible:report.automaticEligible,
              transforms:report.diagnostics?.catalogTransforms
            },
            runtime:{
              rawCount:rawItems.length,
              transformedCount:transformedItems.length,
              rawLevels,
              transformedLevels,
              newItems:newItems.map(item=>({id:item.id,level:item.level,title:item.title}))
            }
          },null,2));
          NODE
