name: Temporary Denis lesson publication
on:
  push:
    branches:
      - codex/denis-logarithms-20261026
    paths:
      - students/denis_ermolaev/site/26.10.26.html
      - students/denis_ermolaev/site/data/publication-intents/2026-10-26.json
      - .github/workflows/denis-publish-20261026.yml
permissions:
  contents: write
jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[lesson-published]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/denis-logarithms-20261026
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review transactional publication dry-run
        run: |
          node scripts/publish-lesson.mjs denis_ermolaev 26.10.26 --intent students/denis_ermolaev/site/data/publication-intents/2026-10-26.json --dry-run | tee /tmp/denis-publication-dry-run.json
          node -e 'const x=require("/tmp/denis-publication-dry-run.json");if(!x.executable||x.reviewItems?.length||x.conflicts?.length)process.exit(1)'
      - name: Apply publication and verify postflight
        run: node scripts/publish-lesson.mjs denis_ermolaev 26.10.26 --intent students/denis_ermolaev/site/data/publication-intents/2026-10-26.json
      - name: Validate student package
        run: |
          node scripts/student.mjs validate denis_ermolaev
          node scripts/student.mjs audit
      - name: Commit canonical publisher output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/denis_ermolaev/site/data/lessons/2026-10-26.lesson.json students/denis_ermolaev/site/lesson-registry.js students/denis_ermolaev/site/data/ktp-state.json
          if ! git diff --cached --quiet; then
            git commit -m "[lesson-published] Canonical Denis lesson metadata 2026-10-26"
            git push origin HEAD:codex/denis-logarithms-20261026
          fi
