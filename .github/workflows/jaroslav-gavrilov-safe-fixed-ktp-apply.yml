name: Jaroslav Gavrilov safe fixed-KTP migration apply

on:
  push:
    branches:
      - 'feat/student-platform-v2-fixed-ktp-jaroslav-gavrilov-safe'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-fixed-ktp-jaroslav-gavrilov-safe
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate reviewed manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/jaroslav_gavrilov.json --json

      - name: Inspect legacy state
        run: node scripts/student.mjs inspect-legacy-state jaroslav_gavrilov --json

      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate jaroslav_gavrilov \
            --manifest pipeline/migration/manifests/jaroslav_gavrilov.json \
            --date 2026-10-02 \
            --dry-run \
            --json > /tmp/jaroslav-dry-run.json
          node -e "const p=require('/tmp/jaroslav-dry-run.json'),c=p.coverage; if(!p.executable||!c?.complete)process.exit(1); if(c.lessons?.source!==4||c.lessons?.candidate!==4)process.exit(2); if(c.ktp?.mode!=='fixed'||c.ktp?.sourceLessons!==72||c.ktp?.candidateLessons!==72||c.ktp?.mappedHistoricalLessons!==0)process.exit(3); if(c.competencies?.source!==356||c.competencies?.candidate!==356)process.exit(4); if(c.mastery?.resolvedSource!==0||c.mastery?.candidate!==0||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(5); if((p.reviewItems||[]).length||(p.blockers||[]).length||(p.warnings||[]).length)process.exit(6); console.log(JSON.stringify({coverage:c,projectedBaseline:p.projectedBaseline},null,2));"

      - name: Transactional apply
        run: |
          node scripts/student.mjs migrate jaroslav_gavrilov \
            --manifest pipeline/migration/manifests/jaroslav_gavrilov.json \
            --date 2026-10-02 \
            --apply \
            --json

      - name: Validate migrated package
        run: node scripts/student.mjs validate jaroslav_gavrilov --json

      - name: Verify empty canonical mastery
        run: node -e "const s=require('./students/jaroslav_gavrilov/site/data/mastery-state.json'); if(Object.keys(s.levels).length)process.exit(1);"

      - name: Verify fixed KTP preservation
        run: node -e "const p=require('./students/jaroslav_gavrilov/site/data/ktp-plan.json'); if(p.lessons.length!==72)process.exit(1); if(p.lessons[0].id!=='ktp-001'||p.lessons[71].id!=='ktp-072')process.exit(2);"

      - name: Verify no speculative historical KTP mapping
        run: |
          node -e "const fs=require('fs'),path=require('path'); const dir='students/jaroslav_gavrilov/site/data/lessons'; const files=fs.readdirSync(dir).filter(x=>x.endsWith('.lesson.json')); if(files.length!==4)process.exit(1); for(const file of files){const d=require('./'+path.join(dir,file)); if((d.ktpRefs||[]).length)process.exit(2); if('ktpCoverage' in d)process.exit(3);} console.log('historical KTP refs preserved as empty:',files.length);"

      - name: Run migration regression suite
        run: node --test pipeline/migration/test/*.test.mjs

      - name: Enforce architecture ratchet
        run: node pipeline/migration/audit-ratchet.mjs

      - name: Commit generated migration state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/migration/baseline.json \
            pipeline/migration/reports/jaroslav_gavrilov.json \
            students/jaroslav_gavrilov/student-contract.json \
            students/jaroslav_gavrilov/site/data \
            students/jaroslav_gavrilov/site/lesson-registry.js \
            students/jaroslav_gavrilov/site/tests/student-platform-v2.test.mjs
          if git diff --cached --quiet; then
            echo "Migration produced no generated changes"
            exit 1
          fi
          git commit -m "Fixed-KTP: apply fail-closed Jaroslav Gavrilov migration"
          git push origin HEAD:feat/student-platform-v2-fixed-ktp-jaroslav-gavrilov-safe
