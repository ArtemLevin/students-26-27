name: Nikol 19 October publication (temporary)
on:
  push:
    branches:
      - codex/nikol-20261019-site
    paths:
      - .github/workflows/nikol-20261019-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nikol-20261019-site
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run and publish via canonical Student Platform v2
        run: |
          set -euo pipefail
          INTENT=students/nikol_sarkisyants/site/data/lesson-publication-intents/2026-10-19.json
          node scripts/publish-lesson.mjs nikol_sarkisyants 19.10.26 --intent "$INTENT" --dry-run
          node scripts/publish-lesson.mjs nikol_sarkisyants 19.10.26 --intent "$INTENT"
          node scripts/student.mjs validate nikol_sarkisyants
          node --test students/nikol_sarkisyants/site/tests/*.test.mjs
      - name: Commit transaction outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A students/nikol_sarkisyants
          if ! git diff --cached --quiet; then
            git commit -m "chore(nikol): publish 19 October lesson via production publisher"
            git push origin HEAD:codex/nikol-20261019-site
          fi
