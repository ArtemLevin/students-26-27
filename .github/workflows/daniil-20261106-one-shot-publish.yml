name: Temporary publication for Daniil 2026-11-06

on:
  pull_request:
    branches: [main]
    paths:
      - 'students/daniil_khriastov/site/06.11.26.html'
      - 'students/daniil_khriastov/site/06.11.26-lab.html'
      - 'students/daniil_khriastov/site/data/publication-intents/2026-11-06.json'
      - '.github/workflows/daniil-20261106-one-shot-publish.yml'

permissions:
  contents: write

jobs:
  publish-v2:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'lesson/daniil-2026-11-06-graph-method' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run the Student Platform v2 publication
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs daniil_khriastov 06.11.26 \
            --intent students/daniil_khriastov/site/data/publication-intents/2026-11-06.json \
            --dry-run
      - name: Apply via official transactional publisher
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs daniil_khriastov 06.11.26 \
            --intent students/daniil_khriastov/site/data/publication-intents/2026-11-06.json
      - name: Validate lesson and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test students/daniil_khriastov/site/tests/lesson-20261106.test.mjs
          node scripts/student.mjs validate daniil_khriastov
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
      - name: Commit only publisher-generated changes and delete the temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/daniil-20261106-one-shot-publish.yml
          git add students/daniil_khriastov/site/data/lessons
          git add students/daniil_khriastov/site/data/ktp-state.json
          git add students/daniil_khriastov/site/lesson-registry.js
          git add students/daniil_khriastov/site/index.html
          git diff --cached --quiet || git commit -m "Publish Daniil 06.11.26 via Student Platform v2 pipeline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
