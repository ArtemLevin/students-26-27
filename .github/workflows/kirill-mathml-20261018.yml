name: Kirill MathML browser verification
on:
  push:
    branches: [feat/kirill-mathml-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/mathml-test --no-save playwright@1.56.1 @axe-core/playwright
          PLAYWRIGHT_BROWSERS_PATH=/tmp/mathml-browser /tmp/mathml-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test MathML markup and dynamic calculation interactions
        env:
          NODE_PATH: /tmp/mathml-test/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/mathml-browser
        run: node students/kirill_zinoviev/site/tests/mathml-20261018.cjs
