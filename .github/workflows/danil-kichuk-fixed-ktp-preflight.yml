name: Danil Kichuk fixed-KTP migration apply

on:
  push:
    branches:
      - 'feat/student-platform-v2-fixed-ktp-danil-kichuk'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-fixed-ktp-danil-kichuk
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewed manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/danil_kichuk.json --json
      - name: Inspect legacy state
        run: node scripts/student.mjs inspect-legacy-state danil_kichuk --json
      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate danil_kichuk --manifest pipeline/migration/manifests/danil_kichuk.json --date 2026-10-02 --dry-run --json > /tmp/danil-dry-run.json
          node -e "const p=require('/tmp/danil-dry-run.json'),c=p.coverage; if(!p.executable||!c?.complete)process.exit(1); if(c.lessons?.source!==2||c.lessons?.candidate!==2)process.exit(2); if(c.ktp?.mode!=='fixed'||c.ktp?.sourceLessons!==70||c.ktp?.candidateLessons!==70||c.ktp?.mappedHistoricalLessons!==0)process.exit(3); if(c.competencies?.source!==356||c.competencies?.candidate!==356)process.exit(4); if(c.mastery?.resolvedSource!==0||c.mastery?.candidate!==0||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(5); if((p.reviewItems||[]).length||(p.blockers||[]).length||(p.warnings||[]).length)process.exit(6); console.log(JSON.stringify({coverage:c,projectedBaseline:p.projectedBaseline},null,2));"
      - name: Transactional apply
        run: node scripts/student.mjs migrate danil_kichuk --manifest pipeline/migration/manifests/danil_kichuk.json --date 2026-10-02 --apply --json
      - name: Validate migrated package
        run: node scripts/student.mjs validate danil_kichuk --json
      - name: Verify empty canonical mastery
        run: node -e "const s=require('./students/danil_kichuk/site/data/mastery-state.json'); if(Object.keys(s.levels).length)process.exit(1);"
      - name: Verify fixed KTP preservation
        run: node -e "const p=require('./students/danil_kichuk/site/data/ktp-plan.json'); if(p.lessons.length!==70)process.exit(1); if(p.lessons[0].id!=='ktp-001'||p.lessons[69].id!=='ktp-070')process.exit(2);"
      - name: Run migration regression suite
        run: node --test pipeline/migration/test/*.test.mjs
      - name: Enforce architecture ratchet
        run: node pipeline/migration/audit-ratchet.mjs
      - name: Commit generated migration state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/migration/baseline.json pipeline/migration/reports/danil_kichuk.json students/danil_kichuk/student-contract.json students/danil_kichuk/site/data students/danil_kichuk/site/lesson-registry.js students/danil_kichuk/site/tests/student-platform-v2.test.mjs
          git diff --cached --quiet && exit 1 || true
          git commit -m "Fixed-KTP: apply Danil Kichuk Student Platform v2 migration"
          git push origin HEAD:feat/student-platform-v2-fixed-ktp-danil-kichuk
