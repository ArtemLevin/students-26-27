name: Ekaterina Gnedkova migration preflight

on:
  push:
    branches:
      - 'feat/student-platform-v2-migrate-ekaterina-gnedkova'

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-migrate-ekaterina-gnedkova
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect reconciled legacy state
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state ekaterina_gnedkova --json > /tmp/legacy.json
          node -e "const r=require('/tmp/legacy.json'); if(!r.automaticEligible)process.exit(1); if(r.catalog?.count!==369)process.exit(2); if(r.mastery?.resolved?.length!==369)process.exit(3); if(r.mastery?.conflicts?.length||r.diagnostics?.orphanClaims?.length||r.diagnostics?.warnings?.length)process.exit(4); if(!r.mastery.resolved.every(x=>x.sourceKind==='mastery-authority'&&x.sourcePath==='site/mastery-authority.js'))process.exit(5);"

      - name: Generate candidate manifest from reconciled authority
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report=require('/tmp/legacy.json');
          const preserveMastery=report.mastery.resolved.map(item=>({
            competencyId:item.competencyId,
            level:item.level,
            sourcePath:item.sourcePath,
            sourceKind:item.sourceKind,
            confidence:'exact',
            basis:item.basis
          }));
          const manifest={
            version:1,
            studentId:'ekaterina_gnedkova',
            identity:{
              studentName:'Екатерина Гнедкова',
              program:'подготовка к ЕГЭ по профильной математике'
            },
            sourceArchitecture:'legacy-structured',
            planning:{mode:'rolling',ktpExtraction:null},
            lessonMappings:[
              {lessonDate:'2026-09-08',ktpMatches:[]},
              {lessonDate:'2026-09-11',ktpMatches:[]},
              {lessonDate:'2026-09-15',ktpMatches:[]},
              {lessonDate:'2026-09-19',ktpMatches:[]},
              {lessonDate:'2026-09-22',ktpMatches:[]},
              {lessonDate:'2026-09-25',ktpMatches:[]},
              {lessonDate:'2026-09-29',ktpMatches:[]}
            ],
            competencyMappings:[],
            preserveMastery,
            ambiguities:[],
            blockers:[],
            warnings:[]
          };
          fs.mkdirSync('pipeline/migration/manifests',{recursive:true});
          fs.writeFileSync(
            'pipeline/migration/manifests/ekaterina_gnedkova.json',
            JSON.stringify(manifest,null,2)+'\n'
          );
          NODE

      - name: Validate candidate manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/ekaterina_gnedkova.json --json

      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate ekaterina_gnedkova \
            --manifest pipeline/migration/manifests/ekaterina_gnedkova.json \
            --date 2026-10-02 \
            --dry-run \
            --json > /tmp/dry-run.json
          node -e "const p=require('/tmp/dry-run.json'),c=p.coverage; if(!p.executable||!c?.complete)process.exit(1); if(c.lessons?.source!==7||c.lessons?.candidate!==7)process.exit(2); if(c.competencies?.source!==369||c.competencies?.candidate!==369)process.exit(3); if(c.mastery?.resolvedSource!==369||c.mastery?.candidate!==369||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(4); if((p.reviewItems||[]).length||(p.blockers||[]).length||(p.warnings||[]).length)process.exit(5); console.log(JSON.stringify({coverage:c,projectedBaseline:p.projectedBaseline},null,2));"

      - name: Commit candidate manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/migration/manifests/ekaterina_gnedkova.json
          git diff --cached --quiet && exit 1 || true
          git commit -m "Reconciliation: generate Ekaterina Gnedkova migration manifest"
          git push origin HEAD:feat/student-platform-v2-migrate-ekaterina-gnedkova
