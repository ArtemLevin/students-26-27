name: Publish Xenia Klykova 2026-11-02 lesson
on:
  push:
    branches:
      - lesson/xenia-klykova-2026-11-02-finance
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: lesson/xenia-klykova-2026-11-02-finance
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publisher dry-run
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 02.11.26 \
            --intent students/xenia_klykova/site/data/publication-intents/2026-11-02.json \
            --dry-run
      - name: Transactional publisher
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 02.11.26 \
            --intent students/xenia_klykova/site/data/publication-intents/2026-11-02.json
      - name: Validate student package and regressions
        run: |
          node scripts/student.mjs validate xenia_klykova
          node students/xenia_klykova/site/tests/dashboard-regression.mjs
          node --check students/xenia_klykova/site/dashboard.js
          node --check students/xenia_klykova/site/lesson-registry.js
      - name: Commit canonical publisher output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/xenia_klykova/site/lesson-registry.js \
                  students/xenia_klykova/site/dashboard.js \
                  students/xenia_klykova/site/data/lessons/2026-11-02.lesson.json \
                  students/xenia_klykova/site/data/ktp-state.json \
                  students/xenia_klykova/site/data/mastery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(xenia): publish 2 Nov lesson through v2 pipeline"
            git push origin HEAD:lesson/xenia-klykova-2026-11-02-finance
          fi
