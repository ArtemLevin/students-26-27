name: Kirill 10 November lesson publication
on:
  pull_request:
    branches: [main]
    paths:
      - 'students/kirill_zinoviev/site/10.11.26.html'
      - 'students/kirill_zinoviev/site/10.11.26-lab.html'
      - 'students/kirill_zinoviev/site/data/publication-intents/2026-11-10.json'
      - '.github/workflows/kirill-2026-11-10-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lesson page inline JavaScript
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          for (const file of ['students/kirill_zinoviev/site/10.11.26.html','students/kirill_zinoviev/site/10.11.26-lab.html']) {
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            if (!scripts.length) throw new Error('Missing JS: '+file);
            for (const script of scripts) {
              const result=cp.spawnSync(process.execPath,['--check'],{input:script[1],encoding:'utf8'});
              if (result.status!==0) throw new Error(file+' inline JS: '+result.stderr);
            }
          }
          NODE
      - name: Canonical Student Platform v2 publication
        shell: bash
        run: |
          set -euo pipefail
          INTENT=students/kirill_zinoviev/site/data/publication-intents/2026-11-10.json
          node scripts/publish-lesson.mjs kirill_zinoviev 10.11.26 --intent "$INTENT" --dry-run
          node scripts/publish-lesson.mjs kirill_zinoviev 10.11.26 --intent "$INTENT"
          node scripts/student.mjs validate kirill_zinoviev
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
      - name: Commit canonical publication outputs to pull-request branch
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/kirill_zinoviev/site/data/lessons/2026-11-10.lesson.json students/kirill_zinoviev/site/lesson-registry.js students/kirill_zinoviev/site/data/ktp-state.json students/kirill_zinoviev/site/dashboard.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(kirill): publish November 10 lesson through v2 pipeline"
            git push origin "HEAD:${BRANCH}"
          fi
