name: Validate Nikol direct HTML

on:
  push:
    branches:
      - fix/nikol-direct-html

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate reconstructed page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('students/nikol_sarkisyants/site')
          loader = (root / '04.08.26.html').read_text(encoding='utf-8')
          assert 'atob(' not in loader
          assert 'DecompressionStream' not in loader
          assert 'gunzip' not in loader

          parts=[]
          for i in range(1,14):
              path=root / '04.08.26.assets' / f'part-{i:02d}.js'
              source=path.read_text(encoding='utf-8').strip()
              match=re.fullmatch(r'window\.__NIKOL_PAGE_PARTS\.push\((.*)\);',source,re.S)
              assert match, f'Invalid wrapper: {path}'
              parts.append(json.loads(match.group(1)))

          html=''.join(parts)
          digest=hashlib.sha256(html.encode('utf-8')).hexdigest()
          assert digest == '3acee6435ac25433ef581c39c52f1f237248cf383e1a2dd918b84a93a3975b6a', digest
          assert html.startswith('<!doctype html>')
          assert html.rstrip().endswith('</html>')
          assert 'Дифференцированная схема кредитования' in html
          assert html.count('<math') >= 50
          assert html.count('{l:') == 10
          assert 'atob(' not in html
          assert 'DecompressionStream' not in html
          assert 'function gunzip' not in html

          script=re.search(r'<script>\n("use strict";.*)\n</script>',html,re.S)
          assert script, 'Main script not found'
          Path('/tmp/nikol-main.js').write_text(script.group(1),encoding='utf-8')
          print('sha256',digest,'chars',len(html),'math',html.count('<math'))
          PY
          node --check /tmp/nikol-main.js
      - name: Remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/validate-nikol-direct-html.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(nikol): validate direct HTML assembly"
          git push
