name: Publish Jaroslav 15 October lesson
on:
  push:
    branches:
      - feat/jaroslav-2026-10-15-graphs-lesson
    paths:
      - students/jaroslav_gavrilov/site/15.10.26.html
      - students/jaroslav_gavrilov/site/15.10.26-lab.html
      - students/jaroslav_gavrilov/site/15.10.26-graphs.js
      - students/jaroslav_gavrilov/site/data/lesson-publication-intents/2026-10-15.json
      - .github/workflows/publish-jaroslav-20261015.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jaroslav-2026-10-15-graphs-lesson
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate lesson scripts
        run: |
          node --check students/jaroslav_gavrilov/site/15.10.26-graphs.js
          node --check scripts/publish-lesson.mjs
      - name: Preview canonical v2 publication
        run: |
          node scripts/publish-lesson.mjs jaroslav_gavrilov 15.10.26 \
            --intent students/jaroslav_gavrilov/site/data/lesson-publication-intents/2026-10-15.json \
            --dry-run
      - name: Publish transactional lesson metadata and KTP evidence
        run: |
          node scripts/publish-lesson.mjs jaroslav_gavrilov 15.10.26 \
            --intent students/jaroslav_gavrilov/site/data/lesson-publication-intents/2026-10-15.json
          node scripts/student.mjs validate jaroslav_gavrilov
      - name: Browser QA on desktop, mobile and laboratory modes
        run: node students/jaroslav_gavrilov/site/tests/15.10.26.browser.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jaroslav-1510-browser-screenshots
          path: jaroslav-1510-browser-artifacts/*.png
          if-no-files-found: warn
      - name: Commit publisher-generated changes to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/jaroslav_gavrilov/site/lesson-registry.js \
                  students/jaroslav_gavrilov/site/data/ktp-state.json \
                  students/jaroslav_gavrilov/site/data/mastery-state.json \
                  students/jaroslav_gavrilov/site/data/lessons/2026-10-15.lesson.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(jaroslav): publish 15 October via Student Platform v2"
            git push origin HEAD:feat/jaroslav-2026-10-15-graphs-lesson
          fi
