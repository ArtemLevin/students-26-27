name: Matvey editorial browser QA
on:
  pull_request:
    paths:
      - 'students/matvey_gorbachev/site/**'
      - '.github/workflows/matvey-editorial-browser.yml'
  push:
    branches: [main]
    paths:
      - 'students/matvey_gorbachev/site/**'
      - '.github/workflows/matvey-editorial-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for visual and interaction checks
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate MathML coverage and native semantics
        run: node --test students/matvey_gorbachev/site/tests/mathml-22-10-26.test.mjs
      - name: Five responsive breakpoints and accessible interactions
        run: node students/matvey_gorbachev/site/tests/browser-editorial.mjs
      - name: Save visual snapshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matvey-editorial-viewport-screenshots
          path: .matvey-browser-qa/
          if-no-files-found: warn
          include-hidden-files: true
