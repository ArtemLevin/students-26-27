name: One-time personal formula sheet installation

on:
  push:
    branches:
      - codex/personal-formulas-20261012
    paths:
      - .github/formula_sheets_20261012.b64

permissions:
  contents: write

jobs:
  build-formulas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct reviewed LaTeX sources
        run: |
          python3 -m pip -q install brotli
          python3 - <<'PY'
          from pathlib import Path
          import base64, brotli, hashlib, json
          archive = "".join(Path(f".github/formula_sheets_20261012_part{i}.txt").read_text().strip() for i in range(1,7))
          raw = brotli.decompress(base64.b64decode(archive))
          assert hashlib.sha256(raw).hexdigest() == "e1dbd3eba6841107541ffc72a53d73b5a180e840b270d9a578664d6e83662b24"
          items = json.loads(raw)
          allowed = set(["anna_bannova","anna_trapeznikova","danil_kichuk","ekaterina","ekaterina_gnedkova","grisha_arkhipov","jaroslav_gavrilov","jaroslav_vereschagin","kiril_zinoviev_physics","kirill_zinoviev","mark_gukin","matvey_gorbachev","nadya_klimenko","nastya_pavlova","nikol_sarkisyants","sofya_kalney","sofya_khomenko","timofey","volodia_khachaturian","xenia_klykova","xenia_vasilchenko"])
          assert set(items) == allowed, "Student list differs from approved inventory"
          for slug, tex in items.items():
              path = Path("students") / slug / "site" / "formulas-12.10.26.tex"
              assert path.parent.is_dir(), f"Missing student site: {slug}"
              path.write_text(tex, encoding="utf-8")
          print("Restored", len(items), "sources")
          PY
      - name: Compile personal reference sheets
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            students/anna_bannova/site/formulas-12.10.26.tex
            students/anna_trapeznikova/site/formulas-12.10.26.tex
            students/danil_kichuk/site/formulas-12.10.26.tex
            students/ekaterina/site/formulas-12.10.26.tex
            students/ekaterina_gnedkova/site/formulas-12.10.26.tex
            students/grisha_arkhipov/site/formulas-12.10.26.tex
            students/jaroslav_gavrilov/site/formulas-12.10.26.tex
            students/jaroslav_vereschagin/site/formulas-12.10.26.tex
            students/kiril_zinoviev_physics/site/formulas-12.10.26.tex
            students/kirill_zinoviev/site/formulas-12.10.26.tex
            students/mark_gukin/site/formulas-12.10.26.tex
            students/matvey_gorbachev/site/formulas-12.10.26.tex
            students/nadya_klimenko/site/formulas-12.10.26.tex
            students/nastya_pavlova/site/formulas-12.10.26.tex
            students/nikol_sarkisyants/site/formulas-12.10.26.tex
            students/sofya_kalney/site/formulas-12.10.26.tex
            students/sofya_khomenko/site/formulas-12.10.26.tex
            students/timofey/site/formulas-12.10.26.tex
            students/volodia_khachaturian/site/formulas-12.10.26.tex
            students/xenia_klykova/site/formulas-12.10.26.tex
            students/xenia_vasilchenko/site/formulas-12.10.26.tex
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error
      - name: Verify and commit only the 42 deliverables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          students = ["anna_bannova","anna_trapeznikova","danil_kichuk","ekaterina","ekaterina_gnedkova","grisha_arkhipov","jaroslav_gavrilov","jaroslav_vereschagin","kiril_zinoviev_physics","kirill_zinoviev","mark_gukin","matvey_gorbachev","nadya_klimenko","nastya_pavlova","nikol_sarkisyants","sofya_kalney","sofya_khomenko","timofey","volodia_khachaturian","xenia_klykova","xenia_vasilchenko"]
          for slug in students:
              base = Path("students") / slug / "site" / "formulas-12.10.26"
              for ext in (".tex", ".pdf"):
                  p = Path(str(base) + ext)
                  assert p.exists() and p.stat().st_size > 1000, p
              assert Path(str(base) + ".pdf").read_bytes()[:5] == b"%PDF-"
          print("Verified", len(students), "PDF and TeX pairs")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'students/*/site/formulas-12.10.26.pdf' 'students/*/site/formulas-12.10.26.tex'
          git diff --cached --quiet || git commit -m "Add 21 personalized mathematics and physics formula sheets"
          git push origin HEAD:codex/personal-formulas-20261012
