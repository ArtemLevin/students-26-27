name: Anna Bannova lesson publication (one-shot)
on:
  push:
    branches:
      - codex/anna-bannova-20261016-lesson
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[anna-publication-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: codex/anna-bannova-20261016-lesson
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run canonical lesson publisher
        run: |
          node scripts/publish-lesson.mjs anna_bannova 16.10.26 \
            --intent students/anna_bannova/site/data/lessons/2026-10-16.intent.json --dry-run
      - name: Publish lesson transactionally
        run: |
          node scripts/publish-lesson.mjs anna_bannova 16.10.26 \
            --intent students/anna_bannova/site/data/lessons/2026-10-16.intent.json
      - name: Verify lesson contracts and static checks
        run: |
          node scripts/student.mjs validate anna_bannova
          node students/anna_bannova/site/tests/student-platform-v2.test.mjs
          node --test students/anna_bannova/site/tests/student-platform-v2.test.mjs
      - name: Commit generated canonical artifacts and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/anna-bannova-one-shot-publish.yml
          git add students/anna_bannova/site/data students/anna_bannova/site/lesson-registry.js
          git commit -m "Publish Anna Bannova 16 Oct lesson via v2 [anna-publication-complete]"
          git push origin HEAD:codex/anna-bannova-20261016-lesson
