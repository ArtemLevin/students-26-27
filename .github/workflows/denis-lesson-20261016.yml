name: Publish Denis lesson 2026-10-16 (temporary)
on:
  push:
    branches:
      - lesson/denis-ermolaev-2026-10-16
    paths:
      - .github/workflows/denis-lesson-20261016.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publication dry run
        run: node scripts/publish-lesson.mjs denis_ermolaev 16.10.26 --intent students/denis_ermolaev/site/data/publication-intents/2026-10-16.json --dry-run
      - name: Transactional publication
        run: node scripts/publish-lesson.mjs denis_ermolaev 16.10.26 --intent students/denis_ermolaev/site/data/publication-intents/2026-10-16.json
      - name: Student v2 validation
        run: |
          node scripts/student.mjs validate denis_ermolaev
          node scripts/student.mjs audit
      - name: Commit publisher-generated canonical state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/denis_ermolaev/site/data/lessons/2026-10-16.lesson.json students/denis_ermolaev/site/lesson-registry.js students/denis_ermolaev/site/data/ktp-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Denis 2026-10-16 lesson via transactional v2 publisher"
            git push origin HEAD:refs/heads/lesson/denis-ermolaev-2026-10-16
          fi
