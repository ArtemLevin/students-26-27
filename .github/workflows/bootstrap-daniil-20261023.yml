name: Daniil Student Platform v2 release QA
on:
  push:
    branches:
      - feat/daniil-atlas-heatmap-20261023
    paths:
      - .github/workflows/bootstrap-daniil-20261023.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate student and mastery contracts
        run: |
          node scripts/student.mjs validate daniil_khriastov
          node scripts/student.mjs audit
          node design-system/test-contract.mjs
          node --check students/daniil_khriastov/site/heatmap.js
          node --test students/daniil_khriastov/site/tests/*.test.mjs
      - name: Install Chromium for real browser checks
        run: |
          mkdir -p /tmp/daniil-browser
          cd /tmp/daniil-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check actual desktop/mobile rendering and interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8973 --directory . >/tmp/daniil-http.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from '/tmp/daniil-browser/node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true});
          try{
            for(const [width,height] of [[375,812],[390,844],[768,1024],[1024,768],[1366,768],[1440,900],[1920,1080]]){
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{if(r.status()>=400)errors.push('HTTP '+r.status()+' '+r.url())});
              await page.goto('http://127.0.0.1:8973/students/daniil_khriastov/site/index.html',{waitUntil:'networkidle'});
              await page.waitForSelector('.radial-cell');
              const n=await page.locator('.radial-cell').count();
              assert.equal(n,354,'map cells');
              assert.equal(await page.locator('.atlas-item').count(),354,'index cells');
              const dims=await page.evaluate(()=>({screen:document.documentElement.clientWidth,content:document.documentElement.scrollWidth}));
              assert.ok(dims.content<=dims.screen+1,JSON.stringify({width,...dims}));
              await page.locator('.radial-cell').first().click({force:true});
              assert.notEqual(await page.locator('#detailId').innerText(),'—');
              await page.locator('[data-filter="unknown"]').click();
              assert.equal(await page.locator('#visibleCount').innerText(),'354 / 354');
              await page.locator('#search').fill('несуществующий_термин');
              assert.equal(await page.locator('#visibleCount').innerText(),'0 / 354');
              await page.locator('#search').fill('');
              await page.locator('#themeToggle').click();
              assert.equal(await page.locator('html').getAttribute('data-theme'),'dark');
              assert.deepEqual(errors,[]);
              console.log('OK',width,height,n);
              await page.close();
            }
          } finally {await browser.close()}
          JS
