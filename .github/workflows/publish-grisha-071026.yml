name: Publish Grigory 07.10.26

on:
  push:
    branches:
      - site/grisha-071026
    paths:
      - .automation/grisha-071026-ready

permissions:
  contents: write

jobs:
  publish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/grisha-071026
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publication dry-run
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs grisha_arkhipov 07.10.26 --intent .automation/grisha-071026-intent.json --dry-run | tee /tmp/publication-dry.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/publication-dry.json','utf8'));
          if(!p.executable) throw new Error('Publication plan is not executable');
          if(p.reviewItems.length) throw new Error('Publication plan has reviewItems');
          if(p.conflicts.length) throw new Error('Publication plan has conflicts');
          console.log('dry-run warnings:', p.warnings);
          console.log('dry-run changed files:', p.changedFiles);
          NODE

      - name: Transactional publication
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs grisha_arkhipov 07.10.26 --intent .automation/grisha-071026-intent.json | tee /tmp/publication-apply.json

      - name: Source integrity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const file='students/grisha_arkhipov/site/07.10.26.html';
          const html=fs.readFileSync(file,'utf8');
          for(const bad of [/TODO/i,/lorem ipsum/i,/console\.log\s*\(/,/href\s*=\s*["']\s*["']/i,/javascript:/i]){
            if(bad.test(html)) throw new Error('Source gate failed: '+bad);
          }
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]);
          if(new Set(ids).size!==ids.length) throw new Error('Duplicate HTML ids');
          for(const anchor of ['method','linear','intersection','parabola','hyperbola']){
            if(!ids.includes(anchor)) throw new Error('Missing anchor #'+anchor);
          }
          const refs=[...html.matchAll(/(?:href|src)=["']([^"']+)["']/g)].map(x=>x[1]);
          for(const ref of refs){
            if(ref.startsWith('data:')||ref.startsWith('#')) continue;
            if(/^https?:/i.test(ref)) throw new Error('Remote resource: '+ref);
            const clean=ref.split(/[?#]/,1)[0];
            if(!clean) continue;
            const target=path.resolve(path.dirname(file),clean);
            if(!fs.existsSync(target)) throw new Error('Missing local reference: '+ref);
          }
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
          scripts.forEach((source,index)=>{
            const temp='/tmp/grisha-inline-'+index+'.js';
            fs.writeFileSync(temp,source);
            const result=spawnSync(process.execPath,['--check',temp],{encoding:'utf8'});
            if(result.status!==0) throw new Error(result.stderr||result.stdout);
          });
          const index=fs.readFileSync('students/grisha_arkhipov/site/index.html','utf8');
          for(const required of ['07.10.26.html','../pdf_docs/07.10.26.pdf','../tex_docs/07.10.26.tex','ktp.html?lesson=ktp-002']){
            if(!index.includes(required)) throw new Error('Dashboard missing '+required);
          }
          console.log('source integrity: PASS');
          NODE

      - name: Student Platform release gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/student.mjs validate grisha_arkhipov
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test shared/practice/test/*.test.mjs
          node --test pipeline/practice/test/*.test.mjs
          node students/grisha_arkhipov/site/tests/student-platform-v2.test.mjs

      - name: Commit publication result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/grisha-071026-ready .automation/grisha-071026-intent.json
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/publish-grisha-071026.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish 07.10.26 lesson for Grigory Arkhipov"
          git push origin HEAD:site/grisha-071026
