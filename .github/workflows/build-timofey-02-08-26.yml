name: Build Timofey lesson 02.08.26

on:
  push:
    branches:
      - feat/timofey-deposits-02-08-26

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/timofey-deposits-02-08-26
          fetch-depth: 0

      - name: Materialize autonomous lesson
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          root = Path('pipline/tmp/timofey_020826')
          html_payload = ''.join(
              part.read_text(encoding='utf-8').strip()
              for part in sorted(root.glob('html_*.part'))
          )
          index_payload = (root / 'index_00.part').read_text(encoding='utf-8').strip()

          html = gzip.decompress(base64.b64decode(html_payload))
          index_js = gzip.decompress(base64.b64decode(index_payload))

          Path('students/timofey/site/02.08.26.html').write_bytes(html)
          Path('students/timofey/site/assets/index.js').write_bytes(index_js)
          PY

          rm -rf pipline/tmp/timofey_020826
          rm -f .github/workflows/build-timofey-02-08-26.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(timofey): add interactive deposits lesson"
          git push origin HEAD:feat/timofey-deposits-02-08-26
