name: Darya migration preflight

on:
  push:
    branches:
      - 'feat/student-platform-v2-migrate-darya-savenkova'

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-migrate-darya-savenkova
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify design-reference surface before planning
        run: node --test pipeline/migration/test/darya-design-reference.test.mjs

      - name: Inspect corrected source
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state darya_savenkova --json > /tmp/darya.json
          node - <<'NODE'
          const r=require('/tmp/darya.json');
          const counts={};
          for(const item of r.mastery.resolved)counts[item.level]=(counts[item.level]||0)+1;
          if(!r.automaticEligible)process.exit(1);
          if(r.catalog?.count!==356||r.mastery?.resolved?.length!==7)process.exit(2);
          if(counts[2]!==5||counts[3]!==2||Object.keys(counts).length!==2)process.exit(3);
          if(r.mastery?.conflicts?.length||r.diagnostics?.orphanClaims?.length||r.diagnostics?.warnings?.length)process.exit(4);
          if(!r.mastery.resolved.every(x=>x.sourceKind==='linked-progress-overlay'&&x.sourcePath==='site/lesson-14.09.26-progress.js'))process.exit(5);
          NODE

      - name: Generate candidate manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report=require('/tmp/darya.json');
          const manifest={
            version:1,
            studentId:'darya_savenkova',
            identity:{
              studentName:'Дарья Савенкова',
              program:'ЕГЭ, профильная математика'
            },
            sourceArchitecture:'legacy-structured',
            planning:{mode:'rolling',ktpExtraction:null},
            lessonMappings:[
              {lessonDate:'2026-09-14',ktpMatches:[]}
            ],
            competencyMappings:[],
            preserveMastery:report.mastery.resolved.map(item=>({
              competencyId:item.competencyId,
              level:item.level,
              sourcePath:item.sourcePath,
              sourceKind:item.sourceKind,
              confidence:'exact',
              basis:item.basis
            })),
            ambiguities:[],
            blockers:[],
            warnings:[]
          };
          fs.mkdirSync('pipeline/migration/manifests',{recursive:true});
          fs.writeFileSync('pipeline/migration/manifests/darya_savenkova.json',JSON.stringify(manifest,null,2)+'\n');
          NODE

      - name: Validate manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/darya_savenkova.json --json

      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate darya_savenkova \
            --manifest pipeline/migration/manifests/darya_savenkova.json \
            --date 2026-10-02 \
            --dry-run \
            --json > /tmp/dry-run.json
          node - <<'NODE'
          const p=require('/tmp/dry-run.json'),c=p.coverage;
          console.log(JSON.stringify({coverage:c,warnings:p.warnings,reviewItems:p.reviewItems,blockers:p.blockers,projectedBaseline:p.projectedBaseline},null,2));
          if(!p.executable||!c?.complete)process.exit(1);
          if(c.lessons?.source!==1||c.lessons?.candidate!==1)process.exit(2);
          if(c.ktp?.mappedHistoricalLessons!==0)process.exit(3);
          if(c.competencies?.source!==356||c.competencies?.candidate!==356)process.exit(4);
          if(c.mastery?.resolvedSource!==7||c.mastery?.candidate!==7||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(5);
          if((p.reviewItems||[]).length||(p.blockers||[]).length||(p.warnings||[]).length)process.exit(6);
          if(p.projectedBaseline?.minV2!==24||p.projectedBaseline?.maxNonV2!==0)process.exit(7);
          NODE

      - name: Verify design-reference surface after dry-run
        run: node --test pipeline/migration/test/darya-design-reference.test.mjs

      - name: Commit candidate manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/migration/manifests/darya_savenkova.json
          git diff --cached --quiet && exit 1 || true
          git commit -m "Migration: generate Darya Savenkova manifest"
          git push origin HEAD:feat/student-platform-v2-migrate-darya-savenkova
