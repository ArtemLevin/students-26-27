name: Timofey lesson 06.11 one-time canonical publication
# Re-run after removing stale date-specific assumptions from browser regression.
on:
  push:
    branches:
      - timofey-lesson-2026-11-06-inequalities
    paths:
      - '.github/workflows/timofey-2026-11-06-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review canonical publication dry-run
        run: |
          node scripts/publish-lesson.mjs timofey 06.11.26 \
            --intent students/timofey/site/data/publication-intents/2026-11-06.json \
            --dry-run > /tmp/timofey-publication-plan.json
          node -e "const p=require('/tmp/timofey-publication-plan.json');if(!p.executable||p.conflicts.length)process.exit(1);console.log(JSON.stringify({changedFiles:p.changedFiles,reviewItems:p.reviewItems,warnings:p.warnings},null,2))"
      - name: Publish and validate using repository production script
        run: |
          node scripts/publish-lesson.mjs timofey 06.11.26 \
            --intent students/timofey/site/data/publication-intents/2026-11-06.json
          node scripts/student.mjs validate timofey
      - name: Commit publisher-generated outputs to work branch
        run: |
          git add -- students/timofey/site/data/lessons/2026-11-06.lesson.json \
            students/timofey/site/lesson-registry.js \
            students/timofey/site/dashboard.js \
            students/timofey/site/data/ktp-state.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(timofey): canonical lesson registration 2026-11-06'
            git push origin HEAD:timofey-lesson-2026-11-06-inequalities
          fi
