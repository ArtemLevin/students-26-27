name: Volodia 04 Nov canonical lesson publication
on:
  push:
    branches:
      - feature/volodia-physics-2026-11-04
    paths:
      - 'students/volodia_khachaturian/site/04.11.26.html'
      - 'students/volodia_khachaturian/site/04.11.26-lab.html'
      - 'students/volodia_khachaturian/site/data/publication-intents/2026-11-04.json'
      - '.github/workflows/volodia-20261104-publish.yml'
permissions:
  contents: write
jobs:
  publish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/volodia-physics-2026-11-04
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run canonical publisher
        run: node scripts/publish-lesson.mjs volodia_khachaturian 04.11.26 --intent students/volodia_khachaturian/site/data/publication-intents/2026-11-04.json --dry-run
      - name: Publish lesson and evidence transactionally
        run: node scripts/publish-lesson.mjs volodia_khachaturian 04.11.26 --intent students/volodia_khachaturian/site/data/publication-intents/2026-11-04.json
      - name: Student platform validation
        run: node scripts/student.mjs validate volodia_khachaturian
      - name: Practice validation
        run: |
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
      - name: Commit canonical publisher output to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/volodia_khachaturian/site
          if ! git diff --cached --quiet; then
            git commit -m "Publish Volodia Nov 4 lesson via canonical publisher"
            git push origin HEAD:feature/volodia-physics-2026-11-04
          fi
