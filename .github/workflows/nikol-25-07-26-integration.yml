name: Integrate Nikol lesson 25-07-26

on:
  push:
    paths:
      - .github/workflows/nikol-25-07-26-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build lesson page and update navigator
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          root=Path('.')
          parts=sorted((root/'.github/nikol-25-07').glob('part-*.txt'))
          if len(parts)!=6:
              raise SystemExit(f'Expected 6 parts, found {len(parts)}')
          b64=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          page=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          page_path=root/'students/nikol_sarkisyants/site/25-07-26.html'
          page_path.write_text(page,encoding='utf-8')
          index_path=root/'students/nikol_sarkisyants/site/index.html'
          text=index_path.read_text(encoding='utf-8')
          text=text.replace('<article class="stat"><b>7</b><span>интерактивных модулей</span></article>','<article class="stat"><b>10</b><span>интерактивных модулей</span></article>',1)
          module9='        <article class="lesson-card">\n          <div class="lesson-number"><span>Модуль 09</span><span>21.07.26</span></div>\n          <h3>Комплексное повторение тестовой части</h3>\n          <p>Финансовые модели, планиметрия, векторы, вероятность, степени, логарифмы, движение и квадратные корни.</p>\n          <div class="skills"><span class="chip">повторение</span><span class="chip">тестовая часть</span><span class="chip">ЕГЭ</span></div>\n          <div class="lesson-actions">\n            <a class="btn primary lesson-link" data-lesson="review-21-07-26" href="21-07-26.html">Открыть занятие</a>\n            <a class="btn" href="../pdf_docs/21.07.26.pdf" download aria-label="Скачать пособие от 21 июля в формате PDF">PDF</a>\n            <a class="btn" href="../tex_docs/21.07.26.tex" download aria-label="Скачать исходник пособия от 21 июля в формате TeX">TeX</a>\n          </div>\n        </article>'
          module10='\n        <article class="lesson-card">\n          <div class="lesson-number"><span>Модуль 10</span><span>25.07.26</span></div>\n          <h3>Кредиты. Аннуитетная схема</h3>\n          <p>Равные платежи, таблица задолженности, вывод платежа, общая сумма выплат, переплата и процент переплаты.</p>\n          <div class="skills"><span class="chip">финансы</span><span class="chip">аннуитет</span><span class="chip">переплата</span></div>\n          <div class="lesson-actions">\n            <a class="btn primary lesson-link" data-lesson="finance-25-07-26" href="25-07-26.html">Открыть занятие</a>\n            <a class="btn" href="../pdf_docs/25.07.26.pdf" download="25-07-26.pdf" aria-label="Скачать пособие от 25 июля в формате PDF">PDF</a>\n            <a class="btn" href="../tex_docs/25.07.26.tex" download="25-07-26.tex" aria-label="Скачать исходник пособия от 25 июля в формате TeX">TeX</a>\n          </div>\n        </article>'
          if 'data-lesson="finance-25-07-26"' not in text:
              if module9 not in text: raise SystemExit('Module 09 anchor not found')
              text=text.replace(module9,module9+module10,1)
          resource21='          <div class="resource-row"><div><b>21.07.26</b><small>Комплексное повторение тестовой части</small></div><div class="resource-links"><a href="21-07-26.html">Web</a><a href="../pdf_docs/21.07.26.pdf" download>PDF</a><a href="../tex_docs/21.07.26.tex" download>TeX</a></div></div>'
          resource25='\n          <div class="resource-row"><div><b>25.07.26</b><small>Кредиты и аннуитетная схема</small></div><div class="resource-links"><a href="25-07-26.html">Открыть</a><a href="../pdf_docs/25.07.26.pdf" download="25-07-26.pdf">PDF</a><a href="../tex_docs/25.07.26.tex" download="25-07-26.tex">TeX</a></div></div>'
          if '<b>25.07.26</b><small>Кредиты и аннуитетная схема</small>' not in text:
              if resource21 not in text: raise SystemExit('Resource 21.07 anchor not found')
              text=text.replace(resource21,resource21+resource25,1)
          text=text.replace('>Web</a>','>Открыть</a>')
          index_path.write_text(text,encoding='utf-8')
          for p in parts: p.unlink()
          (root/'.github/nikol-25-07').rmdir()
          workflow=root/'.github/workflows/nikol-25-07-26-integration.yml'
          workflow.unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Добавить занятие Николь от 25.07.26"
          git push
