name: Xenia lesson publication dry-run and verification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
jobs:
  publish-preview:
    if: github.event.pull_request.head.ref == 'lesson/xenia-26-11-26' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical publisher
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 26.11.26 --intent students/xenia_klykova/publication-intents/2026-11-26.json --dry-run
          node scripts/publish-lesson.mjs xenia_klykova 26.11.26 --intent students/xenia_klykova/publication-intents/2026-11-26.json
      - name: Emit canonical changes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const names=execFileSync('git',['ls-files','-m','-o','--exclude-standard'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for(const name of names){
            if(!name.startsWith('students/xenia_klykova/'))throw Error('Unexpected change: '+name);
            const content=fs.readFileSync(name,'utf8');
            console.log('PUBLICATION_FILE '+JSON.stringify({name,length:content.length}));
            for(let i=0;i<content.length;i+=2000)console.log('PUBLICATION_CHUNK '+JSON.stringify(content.slice(i,i+2000)));
            console.log('PUBLICATION_END');
          }
          JS
      - name: Release checks
        run: |
          node scripts/student.mjs validate xenia_klykova
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test shared/practice/test/*.test.mjs
          node --test pipeline/practice/test/*.test.mjs
