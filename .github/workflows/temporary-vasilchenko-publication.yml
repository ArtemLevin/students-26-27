name: One-time Vasilchenko publication verification
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  publish:
    if: github.head_ref == 'lesson/xenia-vasilchenko-2026-11-24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run and publish with canonical tool
        run: |
          set -e
          INTENT=students/xenia_vasilchenko/site/data/publication-intents/2026-11-24.json
          node scripts/publish-lesson.mjs xenia_vasilchenko 24.11.26 --intent "$INTENT" --dry-run
          node scripts/publish-lesson.mjs xenia_vasilchenko 24.11.26 --intent "$INTENT"
          node scripts/student.mjs validate xenia_vasilchenko
          node scripts/student.mjs audit
          git diff --stat
          git status --short
      - name: Export canonical publication output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const paths = [...execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n'), ...execFileSync('git',['ls-files','--others','--exclude-standard'],{encoding:'utf8'}).trim().split('\n')].filter(Boolean);
          for (const path of paths) {
            if (!path.startsWith('students/xenia_vasilchenko/')) throw new Error('Unexpected publisher change '+path);
            console.log('PUBLICATION_FILE '+JSON.stringify({path, content:fs.readFileSync(path,'utf8')}));
          }
          NODE
