name: Xenia site audit PR

on:
  pull_request:
    paths:
      - '.github/xenia-site-audit-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair and audit
        run: python .github/scripts/xenia_site_audit_repair.py
      - name: Commit repairs to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/xenia-site-audit-trigger
          git add students/xenia_klykova/site
          if git diff --cached --quiet; then
            echo "No repair changes"
            exit 0
          fi
          git commit -m "Fix Xenia HTML display and interactions"
          git push origin HEAD:${{ github.head_ref }}
