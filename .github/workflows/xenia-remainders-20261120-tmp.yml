name: Temporary Xenia 20 Nov canonical publication
on:
  push:
    branches:
      - feat/xenia-remainders-2026-11-20
    paths:
      - .github/workflows/xenia-remainders-20261120-tmp.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publication dry-run
        run: node scripts/publish-lesson.mjs xenia_klykova 20.11.26 --intent students/xenia_klykova/site/data/publication-intents/2026-11-20.json --dry-run
      - name: Canonical transactional publication
        run: node scripts/publish-lesson.mjs xenia_klykova 20.11.26 --intent students/xenia_klykova/site/data/publication-intents/2026-11-20.json
      - name: Student Platform v2 validation
        run: node scripts/student.mjs validate xenia_klykova
      - name: Commit canonical publisher outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/xenia_klykova/site/lesson-registry.js students/xenia_klykova/site/data/lessons/2026-11-20.lesson.json students/xenia_klykova/site/data/ktp-state.json students/xenia_klykova/site/data/mastery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(xenia): publish 20 Nov lesson through v2 pipeline"
            git push origin HEAD:feat/xenia-remainders-2026-11-20
          fi
