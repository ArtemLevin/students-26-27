name: Temporary Nastya 08.10.26 transactional publication
on:
  push:
    branches:
      - feat/nastya-pavlova-lesson-081026
    paths:
      - .github/workflows/_publish-nastya-081026.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review transaction plan
        run: node scripts/publish-lesson.mjs nastya_pavlova 08.10.26 --intent students/nastya_pavlova/site/data/publication-intents/2026-10-08.json --dry-run
      - name: Apply canonical transaction and verify
        run: |
          node scripts/publish-lesson.mjs nastya_pavlova 08.10.26 --intent students/nastya_pavlova/site/data/publication-intents/2026-10-08.json
          node scripts/student.mjs validate nastya_pavlova
          node --test students/nastya_pavlova/site/tests/student-platform-v2.test.mjs
      - name: Commit generated artifacts and retire temporary workflow
        run: |
          rm -f .github/workflows/_publish-nastya-081026.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add students/nastya_pavlova/site/data/lessons/2026-10-08.lesson.json students/nastya_pavlova/site/lesson-registry.js students/nastya_pavlova/site/data/ktp-state.json students/nastya_pavlova/site/data/mastery-state.json .github/workflows/_publish-nastya-081026.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Nastya 08.10.26 via canonical v2 pipeline'
            git push origin HEAD:feat/nastya-pavlova-lesson-081026
          fi
