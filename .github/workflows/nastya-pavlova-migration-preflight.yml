name: Nastya Pavlova migration preflight

on:
  push:
    branches:
      - 'feat/student-platform-v2-migrate-nastya-pavlova'

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-migrate-nastya-pavlova
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect reconciled source
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state nastya_pavlova --json > /tmp/nastya.json
          node - <<'NODE'
          const r=require('/tmp/nastya.json');
          const ids=new Set(r.catalog?.ids||[]);
          if(!r.automaticEligible)process.exit(1);
          if(r.catalog?.count!==379||r.mastery?.resolved?.length!==367)process.exit(2);
          if(r.mastery?.conflicts?.length||r.diagnostics?.orphanClaims?.length||r.diagnostics?.warnings?.length)process.exit(3);
          if(!r.mastery.resolved.every(x=>x.sourceKind==='mastery-authority'&&x.sourcePath==='mastery-authority.js'))process.exit(4);
          for(const id of ['ege2027_t6_random_variable','ege2027_t6_variance','ege2027_t6_stddev','ege2027_t17_variables','ege2027_t17_optimization','ege2027_t17_interpretation'])if(!ids.has(id))process.exit(5);
          NODE

      - name: Generate candidate manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report=require('/tmp/nastya.json');
          const manifest={
            version:1,
            studentId:'nastya_pavlova',
            identity:{
              studentName:'Анастасия Павлова',
              program:'ЕГЭ по математике'
            },
            sourceArchitecture:'legacy-structured',
            planning:{mode:'rolling',ktpExtraction:null},
            lessonMappings:[
              {lessonDate:'2026-08-26',ktpMatches:[]},
              {lessonDate:'2026-09-03',ktpMatches:[]},
              {lessonDate:'2026-09-07',ktpMatches:[]},
              {lessonDate:'2026-09-10',ktpMatches:[]},
              {lessonDate:'2026-09-14',ktpMatches:[]},
              {lessonDate:'2026-09-17',ktpMatches:[]},
              {lessonDate:'2026-09-21',ktpMatches:[]},
              {lessonDate:'2026-09-24',ktpMatches:[]},
              {lessonDate:'2026-09-28',ktpMatches:[]}
            ],
            competencyMappings:[],
            preserveMastery:report.mastery.resolved.map(item=>({
              competencyId:item.competencyId,
              level:item.level,
              sourcePath:item.sourcePath,
              sourceKind:item.sourceKind,
              confidence:'exact',
              basis:item.basis
            })),
            ambiguities:[],
            blockers:[],
            warnings:[]
          };
          fs.mkdirSync('pipeline/migration/manifests',{recursive:true});
          fs.writeFileSync('pipeline/migration/manifests/nastya_pavlova.json',JSON.stringify(manifest,null,2)+'\n');
          NODE

      - name: Validate manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/nastya_pavlova.json --json

      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate nastya_pavlova \
            --manifest pipeline/migration/manifests/nastya_pavlova.json \
            --date 2026-10-02 \
            --dry-run \
            --json > /tmp/dry-run.json
          node - <<'NODE'
          const p=require('/tmp/dry-run.json'),c=p.coverage;
          if(!p.executable||!c?.complete)process.exit(1);
          if(c.lessons?.source!==9||c.lessons?.candidate!==9)process.exit(2);
          if(c.ktp?.mappedHistoricalLessons!==0)process.exit(3);
          if(c.competencies?.source!==379||c.competencies?.candidate!==379)process.exit(4);
          if(c.mastery?.resolvedSource!==367||c.mastery?.candidate!==367||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(5);
          if((p.reviewItems||[]).length||(p.blockers||[]).length||(p.warnings||[]).length)process.exit(6);
          console.log(JSON.stringify({coverage:c,projectedBaseline:p.projectedBaseline},null,2));
          NODE

      - name: Commit candidate manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/migration/manifests/nastya_pavlova.json
          git diff --cached --quiet && exit 1 || true
          git commit -m "Reconciliation: generate Nastya Pavlova migration manifest"
          git push origin HEAD:feat/student-platform-v2-migrate-nastya-pavlova
