name: Temporary Daniil November lesson publisher
on:
  push:
    branches:
      - lesson/daniil-2026-11-02-web

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, 'publish canonical lesson 2026-11-02') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publication plan
        run: |
          node scripts/publish-lesson.mjs daniil_khriastov 02.11.26 --intent students/daniil_khriastov/site/data/publication-intents/2026-11-02.json --dry-run
      - name: Apply canonical publication
        run: |
          node scripts/publish-lesson.mjs daniil_khriastov 02.11.26 --intent students/daniil_khriastov/site/data/publication-intents/2026-11-02.json
      - name: Validate student package
        run: |
          node scripts/student.mjs validate daniil_khriastov
          node scripts/student.mjs audit
          node --test students/daniil_khriastov/site/tests/*.test.mjs
      - name: Commit generated canonical registry and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add students/daniil_khriastov/site/data/lessons/2026-11-02.lesson.json
          git add students/daniil_khriastov/site/lesson-registry.js
          git add students/daniil_khriastov/site/data/ktp-state.json
          git rm .github/workflows/temporary-daniil-publish-20261102.yml
          git diff --cached --stat
          git commit -m 'chore(daniil): publish canonical lesson 2026-11-02'
          git push origin HEAD:refs/heads/lesson/daniil-2026-11-02-web
