name: Nikol 09 Nov canonical lesson publication (temporary)
on:
  push:
    branches:
      - feat/nikol-stereometry-2026-11-09
    paths:
      - '.github/workflows/nikol-20261109-publish-temporary.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'ArtemLevin/students-26-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nikol-stereometry-2026-11-09
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical publisher dry run
        run: |
          node scripts/publish-lesson.mjs nikol_sarkisyants 09.11.26 --intent students/nikol_sarkisyants/site/data/lesson-publication-intents/2026-11-09.json --dry-run
      - name: Canonical publisher apply
        run: |
          node scripts/publish-lesson.mjs nikol_sarkisyants 09.11.26 --intent students/nikol_sarkisyants/site/data/lesson-publication-intents/2026-11-09.json
      - name: Refresh dashboard lesson registry import after canonical publication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='students/nikol_sarkisyants/site/dashboard.js';
          const old=fs.readFileSync(file,'utf8');
          const updated=old.replace(/(lesson-registry\.js\?v=)\d{8}/,(_,prefix)=>prefix+'20261109');
          if(!updated.includes('lesson-registry.js?v=20261109'))throw new Error('Lesson registry import missing');
          fs.writeFileSync(file,updated);
          NODE
      - name: Verify student contract and math tests
        run: |
          node scripts/student.mjs validate nikol_sarkisyants
          node --test students/nikol_sarkisyants/site/tests/lesson-09.11.test.mjs
          node --test students/nikol_sarkisyants/site/tests/lesson-02.11.test.mjs students/nikol_sarkisyants/site/tests/lesson-05.11.test.mjs
      - name: Commit publisher-generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/nikol_sarkisyants/site/data/lessons/2026-11-09.lesson.json
          git add students/nikol_sarkisyants/site/lesson-registry.js
          git add students/nikol_sarkisyants/site/dashboard.js
          git add students/nikol_sarkisyants/site/data/ktp-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(nikol): publish 09 Nov 2026 lesson via canonical publisher"
            git push origin HEAD:feat/nikol-stereometry-2026-11-09
          fi
