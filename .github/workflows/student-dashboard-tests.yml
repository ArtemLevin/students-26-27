name: Student dashboard regression

on:
  push:
    paths:
      - 'students/**'
      - 'shared/student-dashboard/**'
      - 'shared/practice/**'
      - 'pipeline/prompts/04_spaced_practice.md'
      - '.github/workflows/student-dashboard-tests.yml'
  pull_request:
    paths:
      - 'students/**'
      - 'shared/student-dashboard/**'
      - 'shared/practice/**'
      - 'pipeline/prompts/04_spaced_practice.md'
      - '.github/workflows/student-dashboard-tests.yml'

permissions:
  contents: read

jobs:
  dashboard:
    name: dashboard / ${{ matrix.student }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - student: kirill_zinoviev
            test: node students/kirill_zinoviev/site/tests/dashboard-regression.mjs
          - student: sofya_kalney
            test: node students/sofya_kalney/site/tests/dashboard-regression.mjs
          - student: timofey
            test: node students/timofey/site/tests/dashboard-regression.mjs
          - student: volodia_khachaturian
            test: node students/volodia_khachaturian/site/tests/dashboard-regression.mjs
          - student: xenia_klykova
            test: node students/xenia_klykova/site/tests/dashboard-regression.mjs
          - student: nikol_sarkisyants
            test: node students/nikol_sarkisyants/site/tests/dashboard-p0.test.mjs && node students/nikol_sarkisyants/site/tests/dashboard-p1.test.mjs && node students/nikol_sarkisyants/site/tests/dashboard-p2.test.mjs && node students/nikol_sarkisyants/site/tests/dashboard-p3.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check dashboard modules
        shell: bash
        run: |
          if [ -f "students/${{ matrix.student }}/site/dashboard.js" ]; then
            node --check "students/${{ matrix.student }}/site/dashboard.js"
          fi
          if [ -f "students/${{ matrix.student }}/site/lesson-registry.js" ]; then
            node --check "students/${{ matrix.student }}/site/lesson-registry.js"
          fi
          if [ -f "students/${{ matrix.student }}/site/competence-config.js" ]; then
            node --check "students/${{ matrix.student }}/site/competence-config.js"
          fi
          if [ -f "students/${{ matrix.student }}/site/practice-config.js" ]; then
            node --check "students/${{ matrix.student }}/site/practice-config.js"
          fi
          node --check shared/student-dashboard/dashboard-core.js
          node --check shared/student-dashboard/legacy-competence-map.js
      - name: Run regression suite
        run: ${{ matrix.test }}

  index-inventory:
    name: index inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every student index entry point
        run: node shared/student-dashboard/test-index-inventory.mjs

  practice:
    name: shared practice engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check practice modules
        shell: bash
        run: |
          find shared/practice -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Validate student mappings
        run: node shared/practice/validate-configs.mjs
      - name: Run scheduler, generator and integration tests
        run: node --test shared/practice/test/*.test.mjs
