name: Matvey 26 November publication verification
on:
  pull_request:
    paths:
      - 'students/matvey_gorbachev/site/**'
      - '.github/workflows/matvey-20261126-publication.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run publisher in isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          INTENT=students/matvey_gorbachev/site/data/publication-intents/2026-11-26.json
          node scripts/publish-lesson.mjs matvey_gorbachev 26.11.26 --intent "$INTENT" --dry-run
          node scripts/publish-lesson.mjs matvey_gorbachev 26.11.26 --intent "$INTENT" > /tmp/matvey-publication.json
          cat /tmp/matvey-publication.json
          node scripts/student.mjs validate matvey_gorbachev
          node -e 'const fs=require("fs"); const result=JSON.parse(fs.readFileSync("/tmp/matvey-publication.json","utf8")); for(const p of result.changedFiles) console.log("MATVEY_PUBLICATION_FILE "+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}));'
