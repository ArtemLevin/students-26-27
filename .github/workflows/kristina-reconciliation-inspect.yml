name: Kristina reconciliation inspect

on:
  push:
    branches:
      - 'feat/student-platform-v2-reconcile-kristina'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-reconcile-kristina
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused reconciliation tests
        run: |
          node --test pipeline/migration/test/legacy-state.test.mjs
          node --test pipeline/migration/test/readiness-inventory.test.mjs

      - name: Inspect reconciled legacy source
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state kristina --json > /tmp/kristina.json
          node - <<'NODE'
          const r=require('/tmp/kristina.json');
          const counts={};
          for(const item of r.mastery.resolved)counts[item.level]=(counts[item.level]||0)+1;
          const repeats=[];
          const data=require('fs').readFileSync('students/kristina/site/mastery-authority.js','utf8');
          console.log(JSON.stringify({
            automaticEligible:r.automaticEligible,
            catalog:r.catalog?.count,
            mastery:r.mastery?.resolved?.length,
            conflicts:r.mastery?.conflicts?.length,
            orphans:r.diagnostics?.orphanClaims?.length,
            warnings:r.diagnostics?.warnings,
            levelCounts:counts,
            sourceKinds:[...new Set(r.mastery.resolved.map(x=>x.sourceKind))],
            sourcePaths:[...new Set(r.mastery.resolved.map(x=>x.sourcePath))],
            authorityBytes:data.length
          },null,2));
          if(!r.automaticEligible)process.exit(1);
          if(r.catalog?.count!==360||r.mastery?.resolved?.length!==360)process.exit(2);
          if(counts[0]!==340||counts[2]!==17||counts[3]!==3||Object.keys(counts).length!==3)process.exit(3);
          if(r.mastery?.conflicts?.length||r.diagnostics?.orphanClaims?.length||r.diagnostics?.warnings?.length)process.exit(4);
          NODE
