name: Publish Jaroslav trig lesson 2026-10-12
on:
  push:
    branches:
      - codex/jaroslav-lesson-20261012
    paths:
      - .github/workflows/publish-jaroslav-20261012.yml
      - .github/publish-jaroslav-20261012.trigger

permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone page and source anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          root=Path("students/jaroslav_gavrilov")
          site=root/"site"
          assert (root/"pdf_docs/12.10.26.pdf").exists()
          assert (root/"tex_docs/12.10.26.tex").exists()
          assert (root/"formulas/12.10.26.pdf").exists()
          assert (site/"12.10.26.html").exists() and (site/"12.10.26-lab.html").exists()
          for fname in ("12.10.26.html","12.10.26-lab.html"):
              html=(site/fname).read_text()
              ids=re.findall(r'\bid="([^"]+)"',html)
              assert len(set(ids))==len(ids),(fname,"Duplicate ids")
              assert "cdn." not in html and "console.log" not in html
              for rel in re.findall(r'href="([^"]+)"',html):
                  rel=rel.split("#",1)[0].split("?",1)[0]
                  if rel and not rel.startswith("#") and not rel.startswith("data:"):
                      assert (site/rel).exists(),(fname,rel)
              js=re.findall(r'<script>([\s\S]*?)</script>',html)
              assert len(js)==1
              p=Path("/tmp")/(fname+".js");p.write_text(js[0])
              subprocess.run(["node","--check",str(p)],check=True)
              print(fname,"anchors",len(ids),"scripts verified")
          PY
      - name: Dry run canonical publication
        run: |
          node scripts/publish-lesson.mjs jaroslav_gavrilov 12.10.26 \
            --intent students/jaroslav_gavrilov/site/data/lesson-publication-intents/2026-10-12.json --dry-run
      - name: Apply canonical publication
        run: |
          node scripts/publish-lesson.mjs jaroslav_gavrilov 12.10.26 \
            --intent students/jaroslav_gavrilov/site/data/lesson-publication-intents/2026-10-12.json
      - name: Student and practice release gates
        run: |
          node scripts/student.mjs validate jaroslav_gavrilov
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test shared/practice/test/*.test.mjs
          node --test pipeline/practice/test/*.test.mjs
      - name: Commit canonical publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- students/jaroslav_gavrilov/site/data/lessons/2026-10-12.lesson.json \
            students/jaroslav_gavrilov/site/data/ktp-state.json \
            students/jaroslav_gavrilov/site/data/mastery-state.json \
            students/jaroslav_gavrilov/site/lesson-registry.js
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Publish Jaroslav 12 October lesson via Student Platform v2"
          git push origin HEAD:codex/jaroslav-lesson-20261012
