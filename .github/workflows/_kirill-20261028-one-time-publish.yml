name: One-time Kirill 28 Oct lesson publication

on:
  push:
    branches:
      - feature/kirill-geometry-20261028-site
    paths:
      - .github/workflows/_kirill-20261028-one-time-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kirill-geometry-20261028-site
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run canonical Student Platform v2 publisher
        run: node scripts/publish-lesson.mjs kirill_zinoviev 28.10.26 --intent students/kirill_zinoviev/site/data/publication-intents/2026-10-28.json --dry-run
      - name: Publish with canonical pipeline
        run: node scripts/publish-lesson.mjs kirill_zinoviev 28.10.26 --intent students/kirill_zinoviev/site/data/publication-intents/2026-10-28.json
      - name: Validate Kirill dashboard and publication
        run: |
          node scripts/student.mjs validate kirill_zinoviev
          node students/kirill_zinoviev/site/tests/dashboard-regression.mjs
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
      - name: Commit published outputs and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A students/kirill_zinoviev/
          git rm -- .github/workflows/_kirill-20261028-one-time-publish.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Publish Kirill October 28 lesson via canonical v2 publisher"
          git push origin HEAD:feature/kirill-geometry-20261028-site
