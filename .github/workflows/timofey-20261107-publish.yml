name: Timofey 07 Nov 2026 publication
on:
  push:
    branches:
      - lesson/timofey-2026-11-07-optimization
    paths:
      - .github/workflows/timofey-20261107-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight review
        run: node scripts/publish-lesson.mjs timofey 07.11.26 --intent students/timofey/site/data/publication-intents/2026-11-07.json --dry-run
      - name: Transactional v2 publication
        run: node scripts/publish-lesson.mjs timofey 07.11.26 --intent students/timofey/site/data/publication-intents/2026-11-07.json
      - name: Validate student package
        run: node scripts/student.mjs validate timofey
      - name: Record publisher-produced changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add students/timofey/site/data/lessons/2026-11-07.lesson.json students/timofey/site/lesson-registry.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Timofey 07.11.26 through Student Platform v2'
            git push origin HEAD:lesson/timofey-2026-11-07-optimization
          fi
