name: P5.2-7 Nikol migration executor

on:
  push:
    branches:
      - feat/student-platform-v2-p5-2-7-nikol
    paths:
      - pipeline/migration/manifests/nikol_sarkisyants.json
      - pipeline/migration/test/legacy-state.test.mjs
      - pipeline/migration/test/candidate-builder.test.mjs
      - pipeline/migration/build/lessons.mjs
      - .github/workflows/p5-2-7-nikol-preflight.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-p5-2-7-nikol
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard one-shot execution
        id: guard
        shell: bash
        run: |
          if [ -f students/nikol_sarkisyants/student-contract.json ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Migration regression before apply
        if: steps.guard.outputs.already_applied == 'false'
        run: node --test pipeline/migration/test/*.test.mjs
      - name: Validated dry-run
        if: steps.guard.outputs.already_applied == 'false'
        shell: bash
        run: |
          node scripts/student.mjs migrate nikol_sarkisyants \
            --manifest pipeline/migration/manifests/nikol_sarkisyants.json \
            --date 2026-10-02 \
            --dry-run \
            --json | tee /tmp/nikol-dry-run.json
      - name: Transactional apply
        if: steps.guard.outputs.already_applied == 'false'
        shell: bash
        run: |
          node scripts/student.mjs migrate nikol_sarkisyants \
            --manifest pipeline/migration/manifests/nikol_sarkisyants.json \
            --date 2026-10-02 \
            --apply \
            --json | tee /tmp/nikol-apply.json
      - name: Post-apply verification
        if: steps.guard.outputs.already_applied == 'false'
        shell: bash
        run: |
          node pipeline/migration/audit-ratchet.mjs
          node scripts/student.mjs validate
          node students/nikol_sarkisyants/site/tests/student-platform-v2.test.mjs
          node students/nikol_sarkisyants/site/tests/dashboard-p0.test.mjs
          node students/nikol_sarkisyants/site/tests/dashboard-p1.test.mjs
          node students/nikol_sarkisyants/site/tests/dashboard-p2.test.mjs
          node students/nikol_sarkisyants/site/tests/dashboard-p3.test.mjs
          node students/nikol_sarkisyants/site/tests/practice-adapter.test.mjs
          node --test pipeline/migration/test/*.test.mjs
      - name: Verify generated write-set
        if: steps.guard.outputs.already_applied == 'false'
        shell: bash
        run: |
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0
          for file in "${changed[@]}"; do
            case "$file" in
              pipeline/migration/baseline.json|\
              pipeline/migration/reports/nikol_sarkisyants.json|\
              students/nikol_sarkisyants/student-contract.json|\
              students/nikol_sarkisyants/site/data/*|\
              students/nikol_sarkisyants/site/lesson-registry.js|\
              students/nikol_sarkisyants/site/tests/student-platform-v2.test.mjs)
                ;;
              *)
                echo "Unexpected migration write: $file" >&2
                exit 1
                ;;
            esac
          done
      - name: Commit generated migration
        if: steps.guard.outputs.already_applied == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/migration/baseline.json \
            pipeline/migration/reports/nikol_sarkisyants.json \
            students/nikol_sarkisyants/student-contract.json \
            students/nikol_sarkisyants/site/data \
            students/nikol_sarkisyants/site/lesson-registry.js \
            students/nikol_sarkisyants/site/tests/student-platform-v2.test.mjs
          git diff --cached --check
          git commit -m "P5.2-7: apply Nikol Student Platform v2 migration"
          git push origin HEAD:feat/student-platform-v2-p5-2-7-nikol
