name: Sofya site audit PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/sofya-site-audit-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair and audit Sofya HTML pages
        run: python .github/scripts/sofya_site_audit_repair.py

      - name: Commit repairs to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/sofya-site-audit-trigger
          git rm -f .github/workflows/sofya-site-audit-fix.yml
          git rm -f .github/scripts/sofya_site_audit_repair.py
          git add students/sofya_kalney/site
          if git diff --cached --quiet; then
            echo "No repair changes"
            exit 0
          fi
          git commit -m "fix(sofya): repair HTML rendering and interactions"
          git push origin HEAD:"$HEAD_REF"
