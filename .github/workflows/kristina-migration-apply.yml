name: Kristina migration apply

on:
  push:
    branches:
      - 'feat/student-platform-v2-migrate-kristina'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-migrate-kristina
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate reviewed manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/kristina.json --json

      - name: Reconcile manifest against current authority
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state kristina --json > /tmp/kristina.json
          node - <<'NODE'
          const manifest=require('./pipeline/migration/manifests/kristina.json');
          const report=require('/tmp/kristina.json');
          if(!report.automaticEligible)process.exit(1);
          if(report.catalog?.count!==360||report.mastery?.resolved?.length!==360)process.exit(2);
          const expected=new Map(report.mastery.resolved.map(x=>[x.competencyId,x.level]));
          if(manifest.preserveMastery.length!==expected.size)process.exit(3);
          for(const item of manifest.preserveMastery){
            if(expected.get(item.competencyId)!==item.level)process.exit(4);
            if(item.sourcePath!=='site/mastery-authority.js'||item.sourceKind!=='mastery-authority'||item.confidence!=='exact')process.exit(5);
          }
          NODE

      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate kristina \
            --manifest pipeline/migration/manifests/kristina.json \
            --date 2026-10-02 \
            --dry-run \
            --json > /tmp/dry-run.json
          node -e "const p=require('/tmp/dry-run.json'),c=p.coverage; if(!p.executable||!c?.complete)process.exit(1); if(c.lessons?.source!==2||c.lessons?.candidate!==2)process.exit(2); if(c.ktp?.mappedHistoricalLessons!==0)process.exit(3); if(c.competencies?.source!==360||c.competencies?.candidate!==360)process.exit(4); if(c.mastery?.resolvedSource!==360||c.mastery?.candidate!==360||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(5); if((p.reviewItems||[]).length||(p.blockers||[]).length||(p.warnings||[]).length)process.exit(6);"

      - name: Transactional apply
        run: |
          node scripts/student.mjs migrate kristina \
            --manifest pipeline/migration/manifests/kristina.json \
            --date 2026-10-02 \
            --apply \
            --json

      - name: Validate migrated package
        run: node scripts/student.mjs validate kristina --json

      - name: Verify canonical mastery preservation
        run: |
          node - <<'NODE'
          const state=require('./students/kristina/site/data/mastery-state.json');
          const values=Object.values(state.levels);
          const counts={};
          for(const value of values){
            counts[value.level]=(counts[value.level]||0)+1;
            if(value.sourcePath!=='site/mastery-authority.js'||value.sourceKind!=='mastery-authority')process.exit(1);
          }
          if(values.length!==360||counts[0]!==340||counts[2]!==17||counts[3]!==3||Object.keys(counts).length!==3)process.exit(2);
          NODE

      - name: Verify migration report and ratchet target
        run: |
          node - <<'NODE'
          const report=require('./pipeline/migration/reports/kristina.json');
          const baseline=require('./pipeline/migration/baseline.json');
          if(!report.complete)process.exit(1);
          if(report.lessons.source!==2||report.lessons.candidate!==2)process.exit(2);
          if(report.ktp.mappedHistoricalLessons!==0)process.exit(3);
          if(report.competencies.source!==360||report.competencies.candidate!==360)process.exit(4);
          if(report.mastery.resolvedSource!==360||report.mastery.candidate!==360||report.mastery.conflicts!==0||report.mastery.orphans!==0)process.exit(5);
          if(report.materials.html!==2||report.materials.pdf!==2||report.materials.tex!==2||report.materials.lab!==0)process.exit(6);
          if(report.preservation.protectedFilesChanged.length)process.exit(7);
          if(report.warnings.length||report.reviewItems.length||report.blockers.length)process.exit(8);
          if(baseline.minV2!==21||baseline.maxNonV2!==3||baseline.byArchitecture?.v2!==21||baseline.byArchitecture?.['legacy-structured']!==3)process.exit(9);
          NODE

      - name: Run migration regression suite
        run: node --test pipeline/migration/test/*.test.mjs

      - name: Enforce architecture ratchet
        run: node pipeline/migration/audit-ratchet.mjs

      - name: Commit generated migration state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/migration/baseline.json \
            pipeline/migration/reports/kristina.json \
            students/kristina/student-contract.json \
            students/kristina/site/data \
            students/kristina/site/lesson-registry.js \
            students/kristina/site/tests/student-platform-v2.test.mjs
          if git diff --cached --quiet; then
            echo "Migration produced no generated changes"
            exit 1
          fi
          git commit -m "Reconciliation: apply Kristina Student Platform v2 migration"
          git push origin HEAD:feat/student-platform-v2-migrate-kristina
