name: One-shot Sofya heatmap update 14.08.26

on:
  push:
    branches:
      - agent/update-sofya-heatmap-14-08

permissions:
  contents: write

jobs:
  patch_heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-sofya-heatmap-14-08
          fetch-depth: 0

      - name: Patch heatmap
        shell: bash
        run: |
          echo '    ' | base64 -d > /tmp/patch_heatmap.py
          python /tmp/patch_heatmap.py

      - name: Commit heatmap update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/sofya_kalney/site/index.html
          if git diff --cached --quiet; then
            echo "No heatmap changes to commit"
            exit 0
          fi
          git commit -m "Update Sofya heatmap for 14.08.26"
          git push origin HEAD:agent/update-sofya-heatmap-14-08
