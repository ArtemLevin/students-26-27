name: Nikol 11 Nov 2026 transactional publication (temporary)

on:
  push:
    branches:
      - lesson-nikol-2026-11-11-stereometry
    paths:
      - .github/workflows/nikol-111126-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lesson-nikol-2026-11-11-stereometry
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm target and canonical source
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "lesson-nikol-2026-11-11-stereometry"
          test -f students/nikol_sarkisyants/site/11.11.26.html
          test -f students/nikol_sarkisyants/site/data/lesson-publication-intents/2026-11-11.json
          test -f students/nikol_sarkisyants/site/data/practice-publications/2026-11-11.json
      - name: Canonical publication dry-run
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs nikol_sarkisyants 11.11.26 --intent students/nikol_sarkisyants/site/data/lesson-publication-intents/2026-11-11.json --dry-run | tee /tmp/nikol-publish-dry-run.json
          node -e 'const p=require("/tmp/nikol-publish-dry-run.json");if(!p.executable||p.reviewItems?.length||p.conflicts?.length)process.exit(1)'
      - name: Canonical transactional publication
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs nikol_sarkisyants 11.11.26 --intent students/nikol_sarkisyants/site/data/lesson-publication-intents/2026-11-11.json
      - name: Student release gate
        run: |
          set -euo pipefail
          node scripts/student.mjs validate nikol_sarkisyants
          node scripts/student.mjs audit
          node --test students/nikol_sarkisyants/site/tests/*.test.mjs
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
      - name: Commit canonical generated artifacts
        run: |
          set -euo pipefail
          git add students/nikol_sarkisyants/site/lesson-registry.js students/nikol_sarkisyants/site/data/
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish Nikol 11.11.26 via Student Platform v2'
            git push origin HEAD:refs/heads/lesson-nikol-2026-11-11-stereometry
          fi
      - name: Verify published registry on branch
        run: |
          set -euo pipefail
          node -e 'import("./students/nikol_sarkisyants/site/lesson-registry.js").then(m=>{if(m.LESSONS[0]?.date!=="2026-11-11")process.exit(1);console.log("Latest lesson:",m.LESSONS[0].date,m.LESSONS[0].href)})'
          test -f students/nikol_sarkisyants/site/data/lessons/2026-11-11.lesson.json

# Historical lesson assertions updated for 11 Nov publication.
