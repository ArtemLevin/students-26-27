name: P5.2-3 Timofey migration preflight

on:
  push:
    branches:
      - feat/student-platform-v2-p5-2-3-timofey
    paths:
      - .github/workflows/p5-2-3-timofey-preflight.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Timofey legacy state
        shell: bash
        run: |
          node pipeline/migration/inspect-legacy-state.mjs timofey --json
      - name: Inspect Timofey historical lessons
        shell: bash
        run: |
          node --input-type=module -e "import {discoverHistoricalLessons} from './pipeline/migration/legacy/discover-lessons.mjs'; const r=discoverHistoricalLessons({root:process.cwd(),studentId:'timofey'}); console.log(JSON.stringify({studentId:r.studentId,lessons:r.lessons.map(x=>({date:x.date,href:x.href,sources:x.sources})),diagnostics:r.diagnostics},null,2));"
