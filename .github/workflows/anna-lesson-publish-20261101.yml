name: Publish Anna lesson 01.11.26 (one-off)
on:
  push:
    branches:
      - site/anna-20261101-motion
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewed publication plan
        run: |
          node scripts/publish-lesson.mjs anna_bannova 01.11.26 --intent students/anna_bannova/site/data/lessons/2026-11-01.publication-intent.json --dry-run > /tmp/anna-publication-plan.json
          cat /tmp/anna-publication-plan.json
          node -e 'const p=require("/tmp/anna-publication-plan.json");if(!p.executable||p.conflicts.length||p.reviewItems.length){process.exitCode=1;console.error("Publication requires review")}';
      - name: Publish through canonical v2 transaction
        run: |
          node scripts/publish-lesson.mjs anna_bannova 01.11.26 --intent students/anna_bannova/site/data/lessons/2026-11-01.publication-intent.json
      - name: Release verification
        run: |
          node scripts/student.mjs validate anna_bannova
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --check students/anna_bannova/site/lesson-registry.js
      - name: Commit transaction artifacts and remove one-off workflow
        run: |
          rm .github/workflows/anna-lesson-publish-20261101.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish Anna motion lesson via v2 pipeline"
          git push origin HEAD:site/anna-20261101-motion
