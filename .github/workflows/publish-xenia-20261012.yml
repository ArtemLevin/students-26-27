name: Publish Xenia 12 Oct lesson
on:
  push:
    branches:
      - codex/xenia-lesson-2026-10-12
    paths:
      - 'students/xenia_klykova/site/12.10.26.html'
      - 'students/xenia_klykova/site/12.10.26-lab.html'
      - 'students/xenia_klykova/site/data/publication-intents/2026-10-12.json'
      - 'students/xenia_klykova/site/data/practice-publications/2026-10-12.json'
      - 'students/xenia_klykova/site/tests/lesson-09.10.26-review.test.mjs'
      - 'students/xenia_klykova/site/tests/lesson-12.10.26.test.mjs'
      - '.github/workflows/publish-xenia-20261012.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review publication dry-run
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 12.10.26 --intent students/xenia_klykova/site/data/publication-intents/2026-10-12.json --dry-run
      - name: Run canonical publication
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 12.10.26 --intent students/xenia_klykova/site/data/publication-intents/2026-10-12.json
      - name: Validate student package
        run: |
          node scripts/student.mjs validate xenia_klykova
          node --test students/xenia_klykova/site/tests/lesson-12.10.26.test.mjs
          node --check students/xenia_klykova/site/dashboard.js
          node --check students/xenia_klykova/site/lesson-registry.js
      - name: Commit publication projection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/xenia_klykova/site/data/lessons/2026-10-12.lesson.json students/xenia_klykova/site/data/ktp-state.json students/xenia_klykova/site/data/mastery-state.json students/xenia_klykova/site/lesson-registry.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(xenia): publish lesson through canonical v2 pipeline"
            git push
          fi
