name: Patch Sofia 19.08 heatmap

on:
  push:
    branches:
      - sofya-19-08-26-geometry
    paths:
      - .github/workflows/patch-sofya-19-08.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sofya-19-08-26-geometry
          fetch-depth: 0

      - name: Update Sofia index and heatmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('students/sofya_kalney/site/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'sofya-heatmap-tex-2026-08-19-v1'

          # Keep the dashboard counter aligned with the new lesson card.
          text = text.replace('<article class="stat"><b>8</b><span>интерактивных модулей</span></article>',
                              '<article class="stat"><b>9</b><span>интерактивных модулей</span></article>')

          # Add the new lesson after Module 08, without rewriting unrelated modules.
          module08 = '''        <article class="lesson-card" style="border-top:5px solid var(--gold)">
          <div class="lesson-number"><span>Модуль 08</span><span>07.08.26</span></div><h3>Графики функций с модулем</h3>
          <p>Кусочная запись, сдвиги графика, сохранение ОДЗ после сокращения, выколотые точки и параметр y = kx.</p>
          <div class="skills"><span class="chip">модуль и ветви</span><span class="chip">ОДЗ</span><span class="chip">параметр k</span><span class="chip">интерактивный график</span></div>
          <div class="lesson-actions"><a class="btn primary lesson-link" data-lesson="modulus-graphs" href="07.08.26.html">Открыть модуль</a><a class="btn" href="../pdf_docs/07.08.26.pdf" download>PDF</a><a class="btn" href="../tex_docs/07.08.26.tex" download>TeX</a></div>
        </article>'''
          module09 = '''
        <article class="lesson-card" style="border-top:5px solid var(--teal)">
          <div class="lesson-number"><span>Модуль 09</span><span>19.08.26</span></div><h3>Прямоугольный треугольник</h3>
          <p>Медиана к гипотенузе, высота, описанная окружность, теорема Пифагора, тригонометрия и площадь.</p>
          <div class="skills"><span class="chip">медиана</span><span class="chip">Пифагор</span><span class="chip">тригонометрия</span><span class="chip">площадь</span></div>
          <div class="lesson-actions"><a class="btn primary lesson-link" data-lesson="right-triangle" href="19.08.26.html">Открыть модуль</a><a class="btn" href="../tex_docs/19.08.26.tex" download>TeX</a></div>
        </article>'''
          if 'href="19.08.26.html"' not in text and module08 in text:
              text = text.replace(module08, module08 + module09, 1)

          # Add the source to the materials library.
          resource07 = '''          <div class="resource-row"><div><b>07.08.26</b><small>Графики функций с модулем</small></div><div class="resource-links"><a href="07.08.26.html">Web</a><a href="../pdf_docs/07.08.26.pdf" download>PDF</a><a href="../tex_docs/07.08.26.tex" download>TeX</a></div></div>'''
          resource19 = '''
          <div class="resource-row"><div><b>19.08.26</b><small>Прямоугольный треугольник: медиана, высота, площадь и тригонометрия</small></div><div class="resource-links"><a href="19.08.26.html">Web</a><a href="../tex_docs/19.08.26.tex" download>TeX</a></div></div>'''
          if '<b>19.08.26</b>' not in text and resource07 in text:
              text = text.replace(resource07, resource07 + resource19, 1)

          revision = r'''
<script>
(()=>{
const heatmapRevision='sofya-heatmap-tex-2026-08-19-v1';
const heatmapUpdates=[
 ['oge_15_4_1',3],['oge_15_4_2',3],['oge_15_4_3',3],['oge_15_4_4',3],
 ['oge_16_1_1',2],['oge_16_4_1',3],['oge_16_4_3',2],
 ['oge_19_2_1',2],['oge_19_4_1',2],
 ['oge_23_2_1',3],['oge_23_2_2',3],['oge_23_2_3',3],['oge_23_2_4',3],
 ['oge_24_2_2',2],['oge_24_2_4',2],
 ['oge_25_1_1',2],['oge_25_1_2',2],['oge_25_1_5',2]
];
const heatmapEvidence={};
const evidence=(ids,text,link)=>ids.forEach(id=>heatmapEvidence[id]={text,link});
evidence(['oge_15_4_1','oge_15_4_2','oge_15_4_3','oge_15_4_4'],
 'Подтверждено занятием 19.08.26: прямоугольный треугольник, медиана к гипотенузе, теорема Пифагора, тригонометрические отношения, площадь и высота к гипотенузе.','19.08.26.html');
evidence(['oge_16_1_1','oge_16_4_1','oge_16_4_3'],
 'Подтверждено занятием 19.08.26: середина гипотенузы как центр описанной окружности, R = AB/2 и прямой вписанный угол, опирающийся на диаметр.','19.08.26.html');
evidence(['oge_19_2_1','oge_19_4_1'],
 'Закреплено 19.08.26: точные условия свойства медианы к гипотенузе, обратное утверждение и теорема о прямом угле, опирающемся на диаметр.','19.08.26.html');
evidence(['oge_23_2_1','oge_23_2_2','oge_23_2_3','oge_23_2_4'],
 'Подтверждено занятием 19.08.26: анализ конфигурации, выбор теоремы, цепочка вычислений и обязательная проверка геометрического смысла корней.','19.08.26.html');
evidence(['oge_24_2_2','oge_24_2_4'],
 'Частично отработано 19.08.26: обоснование прямоугольности через центр описанной окружности и доказательная цепочка в конфигурации с внешними квадратами.','19.08.26.html');
evidence(['oge_25_1_1','oge_25_1_2','oge_25_1_5'],
 'Отработано на задачах 19.08.26: медиана и высота в одной конфигурации, внешние квадраты на катетах и связь площади с метрическими соотношениями.','19.08.26.html');
try{
 const key='sofya-competence-map-v1';
 if(localStorage.getItem(heatmapRevision)!=='1'){
  const saved=JSON.parse(localStorage.getItem(key)||'{}');
  heatmapUpdates.forEach(([id,level])=>saved[id]=Math.max(Number(saved[id]??0),level));
  localStorage.setItem(key,JSON.stringify(saved));
  localStorage.setItem(heatmapRevision,'1');
  location.reload(); return;
 }
}catch(_){}
document.addEventListener('click',event=>{
 const id=event.target.closest?.('[data-id]')?.dataset.id, info=heatmapEvidence[id];
 if(!info)return;
 setTimeout(()=>{
  const dialog=document.getElementById('competencyDialog'); if(!dialog?.open)return;
  const e=document.getElementById('dialogEvidence'), l=document.getElementById('dialogLink');
  if(e)e.textContent=info.text; if(l)l.href=info.link;
 },0);
});
})();
</script>
'''
          if marker not in text:
              text = text.replace('\n</body>', revision + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched index and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-sofya-19-08.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/sofya_kalney/site/index.html .github/workflows/patch-sofya-19-08.yml
          git commit -m "feat(sofya): update 19.08 geometry heatmap and lesson index"
          git push origin HEAD:sofya-19-08-26-geometry
