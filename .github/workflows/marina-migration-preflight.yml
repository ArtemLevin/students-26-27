name: Marina migration branch apply

on:
  push:
    branches:
      - 'feat/student-platform-v2-p5-3-10-marina'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-p5-3-10-marina
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewed manifest
        run: node scripts/student.mjs validate-manifest --manifest pipeline/migration/manifests/marina.json --json
      - name: Inspect legacy state
        run: node scripts/student.mjs inspect-legacy-state marina --json
      - name: Validated dry-run
        shell: bash
        run: |
          node scripts/student.mjs migrate marina --manifest pipeline/migration/manifests/marina.json --date 2026-10-02 --dry-run --json > /tmp/marina-dry-run.json
          node -e "const p=require('/tmp/marina-dry-run.json'),c=p.coverage; if(!p.executable||!c?.complete)process.exit(1); if(c.lessons?.source!==8||c.lessons?.candidate!==8)process.exit(2); if(c.competencies?.source!==300||c.competencies?.candidate!==300)process.exit(3); if(c.mastery?.resolvedSource!==0||c.mastery?.candidate!==0||c.mastery?.conflicts!==0||c.mastery?.orphans!==0)process.exit(4); if((p.reviewItems||[]).length||(p.blockers||[]).length||(p.warnings||[]).length)process.exit(5); console.log(JSON.stringify({coverage:c,projectedBaseline:p.projectedBaseline},null,2));"
      - name: Transactional apply
        run: node scripts/student.mjs migrate marina --manifest pipeline/migration/manifests/marina.json --date 2026-10-02 --apply --json
      - name: Validate migrated package
        run: node scripts/student.mjs validate marina --json
      - name: Verify empty canonical mastery
        run: node -e "const s=require('./students/marina/site/data/mastery-state.json'); if(Object.keys(s.levels).length)process.exit(1);"
      - name: Run migration regression suite
        run: node --test pipeline/migration/test/*.test.mjs
      - name: Enforce architecture ratchet
        run: node pipeline/migration/audit-ratchet.mjs
      - name: Commit generated migration state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/migration/baseline.json pipeline/migration/reports/marina.json students/marina/student-contract.json students/marina/site/data students/marina/site/lesson-registry.js students/marina/site/tests/student-platform-v2.test.mjs
          git diff --cached --quiet && exit 1 || true
          git commit -m "P5.3-10: apply Marina Student Platform v2 migration"
          git push origin HEAD:feat/student-platform-v2-p5-3-10-marina
