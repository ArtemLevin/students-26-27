name: Jaroslav 15 October native MathML QA
on:
  push:
    branches:
      - feat/jaroslav-151026-native-mathml
    paths:
      - students/jaroslav_gavrilov/site/15.10.26.html
      - students/jaroslav_gavrilov/site/15.10.26-lab.html
      - students/jaroslav_gavrilov/site/15.10.26-graphs.js
      - students/jaroslav_gavrilov/site/15.10.26-mathml.js
      - students/jaroslav_gavrilov/site/tests/15.10.26.browser.mjs
      - .github/workflows/jaroslav-151026-mathml-qa.yml
permissions:
  contents: read
jobs:
  mathml-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check students/jaroslav_gavrilov/site/15.10.26-mathml.js
          node --check students/jaroslav_gavrilov/site/15.10.26-graphs.js
          node --check students/jaroslav_gavrilov/site/tests/15.10.26.browser.mjs
      - name: MathML semantics and responsive browser QA
        run: node students/jaroslav_gavrilov/site/tests/15.10.26.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaroslav-151026-mathml-screenshots
          path: jaroslav-1510-browser-artifacts/*.png
          if-no-files-found: warn
