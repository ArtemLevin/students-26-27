name: One-time Sofia 16 November canonical lesson publication
on:
  push:
    branches:
      - lesson/sofya-luzianina-2026-11-16-kinematics
    paths:
      - '.github/workflows/sofya-20261116-publish-once.yml'
permissions:
  contents: write
concurrency:
  group: sofya-20261116-canonical-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review dry-run and publish using canonical Student Platform v2 pipeline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs sofya_luzianina 16.11.26 \
            --intent students/sofya_luzianina/16.11.26.intent.json --dry-run > /tmp/sofya-dry-run.json
          node -e 'const p=require("/tmp/sofya-dry-run.json"); if(p.architecture!=="v2"||!p.executable||p.reviewItems.length||p.conflicts.length) throw new Error("Canonical publish plan not clean: "+JSON.stringify(p));'
          node scripts/publish-lesson.mjs sofya_luzianina 16.11.26 \
            --intent students/sofya_luzianina/16.11.26.intent.json > /tmp/sofya-published.json
          node scripts/student.mjs validate sofya_luzianina
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
      - name: Commit canonical publisher outputs and retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sofya-20261116-publish-once.yml
          git add -A students/sofya_luzianina
          git diff --cached --check
          git diff --cached --stat
          git -c user.name="Student Platform Publisher" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish Sofya kinematics lesson through Student Platform v2"
          git push origin HEAD:refs/heads/lesson/sofya-luzianina-2026-11-16-kinematics
