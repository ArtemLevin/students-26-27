name: Build Anna materials 06.10.26

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anna-materials-061026.yml"
      - "students/anna_trapeznikova/tex_docs/06.10.26.tex"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-cyrillic texlive-pictures librsvg2-bin fonts-dejavu-core

      - name: Compile checklist PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p students/anna_trapeznikova/pdf_docs
          cp students/anna_trapeznikova/tex_docs/06.10.26.tex /tmp/anna-061026.tex
          # PTSans is not guaranteed on the lightweight runner; Helvetica preserves
          # the intended clean sans-serif layout for the compiled repository copy.
          sed -i 's/\\usepackage{PTSans}/\\usepackage{helvet}/' /tmp/anna-061026.tex
          cd /tmp
          pdflatex -interaction=nonstopmode -halt-on-error anna-061026.tex
          pdflatex -interaction=nonstopmode -halt-on-error anna-061026.tex
          cp anna-061026.pdf "$GITHUB_WORKSPACE/students/anna_trapeznikova/pdf_docs/06.10.26.pdf"

      - name: Render lesson poster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p students/anna_trapeznikova/images
          cat > /tmp/anna-061026-poster.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1491" height="1055" viewBox="0 0 1491 1055">
            <defs>
              <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="noise"/>
                <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
              </filter>
              <style>
                .bg{fill:#fbf7ee}
                .blue{fill:#eaf4f7;stroke:#2f6f8f;stroke-width:4}
                .coral{fill:#fff0e9;stroke:#df715d;stroke-width:4}
                .title{font:700 64px "DejaVu Sans",sans-serif;fill:#123d68}
                .h{font:700 31px "DejaVu Sans",sans-serif;fill:#123d68}
                .sh{font:700 24px "DejaVu Sans",sans-serif;fill:#1e506f}
                .t{font:22px "DejaVu Sans",sans-serif;fill:#183148}
                .s{font:20px "DejaVu Sans",sans-serif;fill:#183148}
                .math{font:23px "DejaVu Sans",sans-serif;fill:#183148}
                .numB{fill:#174f79}.numC{fill:#e35e49}
                .num{font:700 28px "DejaVu Sans",sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
                .accentC{fill:#f6ad98}.accentB{fill:#bfe0ee}
                .line{stroke:#174f79;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
                .coralline{stroke:#e35e49;stroke-width:4;fill:none;stroke-linecap:round}
              </style>
            </defs>

            <rect class="bg" width="1491" height="1055"/>
            <path d="M340 42 C590 8 1030 14 1164 43 C1110 105 446 108 340 42Z" fill="#f8b9a5" opacity=".67"/>
            <text x="745" y="91" text-anchor="middle" class="title">Неравенства с модулем</text>

            <rect x="24" y="142" width="430" height="442" rx="32" class="blue"/>
            <circle cx="58" cy="145" r="32" class="numB"/><text x="58" y="147" class="num">1</text>
            <path d="M92 167 C190 142 360 145 417 167 L402 211 L88 210Z" class="accentC" opacity=".72"/>
            <text x="113" y="201" class="h">Главная идея</text>
            <text x="49" y="253" class="t">
              <tspan x="49" dy="0">Неравенства с модулем часто</tspan>
              <tspan x="49" dy="31">сводят к более удобной форме:</tspan>
              <tspan x="49" dy="31">раскрытию по случаям,</tspan>
              <tspan x="49" dy="31">замене или равносильным переходам.</tspan>
            </text>
            <rect x="48" y="378" width="354" height="48" rx="24" class="accentB" opacity=".72"/>
            <text x="67" y="409" class="sh">Сначала выбираем удобный метод.</text>
            <text x="49" y="463" class="sh">Основные подходы:</text>
            <text x="64" y="500" class="s">
              <tspan x="64" dy="0">• раскрыть модуль по случаям;</tspan>
              <tspan x="64" dy="31">• сделать замену t = |x|;</tspan>
              <tspan x="64" dy="31">• использовать равносильные переходы.</tspan>
            </text>

            <rect x="468" y="142" width="492" height="442" rx="32" class="coral"/>
            <circle cx="502" cy="145" r="32" class="numC"/><text x="502" y="147" class="num">2</text>
            <path d="M541 168 C650 144 862 145 914 170 L899 214 L535 211Z" class="accentC" opacity=".72"/>
            <text x="579" y="202" class="h">Замена t = |x|</text>
            <text x="494" y="255" class="t">
              <tspan x="494" dy="0">Так как x² = |x|², выражение с x² и |x|</tspan>
              <tspan x="494" dy="31">часто становится квадратным относительно t.</tspan>
            </text>
            <text x="494" y="330" class="sh">Алгоритм:</text>
            <text x="512" y="368" class="s">
              <tspan x="512" dy="0">1. заменить |x| на t;</tspan>
              <tspan x="512" dy="31">2. решить квадратное неравенство;</tspan>
              <tspan x="512" dy="31">3. учесть t ≥ 0;</tspan>
              <tspan x="512" dy="31">4. вернуться к |x|, затем к x.</tspan>
            </text>
            <rect x="760" y="343" width="167" height="82" rx="20" class="accentB" opacity=".75"/>
            <text x="843" y="371" text-anchor="middle" class="s">
              <tspan x="843" dy="0">Ограничение</tspan><tspan x="843" dy="27">t ≥ 0</tspan>
            </text>
            <text x="494" y="521" class="math">x² − |x| − 6 ≥ 0  →  t² − t − 6 ≥ 0,  t ≥ 0</text>

            <rect x="975" y="142" width="492" height="442" rx="32" class="blue"/>
            <circle cx="1010" cy="145" r="32" class="numB"/><text x="1010" y="147" class="num">3</text>
            <path d="M1040 168 C1155 142 1367 145 1428 171 L1414 214 L1038 210Z" class="accentC" opacity=".72"/>
            <text x="1071" y="201" class="h">Несколько модулей</text>
            <text x="1003" y="249" class="s">
              <tspan x="1003" dy="0">1. Найти нули подмодульных выражений.</tspan>
              <tspan x="1003" dy="31">2. Разбить ось на интервалы.</tspan>
              <tspan x="1003" dy="31">3. На каждом интервале раскрыть модули.</tspan>
              <tspan x="1003" dy="31">4. Решить систему для каждого случая.</tspan>
              <tspan x="1003" dy="31">5. Объединить подходящие ответы.</tspan>
            </text>
            <text x="1003" y="432" class="math">Пример:  |x − 2| + |x + 1| ≥ 3</text>
            <line x1="1030" y1="501" x2="1415" y2="501" class="line"/>
            <circle cx="1132" cy="501" r="7" class="numC"/><circle cx="1308" cy="501" r="7" class="numC"/>
            <text x="1120" y="535" class="s">−1</text><text x="1299" y="535" class="s">2</text>
            <text x="1016" y="570" class="s">пересечение внутри случая → объединение всех случаев</text>

            <rect x="24" y="607" width="877" height="399" rx="32" class="blue"/>
            <circle cx="58" cy="610" r="32" class="numB"/><text x="58" y="612" class="num">4</text>
            <path d="M101 628 C338 604 685 604 852 631 L841 674 L97 672Z" class="accentC" opacity=".72"/>
            <text x="147" y="662" class="h">Вложенные модули и сравнение модулей</text>
            <text x="55" y="719" class="sh">А. Вложенные модули</text>
            <text x="58" y="760" class="s">
              <tspan x="58" dy="0">• сначала убираем внешний модуль;</tspan>
              <tspan x="58" dy="31">• затем работаем с внутренним.</tspan>
            </text>
            <text x="58" y="849" class="math">||x| − 3| ≥ 5 → |x| − 3 ≥ 5 или |x| − 3 ≤ −5</text>
            <line x1="446" y1="702" x2="446" y2="967" class="line" opacity=".35"/>
            <text x="477" y="719" class="sh">Б. Сравнение двух модулей</text>
            <text x="477" y="760" class="s">
              <tspan x="477" dy="0">Если обе части неотрицательны,</tspan>
              <tspan x="477" dy="31">можно возвести их в квадрат.</tspan>
            </text>
            <rect x="477" y="829" width="368" height="48" rx="18" class="accentB" opacity=".72"/>
            <text x="499" y="861" class="math">|f(x)| ? |g(x)| → f(x)² ? g(x)²</text>
            <text x="477" y="916" class="s">
              <tspan x="477" dy="0">Важно: сначала обосновать</tspan>
              <tspan x="477" dy="29">неотрицательность частей.</tspan>
            </text>

            <rect x="919" y="607" width="548" height="399" rx="32" class="coral"/>
            <circle cx="953" cy="610" r="32" class="numC"/><text x="953" y="612" class="num">5</text>
            <path d="M992 628 C1125 604 1360 608 1422 633 L1406 675 L990 672Z" class="accentC" opacity=".72"/>
            <text x="1040" y="662" class="h">Частые ошибки</text>
            <text x="957" y="716" class="s">
              <tspan x="957" dy="0">! забыли условие t ≥ 0;</tspan>
              <tspan x="957" dy="30">! перепутали систему и совокупность;</tspan>
              <tspan x="957" dy="30">! не проверили включение границы;</tspan>
              <tspan x="957" dy="30">! потеряли точку при объединении;</tspan>
              <tspan x="957" dy="30">! возвели в квадрат без обоснования;</tspan>
              <tspan x="957" dy="30">! не сделали обратную замену.</tspan>
            </text>
            <rect x="955" y="899" width="472" height="76" rx="20" class="accentB" opacity=".7"/>
            <text x="980" y="925" class="s">
              <tspan x="980" dy="0">Мини-памятка: |f| ≤ a — обычно система;</tspan>
              <tspan x="980" dy="28">|f| ≥ a — обычно совокупность. Границы проверяйте.</tspan>
            </text>

            <path d="M390 1023 C580 1006 902 1007 1101 1023" class="line" opacity=".45"/>
            <text x="745" y="1032" text-anchor="middle" class="s">Артём Александрович Лёвин эксклюзивно для Анны Трапезниковой</text>
          </svg>
          SVG
          rsvg-convert -w 1491 -h 1055 /tmp/anna-061026-poster.svg -o students/anna_trapeznikova/images/06.10.26.png

      - name: Commit generated PDF and PNG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add students/anna_trapeznikova/pdf_docs/06.10.26.pdf \
                  students/anna_trapeznikova/images/06.10.26.png
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Анна Трапезникова: PDF и постер 06.10.26"
          git push origin HEAD:main
