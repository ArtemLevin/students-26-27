name: One-shot Sofia 20 November canonical publication
# Rerun after extending historical lessonRefs regression for additional lessons.
on:
  push:
    branches:
      - feat/sofya-2026-11-20-dual-physics-labs
    paths:
      - '.github/workflows/sofya-20261120-publish-once.yml'
permissions:
  contents: write
jobs:
  publish-sofia-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sofya-2026-11-20-dual-physics-labs
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical publication dry-run
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs sofya_luzianina 20.11.26 --intent students/sofya_luzianina/20.11.26.intent.json --dry-run
      - name: Apply publication transaction
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs sofya_luzianina 20.11.26 --intent students/sofya_luzianina/20.11.26.intent.json
      - name: Student and lesson validation
        run: |
          set -euo pipefail
          node scripts/student.mjs validate sofya_luzianina
          node scripts/student.mjs audit
          node --test students/sofya_luzianina/site/tests/*.test.mjs
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test shared/practice/test/*.test.mjs
          node --test pipeline/practice/test/*.test.mjs
      - name: Inspect expected generated change scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --name-only
          if git status --short | grep -vE 'students/sofya_luzianina/site/(data/lessons/2026-11-20\.lesson\.json|data/ktp-state\.json|data/mastery-state\.json|lesson-registry\.js)' | grep -q .; then
            echo 'Unexpected changed files after publisher'; exit 1
          fi
      - name: Commit publisher-owned files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- students/sofya_luzianina/site/data/lessons/2026-11-20.lesson.json students/sofya_luzianina/site/data/ktp-state.json students/sofya_luzianina/site/data/mastery-state.json students/sofya_luzianina/site/lesson-registry.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(sofya): publish 20.11.26 via canonical v2 pipeline"
            git push origin HEAD:feat/sofya-2026-11-20-dual-physics-labs
          else
            echo 'Publisher already up to date'
          fi
