name: Timofey 27 November isolated browser QA
on:
  push:
    branches:
      - lesson/timofey-2026-11-27-geometry
    paths:
      - '.github/workflows/timofey-271126-publication-temp.yml'
      - 'students/timofey/site/27.11.26.html'
      - 'students/timofey/site/27.11.26-lab.html'
      - 'students/timofey/site/tests/lesson-20261127.browser.mjs'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/timofey-playwright --no-audit --no-fund playwright@1.56.1
          /tmp/timofey-playwright/node_modules/.bin/playwright install chromium
      - name: Run browser release gate
        env:
          PLAYWRIGHT_MODULE: /tmp/timofey-playwright/node_modules/playwright/index.mjs
          QA_OUT: /tmp/timofey-271126-qa
        run: node students/timofey/site/tests/lesson-20261127.browser.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timofey-271126-browser-screenshots
          path: /tmp/timofey-271126-qa/*.png
          if-no-files-found: warn
