name: Publish Timofey lesson 2026-10-20
on:
  push:
    branches:
      - codex/timofey-finances-20261020
    paths:
      - .github/workflows/timofey-publish-2026-10-20.yml
permissions:
  contents: write
jobs:
  transactional-lesson-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publication dry-run
        run: |
          node scripts/publish-lesson.mjs timofey 20.10.26 --intent students/timofey/site/data/publication-intents/2026-10-20.json --dry-run | tee /tmp/timofey-publish-dryrun.json
          node -e 'const p=require("/tmp/timofey-publish-dryrun.json"); if(!p.executable || p.reviewItems.length || p.conflicts.length) {console.error(p); process.exit(1)}'
      - name: Publish lesson transactionally
        run: node scripts/publish-lesson.mjs timofey 20.10.26 --intent students/timofey/site/data/publication-intents/2026-10-20.json
      - name: Student Platform validation
        run: |
          node scripts/student.mjs validate timofey
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test shared/practice/test/*.test.mjs
          node --test pipeline/practice/test/*.test.mjs
          git diff --check
      - name: Push canonical publication projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/timofey/site/lesson-registry.js students/timofey/site/data/lessons/2026-10-20.lesson.json students/timofey/site/data/ktp-state.json students/timofey/site/data/mastery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(timofey): register Oct 20 lesson through v2 publisher"
            git push origin HEAD:codex/timofey-finances-20261020
          fi
