name: Xenia 2026-11-04 lesson publication (temporary)
on:
  push:
    branches:
      - lesson/xenia-parabola-2026-11-04
    paths:
      - students/xenia_klykova/site/data/publication-intents/2026-11-04.json
permissions:
  contents: write
jobs:
  publish:
    name: Publish v2 lesson via canonical script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry run publication plan
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 04.11.26 \
            --intent students/xenia_klykova/site/data/publication-intents/2026-11-04.json \
            --dry-run > /tmp/xenia-publication-plan.json
          cat /tmp/xenia-publication-plan.json
          node -e "const p=require('/tmp/xenia-publication-plan.json');if(!p.executable||p.conflicts.length||p.reviewItems.length)process.exit(1)"
      - name: Publish lesson
        run: |
          node scripts/publish-lesson.mjs xenia_klykova 04.11.26 \
            --intent students/xenia_klykova/site/data/publication-intents/2026-11-04.json
      - name: Validate published student
        run: |
          node scripts/student.mjs validate xenia_klykova
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test shared/practice/test/*.test.mjs
          node --test pipeline/practice/test/*.test.mjs
      - name: Commit publisher output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            students/xenia_klykova/site/data/lessons/2026-11-04.lesson.json \
            students/xenia_klykova/site/data/ktp-state.json \
            students/xenia_klykova/site/data/mastery-state.json \
            students/xenia_klykova/site/lesson-registry.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish Xenia 04.11.26 lesson through Student Platform v2"
            git push origin HEAD:lesson/xenia-parabola-2026-11-04
          fi
