name: Volodia publication application (retry after regression fix)
on:
  push:
    branches:
      - lesson/volodia-2026-10-28-hooke
    paths:
      - .github/workflows/volodia-publication-preflight.yml
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lesson/volodia-2026-10-28-hooke
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Official publication dry-run
        run: |
          node scripts/publish-lesson.mjs volodia_khachaturian 28.10.26 --intent students/volodia_khachaturian/site/data/publication-intents/2026-10-28.json --dry-run
      - name: Apply verified publication plan
        run: |
          node scripts/publish-lesson.mjs volodia_khachaturian 28.10.26 --intent students/volodia_khachaturian/site/data/publication-intents/2026-10-28.json
      - name: Validate student contract and dashboard
        run: |
          node scripts/student.mjs validate volodia_khachaturian
          node students/volodia_khachaturian/site/tests/dashboard-regression.mjs
      - name: Commit generated canonical publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/volodia_khachaturian/site/lesson-registry.js
          git add students/volodia_khachaturian/site/data/lessons/2026-10-28.lesson.json
          git add students/volodia_khachaturian/site/data/ktp-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Volodia elasticity lesson via production publisher"
            git push origin HEAD:lesson/volodia-2026-10-28-hooke
          fi
