name: Review Grigory 07.10.26 interactive

on:
  push:
    branches:
      - review/grisha-071026-interactive
    paths:
      - .automation/review-grisha-interactive-ready

permissions:
  contents: write

jobs:
  interactive-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/grisha-071026-interactive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Student package and lesson regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/student.mjs validate grisha_arkhipov
          node students/grisha_arkhipov/site/tests/student-platform-v2.test.mjs

      - name: Interactive source integrity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const file='students/grisha_arkhipov/site/07.10.26.html';
          const html=fs.readFileSync(file,'utf8');
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]);
          if(new Set(ids).size!==ids.length)throw new Error('Duplicate ids');
          for(const id of ['labSvg','labK','labB','labX','labHandleA','labHandleB','labPanelFree','labPanelGuide','labPanelCompare','labPanelPredict','labPanelChallenge']){
            if(!ids.includes(id))throw new Error('Missing interactive id '+id);
          }
          for(const token of ['const state={k:1.5,b:1,probeX:2','function segment(k,b)','function renderLab()','requestAnimationFrame(tick)','data-lab-scenario="trap"']){
            if(!html.includes(token))throw new Error('Missing interactive contract: '+token);
          }
          const source=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!source)throw new Error('Inline script missing');
          fs.writeFileSync('/tmp/grisha-interactive.js',source);
          const syntax=spawnSync(process.execPath,['--check','/tmp/grisha-interactive.js'],{encoding:'utf8'});
          if(syntax.status!==0)throw new Error(syntax.stderr||syntax.stdout);
          console.log('interactive source integrity: PASS');
          NODE

      - name: ChromeDriver browser audit
        shell: bash
        run: |
          set -euo pipefail
          driver="$(command -v chromedriver || true)"
          if [ -z "$driver" ]; then
            echo "ChromeDriver is unavailable"
            exit 1
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/grisha-interactive-http.log 2>&1 &
          server_pid=$!
          "$driver" --port=9515 --allowed-ips= >/tmp/grisha-interactive-driver.log 2>&1 &
          driver_pid=$!
          cleanup(){ kill "$driver_pid" "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in {1..50}; do
            server_ok=0
            driver_ok=0
            curl -fsS http://127.0.0.1:8000/students/grisha_arkhipov/site/07.10.26.html >/dev/null && server_ok=1 || true
            curl -fsS http://127.0.0.1:9515/status >/dev/null && driver_ok=1 || true
            if [ "$server_ok" -eq 1 ] && [ "$driver_ok" -eq 1 ]; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8000/students/grisha_arkhipov/site/07.10.26.html >/dev/null
          curl -fsS http://127.0.0.1:9515/status >/dev/null
          node .automation/review-grisha-interactive-browser.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: grisha-071026-interactive-screenshots
          path: /tmp/grisha-interactive/*.png
          if-no-files-found: error

      - name: Cleanup review harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/review-grisha-interactive-ready .automation/review-grisha-interactive-browser.mjs
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/review-grisha-interactive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary interactive review harness"
          git push origin HEAD:review/grisha-071026-interactive
