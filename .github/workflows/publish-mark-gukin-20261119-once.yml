name: One-time publication - Mark Gukin 19 Nov 2026
on:
  push:
    branches:
      - lesson/mark-gukin-20261119-probability
    paths:
      - .github/workflows/publish-mark-gukin-20261119-once.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review transaction dry-run
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs mark_gukin 19.11.26 --intent students/mark_gukin/publication/2026-11-19.intent.json --dry-run > /tmp/mark-publication-plan.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("/tmp/mark-publication-plan.json","utf8")); console.log(JSON.stringify({executable:p.executable,reviewItems:p.reviewItems,conflicts:p.conflicts,warnings:p.warnings,changedFiles:p.changedFiles},null,2)); if(p.executable!==true||p.reviewItems?.length||p.conflicts?.length)process.exit(1);'
      - name: Publish with repository-native transaction
        run: node scripts/publish-lesson.mjs mark_gukin 19.11.26 --intent students/mark_gukin/publication/2026-11-19.intent.json
      - name: Check student and shared contracts
        run: |
          set -euo pipefail
          node scripts/student.mjs validate mark_gukin
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test shared/practice/test/*.test.mjs
          node --test pipeline/practice/test/*.test.mjs
      - name: Commit generated canonical publication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add students/mark_gukin/site/data/lessons/2026-11-19.lesson.json students/mark_gukin/site/data/ktp-state.json students/mark_gukin/site/lesson-registry.js
          if ! git diff --cached --quiet; then
            git commit -m 'chore(mark_gukin): publish 19 Nov probability lesson through v2 transaction'
            git push origin HEAD:refs/heads/lesson/mark-gukin-20261119-probability
          fi
