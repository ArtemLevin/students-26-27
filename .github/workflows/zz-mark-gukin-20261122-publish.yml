name: One-time Mark Gukin 22 Nov publication
on:
  push:
    branches:
      - lesson/mark-gukin-2026-11-22-probability-web
    paths:
      - '.github/workflows/zz-mark-gukin-20261122-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    name: Transactional lesson publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight and dry-run
        shell: bash
        run: |
          set -euo pipefail
          INTENT=students/mark_gukin/site/data/publication-intents/2026-11-22.json
          node scripts/publish-lesson.mjs mark_gukin 22.11.26 --intent "$INTENT" --dry-run > /tmp/mark-publication-plan.json
          cat /tmp/mark-publication-plan.json
          node -e "const p=require('/tmp/mark-publication-plan.json'); if(!p.executable || p.conflicts.length || p.reviewItems.length) process.exit(1)"
      - name: Apply canonical publication
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-lesson.mjs mark_gukin 22.11.26 --intent students/mark_gukin/site/data/publication-intents/2026-11-22.json
      - name: Validate published student package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/student.mjs validate mark_gukin
          node scripts/student.mjs audit
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test students/mark_gukin/site/tests/*.test.mjs
      - name: Commit generated canonical projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/mark_gukin/site/data/lessons/2026-11-22.lesson.json
          git add students/mark_gukin/site/lesson-registry.js
          git add students/mark_gukin/site/data/ktp-state.json
          git add students/mark_gukin/site/data/mastery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(mark): apply 22 Nov v2 publication transaction"
            git push origin HEAD:lesson/mark-gukin-2026-11-22-probability-web
          fi
