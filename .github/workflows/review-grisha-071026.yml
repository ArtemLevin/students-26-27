name: Review Grigory 07.10.26 site

on:
  push:
    branches:
      - review/grisha-071026-site
    paths:
      - .automation/review-grisha-ready

permissions:
  contents: write

jobs:
  release-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/grisha-071026-site
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Source and link integrity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const file='students/grisha_arkhipov/site/07.10.26.html';
          const html=fs.readFileSync(file,'utf8');
          for(const bad of [/TODO/i,/lorem ipsum/i,/<mfenced\b/i,/href\s*=\s*["']\s*["']/i,/javascript:/i]){
            if(bad.test(html)) throw new Error('Source gate failed: '+bad);
          }
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]);
          if(new Set(ids).size!==ids.length) throw new Error('Duplicate HTML ids');
          for(const anchor of ['method','linear','intersection','parabola','hyperbola']){
            if(!ids.includes(anchor)) throw new Error('Missing evidence anchor #'+anchor);
          }
          const refs=[...html.matchAll(/(?:href|src)=["']([^"']+)["']/g)].map(x=>x[1]);
          for(const ref of refs){
            if(ref.startsWith('data:')||ref.startsWith('#')) continue;
            if(/^https?:/i.test(ref)) throw new Error('Unexpected remote resource: '+ref);
            const clean=ref.split(/[?#]/,1)[0];
            if(!clean) continue;
            const target=path.resolve(path.dirname(file),clean);
            if(!fs.existsSync(target)) throw new Error('Missing local reference: '+ref);
          }
          const source=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!source) throw new Error('Inline lesson script not found');
          fs.writeFileSync('/tmp/grisha-071026-inline.js',source);
          const syntax=spawnSync(process.execPath,['--check','/tmp/grisha-071026-inline.js'],{encoding:'utf8'});
          if(syntax.status!==0) throw new Error(syntax.stderr||syntax.stdout);
          const index=fs.readFileSync('students/grisha_arkhipov/site/index.html','utf8');
          for(const required of ['07.10.26.html','../pdf_docs/07.10.26.pdf','../tex_docs/07.10.26.tex','ktp.html?lesson=ktp-002']){
            if(!index.includes(required)) throw new Error('Dashboard missing '+required);
          }
          const registry=fs.readFileSync('students/grisha_arkhipov/site/lesson-registry.js','utf8');
          if((registry.match(/"date": "2026-10-07"/g)||[]).length!==1) throw new Error('07.10 lesson registry duplication');
          console.log('source and link integrity: PASS');
          NODE

      - name: Student and practice regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/student.mjs validate grisha_arkhipov
          node students/grisha_arkhipov/site/tests/student-platform-v2.test.mjs
          node shared/practice/validate-configs.mjs
          node shared/practice/audit-lesson-coverage.mjs
          node --test shared/practice/test/*.test.mjs
          node --test pipeline/practice/test/*.test.mjs

      - name: Repository audit
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node scripts/student.mjs audit 2>&1 | tee /tmp/student-audit.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q "grisha_arkhipov: v2 package validation failed" /tmp/student-audit.log; then
              echo "Grigory package failed repository audit"
              exit "$status"
            fi
            echo "::warning::Repository-wide audit has an unrelated pre-existing package failure."
          fi

      - name: Chromium browser review
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-family browser available on runner"
            exit 1
          fi
          echo "Browser: $browser"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/grisha-http.log 2>&1 &
          server_pid=$!
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --remote-debugging-port=9222 --user-data-dir=/tmp/grisha-chrome about:blank             >/tmp/grisha-chrome.log 2>&1 &
          chrome_pid=$!
          cleanup(){ kill "$chrome_pid" "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null
          node .automation/review-grisha-browser.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: grisha-071026-browser-screenshots
          path: /tmp/grisha-browser/*.png
          if-no-files-found: error

      - name: Cleanup review harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/review-grisha-ready .automation/review-grisha-browser.mjs
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/review-grisha-071026.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary 07.10.26 review harness"
          git push origin HEAD:review/grisha-071026-site
