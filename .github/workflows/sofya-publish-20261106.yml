name: One-off Sofia area lesson publisher
on:
  push:
    branches:
      - feature/sofya-areas-2026-11-06
    paths:
      - '.github/workflows/sofya-publish-20261106.yml'
      - 'students/sofya_kalney/site/06.11.26.html'
      - 'students/sofya_kalney/site/06.11.26-lab.html'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publication plan / dry-run
        run: node scripts/publish-lesson.mjs sofya_kalney 06.11.26 --intent students/sofya_kalney/site/data/publication-intents/2026-11-06.json --dry-run
      - name: Publish through transactional Student Platform v2 tool
        run: node scripts/publish-lesson.mjs sofya_kalney 06.11.26 --intent students/sofya_kalney/site/data/publication-intents/2026-11-06.json
      - name: Validate Sofia package
        run: node scripts/student.mjs validate sofya_kalney
      - name: Commit generated canonical metadata and registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/sofya_kalney/site/data/lessons/2026-11-06.lesson.json students/sofya_kalney/site/lesson-registry.js students/sofya_kalney/site/data/ktp-state.json students/sofya_kalney/site/data/mastery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Sofia 6 November geometry lesson through v2 pipeline"
            git push
          fi
