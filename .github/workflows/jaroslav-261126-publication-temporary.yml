name: Jaroslav 26 November publication check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  publish-check:
    if: github.head_ref == 'lesson/jaroslav-2026-11-26'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical dry run and publication
        run: |
          set -euo pipefail
          INTENT=students/jaroslav_gavrilov/site/data/publication-intents/2026-11-26.json
          node scripts/publish-lesson.mjs jaroslav_gavrilov 26.11.26 --intent "$INTENT" --dry-run > /tmp/lesson-plan.json
          cat /tmp/lesson-plan.json
          node -e "const p=require('/tmp/lesson-plan.json'); if(!p.executable || p.reviewItems.length || p.conflicts.length || p.warnings.length) process.exit(1)"
          node scripts/publish-lesson.mjs jaroslav_gavrilov 26.11.26 --intent "$INTENT"
          node scripts/student.mjs validate jaroslav_gavrilov
          git add students/jaroslav_gavrilov/site
          git diff --cached --stat
          git diff --cached --no-color -- students/jaroslav_gavrilov/site
