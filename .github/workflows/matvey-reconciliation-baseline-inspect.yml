name: Matvey reconciliation verify

on:
  push:
    branches:
      - 'feat/student-platform-v2-reconcile-matvey-gorbachev'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-platform-v2-reconcile-matvey-gorbachev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check students/matvey_gorbachev/site/mastery-authority.js
          node --check pipeline/migration/legacy/inspect-learning-state.mjs

      - name: Run focused migration tests
        run: |
          node --test pipeline/migration/test/legacy-state.test.mjs
          node --test pipeline/migration/test/readiness-inventory.test.mjs

      - name: Verify reconciled Matvey source
        shell: bash
        run: |
          node scripts/student.mjs inspect-legacy-state matvey_gorbachev --json > /tmp/matvey.json
          node - <<'NODE'
          const r=require('/tmp/matvey.json');
          const counts={};
          for(const item of r.mastery.resolved)counts[item.level]=(counts[item.level]||0)+1;
          if(!r.automaticEligible)process.exit(1);
          if(r.catalog?.count!==342||r.mastery?.resolved?.length!==342)process.exit(2);
          if(counts[0]!==281||counts[2]!==61||Object.keys(counts).length!==2)process.exit(3);
          if(r.mastery?.conflicts?.length||r.diagnostics?.orphanClaims?.length||r.diagnostics?.warnings?.length)process.exit(4);
          if(!r.mastery.resolved.every(x=>x.sourceKind==='mastery-authority'&&x.sourcePath==='site/mastery-authority.js'))process.exit(5);
          console.log(JSON.stringify({catalog:r.catalog.count,mastery:r.mastery.resolved.length,levelCounts:counts,automaticEligible:r.automaticEligible},null,2));
          NODE

      - name: Verify readiness transition
        shell: bash
        run: |
          node pipeline/migration/readiness-inventory.mjs --json > /tmp/readiness.json
          node - <<'NODE'
          const r=require('/tmp/readiness.json');
          const x=r.students.find(s=>s.studentId==='matvey_gorbachev');
          if(!x)process.exit(1);
          if(x.status!=='ready'||x.competencies!==342||x.mastery!==342)process.exit(2);
          console.log(JSON.stringify(x,null,2));
          NODE
