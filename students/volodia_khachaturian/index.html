<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Переход в обновлённый учебный кабинет Володи Хачатуряна по физике.">
  <meta http-equiv="refresh" content="0; url=site/index.html">
  <link rel="canonical" href="site/index.html">
  <title>Володя Хачатурян · обновлённый кабинет</title>
  <style>
    :root{color-scheme:dark;--bg:#07111d;--surface:#0e1c2b;--text:#edf7fb;--muted:#aebfca;--line:#345269;--accent:#58d6cf;--focus:#ffd166}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#b8576726,transparent 30rem),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(640px,100%);padding:clamp(24px,5vw,44px);border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:0 22px 60px #0006}
    p{color:var(--muted)}
    a{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:11px 17px;border:1px solid var(--accent);border-radius:12px;background:#58d6cf1d;color:var(--text);font-weight:800;text-decoration:none}
    a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  </style>
  <script>
    (()=>{
      const anchors={'#competency-map':'#map','#focus':'#map','#materials':'#lesson','#top':'#content'};
      const target=`site/index.html${anchors[location.hash]||location.hash||''}`;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <main aria-labelledby="page-title">
    <h1 id="page-title">Кабинет Володи обновлён</h1>
    <p>Сейчас откроется единый кабинет с занятиями, картой компетенций, независимым списком повторения и доступной навигацией с клавиатуры.</p>
    <a href="site/index.html">Перейти в учебный кабинет →</a>
  </main>
</body>
</html>
