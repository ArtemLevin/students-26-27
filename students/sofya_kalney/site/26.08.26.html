<!doctype html>
<html lang="ru" data-theme="dark" data-detail="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Интерактивное повторение алгебры ОГЭ для Софии Кальней: исследовательская лаборатория, уравнения, системы, неравенства, текстовые задачи и ОДЗ.">
<title>Комплексное повторение алгебры ОГЭ — София Кальней</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300575b'/%3E%3Cpath d='M15 19h34M20 32h24M15 45h34' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="26.08.26-lab.css">
</head>
<body>
<noscript><div style="max-width:800px;margin:3rem auto;padding:1rem;font:16px system-ui">Для интерактивной версии требуется JavaScript. PDF и TeX доступны из кабинета ученика.</div></noscript>
<div id="pageMount" aria-busy="true"></div>
<script>
(async()=>{
  const mount=document.getElementById('pageMount');
  try{
    const files=['26.08.26-body-1.html','26.08.26-body-2.html','26.08.26-body-3.html','26.08.26-body-4.html'];
    const responses=await Promise.all(files.map(f=>fetch(f)));
    if(responses.some(r=>!r.ok))throw new Error('Не удалось загрузить фрагмент страницы');
    mount.outerHTML=(await Promise.all(responses.map(r=>r.text()))).join('');
    for(const src of ['26.08.26-lab-1.js','26.08.26-lab-2.js','26.08.26-lab-3.js','26.08.26-lab-4.js']){
      await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});
    }
  }catch(err){mount.innerHTML='<div style="max-width:800px;margin:3rem auto;padding:1rem;font:16px system-ui">Не удалось загрузить интерактивное пособие. Обновите страницу.</div>';console.error(err)}
})();
</script>
</body>
</html>
