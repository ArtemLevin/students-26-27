<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Учебная траектория Софии Кальней: занятия, материалы и карта подготовки к ОГЭ.">
<title>София Кальней — подготовка к ОГЭ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1b2a'/%3E%3Cpath d='M11 48H53M18 54V10' stroke='%23e8f7f5' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M16 43L48 15' stroke='%2329d3c2' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='29' r='5' fill='%23ffcf70'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#08131f;--panel:#102235;--text:#edf8f7;--muted:#a9bbc3;--line:#2b465b;--teal:#29d3c2;--cyan:#40dbe8;--gold:#ffcf70}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}.fallback{display:none;gap:14px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#102235,#153049)}.fallback strong{display:block;font:700 1.06rem Georgia,serif}.fallback span{color:var(--muted);font-size:.88rem}.fallback-actions{display:flex;gap:8px;flex-wrap:wrap}.fallback a{padding:9px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-weight:800;white-space:nowrap}.fallback a:first-child{border-color:transparent;background:linear-gradient(135deg,var(--teal),var(--cyan));color:#042126}iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}body.fallback-visible{display:grid;grid-template-rows:auto 1fr}body.fallback-visible .fallback{display:flex}body.fallback-visible iframe{height:100%}@media(max-width:720px){.fallback{align-items:flex-start;flex-direction:column}.fallback-actions{width:100%}.fallback a{flex:1;text-align:center}}@media print{html,body{overflow:visible}.fallback{display:none!important}iframe{height:100vh}}
</style>
</head>
<body>
<section class="fallback" id="fallback" aria-label="Новое занятие">
<div><strong>Новое занятие · 31.07.26</strong><span>Парабола, ключевые точки и выколы на графике</span></div>
<div class="fallback-actions"><a href="31.07.26.html">Открыть модуль</a><a href="../pdf_docs/31.07.26.pdf" download>PDF</a><a href="../tex_docs/31.07.26.tex" download>TeX</a></div>
</section>
<iframe id="dashboard" src="index-base.html" title="Учебная траектория Софии Кальней"></iframe>
<script>
(()=>{
const frame=document.getElementById('dashboard');
const showFallback=()=>document.body.classList.add('fallback-visible');
const modules=[
{id:'graphical-review',number:'06',date:'29.07.26',title:'Формула, график и множество решений',description:'Семейства прямых, уравнение с квадратным корнем и метод интервалов через связанную интерактивную модель.',chips:['графическая интерпретация','проверка корней'],web:'29.07.26.html',pdf:'../pdf_docs/29.07.26.pdf',tex:'../tex_docs/29.07.26.tex'},
{id:'parabola-holes',number:'07',date:'31.07.26',title:'Парабола, ключевые точки и выколы',description:'Подробное построение параболы, работа с ограничениями алгебраической дроби и подсчёт общих точек с прямой y = m.',chips:['вершина и симметрия','выколотые точки','пошаговые решения'],web:'31.07.26.html',pdf:'../pdf_docs/31.07.26.pdf',tex:'../tex_docs/31.07.26.tex'}
];
const card=m=>`<article class="lesson-card" style="border-top:5px solid var(--gold)"><div class="lesson-number"><span>Модуль ${m.number}</span><span>${m.date}</span></div><h3>${m.title}</h3><p>${m.description}</p><div class="skills">${m.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div><div class="lesson-actions"><a class="btn primary lesson-link" data-lesson="${m.id}" href="${m.web}">Открыть модуль</a><a class="btn" href="${m.pdf}" download>PDF</a><a class="btn" href="${m.tex}" download>TeX</a></div></article>`;
const resource=m=>`<div class="resource-row"><div><b>${m.date}</b><small>${m.title}</small></div><div class="resource-links"><a href="${m.web}">Web</a><a href="${m.pdf}" download>PDF</a><a href="${m.tex}" download>TeX</a></div></div>`;
frame.addEventListener('load',()=>{
try{
const d=frame.contentDocument;if(!d)throw new Error('document unavailable');
const routes=d.querySelector('#lessons .routes');
modules.forEach(m=>{if(routes&&!d.querySelector(`[data-lesson="${m.id}"]`))routes.insertAdjacentHTML('beforeend',card(m))});
const resources=d.querySelector('#materials .resource-grid');
modules.forEach(m=>{if(resources&&!resources.querySelector(`a[href="${m.web}"]`))resources.insertAdjacentHTML('beforeend',resource(m))});
[...d.querySelectorAll('.stat')].forEach(item=>{if(item.textContent.includes('интерактивн'))item.innerHTML='<b>7</b><span>интерактивных модулей</span>'});
const latest=modules[modules.length-1],title=d.getElementById('continue-title'),text=d.getElementById('continueText'),link=d.getElementById('continueLink');
if(title)title.textContent=latest.title;if(text)text.textContent='Закрепите построение параболы, ограничения, выколотые точки и уровни горизонтальной прямой.';if(link){link.href=latest.web;link.textContent='Продолжить →'}
d.querySelectorAll('[data-lesson]').forEach(a=>a.addEventListener('click',()=>{try{localStorage.setItem('sofya-last-lesson',a.dataset.lesson)}catch(_){}}));
document.body.classList.remove('fallback-visible');
}catch(error){showFallback()}
});
setTimeout(()=>{try{if(!frame.contentDocument)showFallback()}catch(error){showFallback()}},1800);
})();
</script>
</body>
</html>
