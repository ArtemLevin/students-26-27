<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Персональный учебный навигатор Софии Кальней для подготовки к ОГЭ по математике.">
  <title>София Кальней · траектория подготовки к ОГЭ</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f1e8;color:#1c3151}
    .loading{max-width:680px;padding:28px;text-align:center}.loading b{display:block;font-size:1.2rem;margin-bottom:8px}.loading p{color:#667184}
    @media(prefers-color-scheme:dark){body{background:#101b2d;color:#f7f1e8}.loading p{color:#afbac9}}
  </style>
</head>
<body>
  <div class="loading" id="loading"><b>Загружаем учебный навигатор…</b><p>Обновляем материалы и тепловую карту по занятию 19.08.26.</p></div>
  <script>
  (async()=>{
    const revision='sofya-heatmap-tex-2026-08-19-v1';
    const updates=[
      ['oge_15_4_1',3],['oge_15_4_2',3],['oge_15_4_3',3],['oge_15_4_4',3],
      ['oge_16_1_1',2],['oge_16_4_1',3],['oge_16_4_3',2],
      ['oge_19_2_1',2],['oge_19_4_1',2],
      ['oge_23_2_1',3],['oge_23_2_2',3],['oge_23_2_3',3],['oge_23_2_4',3],
      ['oge_24_2_2',2],['oge_24_2_4',2],
      ['oge_25_1_1',2],['oge_25_1_2',2],['oge_25_1_5',2]
    ];

    try{
      const key='sofya-competence-map-v1';
      if(localStorage.getItem(revision)!=='1'){
        const saved=JSON.parse(localStorage.getItem(key)||'{}');
        updates.forEach(([id,level])=>saved[id]=Math.max(Number(saved[id]??0),level));
        localStorage.setItem(key,JSON.stringify(saved));
        localStorage.setItem(revision,'1');
      }
    }catch(_){/* Local storage may be unavailable in hardened browser modes. */}

    try{
      const response=await fetch('index-base.html',{cache:'no-store'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      let html=await response.text();

      html=html.replace(
        '<article class="stat"><b>8</b><span>интерактивных модулей</span></article>',
        '<article class="stat"><b>9</b><span>интерактивных модулей</span></article>'
      );

      if(!html.includes('href="19.08.26.html"')){
        const module08=`        <article class="lesson-card" style="border-top:5px solid var(--gold)">
          <div class="lesson-number"><span>Модуль 08</span><span>07.08.26</span></div><h3>Графики функций с модулем</h3>
          <p>Кусочная запись, сдвиги графика, сохранение ОДЗ после сокращения, выколотые точки и параметр y = kx.</p>
          <div class="skills"><span class="chip">модуль и ветви</span><span class="chip">ОДЗ</span><span class="chip">параметр k</span><span class="chip">интерактивный график</span></div>
          <div class="lesson-actions"><a class="btn primary lesson-link" data-lesson="modulus-graphs" href="07.08.26.html">Открыть модуль</a><a class="btn" href="../pdf_docs/07.08.26.pdf" download>PDF</a><a class="btn" href="../tex_docs/07.08.26.tex" download>TeX</a></div>
        </article>`;
        const module09=`
        <article class="lesson-card" style="border-top:5px solid var(--teal)">
          <div class="lesson-number"><span>Модуль 09</span><span>19.08.26</span></div><h3>Прямоугольный треугольник</h3>
          <p>Медиана к гипотенузе, высота, описанная окружность, теорема Пифагора, тригонометрия и площадь.</p>
          <div class="skills"><span class="chip">медиана</span><span class="chip">Пифагор</span><span class="chip">тригонометрия</span><span class="chip">площадь</span></div>
          <div class="lesson-actions"><a class="btn primary lesson-link" data-lesson="right-triangle" href="19.08.26.html">Открыть модуль</a><a class="btn" href="../tex_docs/19.08.26.tex" download>TeX</a></div>
        </article>`;
        if(html.includes(module08))html=html.replace(module08,module08+module09);
      }

      if(!html.includes('<b>19.08.26</b>')){
        const resource07='<div class="resource-row"><div><b>07.08.26</b><small>Графики функций с модулем</small></div><div class="resource-links"><a href="07.08.26.html">Web</a><a href="../pdf_docs/07.08.26.pdf" download>PDF</a><a href="../tex_docs/07.08.26.tex" download>TeX</a></div></div>';
        const resource19='<div class="resource-row"><div><b>19.08.26</b><small>Прямоугольный треугольник: медиана, высота, площадь и тригонометрия</small></div><div class="resource-links"><a href="19.08.26.html">Web</a><a href="../tex_docs/19.08.26.tex" download>TeX</a></div></div>';
        if(html.includes(resource07))html=html.replace(resource07,resource07+'\n          '+resource19);
      }

      const evidenceScript=`<script>
(()=>{
const evidenceMap={};
const add=(ids,text)=>ids.forEach(id=>evidenceMap[id]={text,link:'19.08.26.html'});
add(['oge_15_4_1','oge_15_4_2','oge_15_4_3','oge_15_4_4'],'Подтверждено занятием 19.08.26: прямоугольный треугольник, медиана к гипотенузе, теорема Пифагора, тригонометрические отношения, площадь и высота к гипотенузе.');
add(['oge_16_1_1','oge_16_4_1','oge_16_4_3'],'Подтверждено занятием 19.08.26: середина гипотенузы как центр описанной окружности, R = AB/2 и прямой вписанный угол, опирающийся на диаметр.');
add(['oge_19_2_1','oge_19_4_1'],'Закреплено 19.08.26: точные условия свойства медианы к гипотенузе, обратное утверждение и теорема о прямом угле, опирающемся на диаметр.');
add(['oge_23_2_1','oge_23_2_2','oge_23_2_3','oge_23_2_4'],'Подтверждено занятием 19.08.26: анализ конфигурации, выбор теоремы, цепочка вычислений и обязательная проверка геометрического смысла корней.');
add(['oge_24_2_2','oge_24_2_4'],'Частично отработано 19.08.26: обоснование прямоугольности через центр описанной окружности и доказательная цепочка в конфигурации с внешними квадратами.');
add(['oge_25_1_1','oge_25_1_2','oge_25_1_5'],'Отработано на задачах 19.08.26: медиана и высота в одной конфигурации, внешние квадраты на катетах и связь площади с метрическими соотношениями.');
document.addEventListener('click',event=>{
 const id=event.target.closest?.('[data-id]')?.dataset.id,info=evidenceMap[id];
 if(!info)return;
 setTimeout(()=>{
  const dialog=document.getElementById('competencyDialog');
  if(!dialog?.open)return;
  const evidence=document.getElementById('dialogEvidence'),link=document.getElementById('dialogLink');
  if(evidence)evidence.textContent=info.text;
  if(link)link.href=info.link;
 },0);
});
})();
<`+'/script>';
      html=html.replace('</body>',evidenceScript+'\n</body>');

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      const loading=document.getElementById('loading');
      if(loading)loading.innerHTML='<b>Не удалось загрузить учебный навигатор.</b><p>Откройте <a href="index-base.html">резервную версию</a> и повторите попытку.</p>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
