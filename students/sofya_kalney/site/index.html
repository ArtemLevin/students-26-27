];
const heatmapEvidence={};
const evidence=(ids,text,link)=>ids.forEach(id=>heatmapEvidence[id]={text,link});
evidence(['oge_12_1_1','oge_12_1_2','oge_12_1_3','oge_12_1_4','oge_12_1_5'],'Подтверждено пособиями 02.07.26, 06.07.26 и 09.07.26: формула S = vt, перевод единиц, подстановка и проверка физического смысла.','motion-basic.html');
evidence(['oge_21_1_1','oge_21_1_2','oge_21_1_3','oge_21_1_4'],'Подтверждено пособием 13.07.26: массовая доля, таблица смеси, баланс компонента, системы и проверка результата.','13-07-26.html');

evidence(['oge_8_1_1','oge_8_1_2','oge_8_1_3','oge_8_3_2','oge_8_3_3'],'Подтверждено пособием 29.07.26 и закреплено 07.08.26: свойства степеней, сокращение, ограничения и тождественные преобразования.','29.07.26.html');
evidence(['oge_9_2_1','oge_9_2_2','oge_9_2_3','oge_9_2_4','oge_9_2_5'],'Подтверждено пособиями 29.07.26 и 31.07.26: приведение квадратного уравнения, разложение, дискриминант, вычисление и проверка корней.','31.07.26.html');
evidence(['oge_13_1_1','oge_13_1_2','oge_13_1_3','oge_13_1_4','oge_13_3_1','oge_13_3_2','oge_13_3_3','oge_13_3_4'],'Подтверждено пособием 29.07.26: равносильные преобразования, смена знака, границы, числовая прямая и пересечение решений системы.','29.07.26.html');
evidence(['oge_20_1_1','oge_20_1_2','oge_20_1_3','oge_20_1_4','oge_20_1_5','oge_20_2_1','oge_20_2_2','oge_20_2_3','oge_20_2_4','oge_20_2_5'],'Подтверждено пособиями 29.07.26 и 07.08.26: ОДЗ, возведение в квадрат, раскрытие модуля, метод интервалов, сохранение ограничений и контроль полноты ответа.','07.08.26.html');
evidence(['oge_11_1_2'],'Подтверждено пособиями 16.07.26 и 29.07.26: связь коэффициентов линейной функции с положением и семейством прямых.','16-07-26.html');
evidence(['oge_11_2_1','oge_11_2_2'],'Подтверждено пособием 31.07.26: вершина, ось симметрии, пересечения с осями, направление ветвей и построение параболы.','31.07.26.html');
evidence(['oge_11_3_1','oge_11_3_2','oge_11_4_1','oge_11_4_2'],'Подтверждено пособием 07.08.26: модуль, сдвиги V-графика, ветви обратной пропорциональности, асимптоты и ограничения.','07.08.26.html');
evidence(['oge_22_1_1','oge_22_1_2','oge_22_1_3','oge_22_1_4','oge_22_1_5'],'Подтверждено пособием 31.07.26: полный алгоритм параболы, ОДЗ алгебраической дроби, выколотая точка и анализ пересечений.','31.07.26.html');
evidence(['oge_22_2_1','oge_22_2_2','oge_22_2_3','oge_22_2_4','oge_22_2_5','oge_22_3_1','oge_22_3_2','oge_22_3_3','oge_22_3_4','oge_22_3_5'],'Подтверждено пособием 07.08.26: кусочная запись, области ветвей, гипербола с модулем, выколотые точки и параметрическая прямая y = kx.','07.08.26.html');

const card=m=>`<article class="lesson-card" style="border-top:5px solid var(--gold)"><div class="lesson-number"><span>Модуль ${m.number}</span><span>${m.date}</span></div><h3>${m.title}</h3><p>${m.description}</p><div class="skills">${m.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div><div class="lesson-actions"><a class="btn primary lesson-link" data-lesson="${m.id}" href="${m.web}">Открыть модуль</a><a class="btn" href="${m.pdf}" download>PDF</a><a class="btn" href="${m.tex}" download>TeX</a></div></article>`;
const resource=m=>`<div class="resource-row"><div><b>${m.date}</b><small>${m.title}</small></div><div class="resource-links"><a href="${m.web}">Web</a><a href="${m.pdf}" download>PDF</a><a href="${m.tex}" download>TeX</a></div></div>`;

function applyHeatmapUpdate(d){
  let storage=null;
  try{storage=frame.contentWindow.localStorage}catch(_){return}
  let done=false;
  try{done=storage.getItem(heatmapRevision)==='1'}catch(_){}
  if(!done){
    let applied=0;
    heatmapUpdates.forEach(([id,level])=>{
      const cell=d.querySelector(`.radial-cell[data-id="${id}"]`);
      if(!cell)return;
      try{cell.dispatchEvent(new frame.contentWindow.MouseEvent('click',{bubbles:true}))}catch(_){cell.click?.()}
      const picker=d.querySelector(`.level-btn[data-level="${level}"]`);
      if(!picker)return;
      picker.click();
      applied++;
      const dialog=d.getElementById('competencyDialog');
      if(dialog?.open)dialog.close();
    });
    if(applied===heatmapUpdates.length){
      try{storage.setItem(heatmapRevision,'1')}catch(_){}
    }
  }
  d.addEventListener('click',event=>{
    const id=event.target.closest?.('[data-id]')?.dataset.id;
    const info=heatmapEvidence[id];
    if(!info)return;
    setTimeout(()=>{
      const dialog=d.getElementById('competencyDialog');
      if(!dialog?.open)return;
      const evidenceNode=d.getElementById('dialogEvidence');
      const linkNode=d.getElementById('dialogLink');
      if(evidenceNode)evidenceNode.textContent=info.text;
      if(linkNode)linkNode.href=info.link;
    },0);
  });
}

frame.addEventListener('load',()=>{
try{
const d=frame.contentDocument;if(!d)throw new Error('document unavailable');
applyHeatmapUpdate(d);
const routes=d.querySelector('#lessons .routes');
modules.forEach(m=>{if(routes&&!d.querySelector(`[data-lesson="${m.id}"]`))routes.insertAdjacentHTML('beforeend',card(m))});
const resources=d.querySelector('#materials .resource-grid');
modules.forEach(m=>{if(resources&&!resources.querySelector(`a[href="${m.web}"]`))resources.insertAdjacentHTML('beforeend',resource(m))});
[...d.querySelectorAll('.stat')].forEach(item=>{if(item.textContent.includes('интерактивн'))item.innerHTML='<b>8</b><span>интерактивных модулей</span>'});
const latest=modules[modules.length-1],title=d.getElementById('continue-title'),text=d.getElementById('continueText'),link=d.getElementById('continueLink');
if(title)title.textContent=latest.title;if(text)text.textContent='Закрепите раскрытие модуля, кусочную запись, ограничения, выколотые точки и работу с прямой y = kx.';if(link){link.href=latest.web;link.textContent='Продолжить →'}
d.querySelectorAll('[data-lesson]').forEach(a=>a.addEventListener('click',()=>{try{localStorage.setItem('sofya-last-lesson',a.dataset.lesson)}catch(_){}}));
document.body.classList.remove('fallback-visible');
}catch(error){showFallback()}
});
setTimeout(()=>{try{if(!frame.contentDocument)showFallback()}catch(error){showFallback()}},1800);
})();
