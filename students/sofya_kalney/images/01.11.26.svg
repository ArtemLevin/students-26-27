<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Кусочные функции и число пересечений · София Кальней</title>
<desc id="desc">Пять ключевых блоков: замена переменной, движение навстречу, кусочная функция, граничные точки, прямая y равно kx. Плакат по занятию от 1 ноября 2026 года.</desc>
<rect width="1200" height="675" fill="#f6f4ee"/>
<rect x="0" y="0" width="1200" height="126" fill="#21484f"/>
<text x="58" y="49" font-family="Arial, sans-serif" font-size="17" fill="#b7d9d2" letter-spacing="3">МАТЕМАТИКА · ОГЭ · 01.11.2026</text>
<text x="55" y="94" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Кусочные функции и пересечения</text>
<text x="924" y="70" font-family="Arial, sans-serif" font-size="15" fill="#d6e7e2">София Кальней</text>
<path d="M84 360 C130 330 180 327 228 330" stroke="#9aafaa" stroke-width="3" fill="none" stroke-dasharray="5 8"/>
<path d="M974 334 C1006 310 1045 293 1073 275" stroke="#9aafaa" stroke-width="3" fill="none" stroke-dasharray="5 8"/>
<rect x="40" y="151" width="350" height="194" rx="14" fill="#e7f0ee"/>
<rect x="415" y="151" width="350" height="194" rx="14" fill="#fff0df"/>
<rect x="790" y="151" width="370" height="194" rx="14" fill="#e8f0ef"/>
<rect x="40" y="367" width="350" height="196" rx="14" fill="#fff0df"/>
<rect x="415" y="367" width="350" height="196" rx="14" fill="#e7f0ee"/>
<rect x="790" y="367" width="370" height="196" rx="14" fill="#fffefa" stroke="#c7d8d2" stroke-width="2"/>
<g font-family="Arial, sans-serif" fill="#203c42">
<text x="62" y="192" font-size="22" font-weight="700">01 · Замена переменной</text>
<text x="62" y="236" font-size="21">t = 1/x, x ≠ 0</text>
<text x="62" y="271" font-size="18">1/x² − 1/x − 6 = 0</text>
<text x="62" y="304" font-size="18">t² − t − 6 = 0</text>
<text x="437" y="192" font-size="22" font-weight="700">02 · Встречное движение</text>
<text x="437" y="238" font-size="20">S = v₁(t − τ) + v₂t</text>
<text x="437" y="274" font-size="18">τ — время остановки</text>
<text x="437" y="307" font-size="18">36 минут = 0,6 часа</text>
<text x="814" y="192" font-size="22" font-weight="700">03 · Кусочная функция</text>
<text x="814" y="236" font-size="19">−6/x: x &lt; −2 или x &gt; 1</text>
<text x="814" y="273" font-size="19">−3x − 3: −2 ≤ x ≤ 1</text>
<text x="814" y="310" font-size="18">Постройте каждый участок</text>
<text x="62" y="408" font-size="22" font-weight="700">04 · Граничные точки</text>
<text x="62" y="450" font-size="18">● включено при ≤ или ≥</text>
<text x="62" y="483" font-size="18">○ выколото при &lt; или &gt;</text>
<text x="62" y="525" font-size="18">Одна точка — один раз</text>
<text x="437" y="408" font-size="22" font-weight="700">05 · Прямая y = kx</text>
<text x="437" y="450" font-size="19">k = y₀/x₀ при x₀ ≠ 0</text>
<text x="437" y="483" font-size="19">−3/2 &lt; k &lt; 0</text>
<text x="437" y="516" font-size="18">ровно три общие точки</text>
<text x="814" y="408" font-size="22" font-weight="700">Схема анализа</text>
<text x="814" y="449" font-size="17">Каждый фрагмент → уравнение</text>
<text x="814" y="484" font-size="17">→ проверка ОДЗ → границы</text>
<text x="814" y="519" font-size="17">→ число различных точек</text>
</g>
<path d="M59 584 H1140" stroke="#b5c9c4" stroke-width="2"/>
<text x="60" y="620" font-family="Arial, sans-serif" font-size="17" fill="#42656b">Лёвин Артём Александрович эксклюзивно для Софьи Кальной</text>
<text x="60" y="648" font-family="Arial, sans-serif" font-size="13" fill="#617b7a">Flat design · учебная карта по занятию</text>
</svg>