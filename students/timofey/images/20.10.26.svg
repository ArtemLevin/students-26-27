<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="t d">
<title id="t">Финансовые задачи. Вклады и кредиты</title><desc id="d">Памятка по процентному множителю, вкладам, схемам кредитования, расчёту платежа и переплате.</desc>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence baseFrequency=".4" numOctaves="3" seed="4" stitchTiles="stitch" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".035"/></feComponentTransfer></filter>
<linearGradient id="paper" x2=".9" y2="1"><stop stop-color="#f6f0e4"/><stop offset="1" stop-color="#e7ddcb"/></linearGradient><linearGradient id="ink" x2="1" y2="1"><stop stop-color="#17354a"/><stop offset="1" stop-color="#37647a"/></linearGradient></defs>
<rect width="1120" height="610" rx="8" fill="url(#paper)"/><rect width="1120" height="610" filter="url(#grain)"/>
<path d="M28 94 Q130 69 290 87 T610 91 Q850 76 1091 90" fill="none" stroke="#a5bac0" stroke-width="20" opacity=".22"/>
<text x="45" y="58" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#183d51">ФИНАНСОВЫЕ ЗАДАЧИ</text><text x="48" y="85" font-family="Arial,sans-serif" font-size="17" fill="#667273">Вклады · Кредиты · Переплата</text>
<g font-family="Arial,sans-serif"><rect x="35" y="119" width="500" height="185" rx="12" fill="#faf6ed" stroke="#b8a58f" stroke-width="1.6"/>
<text x="56" y="153" font-size="25" font-weight="bold" fill="#244b61">01  Процентный коэффициент</text>
<text x="58" y="191" font-size="28" fill="#214c60" font-weight="bold">p = r / 100     k = 1 + p</text>
<text x="57" y="221" font-size="20" fill="#454949">Sp — только начисленные проценты</text>
<text x="57" y="253" font-size="20" fill="#454949">Sk — вся сумма после начисления</text>
<text x="57" y="282" font-size="17" fill="#9b623c">20%: p = 0,2; k = 1,2</text>
<rect x="553" y="119" width="532" height="185" rx="12" fill="#faf6ed" stroke="#b8a58f" stroke-width="1.6"/>
<text x="578" y="153" font-size="25" font-weight="bold" fill="#244b61">02  Вклад с пополнением</text>
<text x="578" y="190" font-size="31" fill="#214c60" font-weight="bold">S₂ = Sk² + ak</text>
<text x="578" y="225" font-size="18" fill="#454949">S — исходный вклад; a — пополнение</text>
<text x="578" y="253" font-size="18" fill="#454949">После первого года внесите a,</text>
<text x="578" y="277" font-size="18" fill="#454949">затем умножьте всю сумму на k.</text>
<rect x="35" y="324" width="665" height="194" rx="12" fill="#faf6ed" stroke="#b8a58f" stroke-width="1.6"/>
<text x="56" y="359" font-size="25" font-weight="bold" fill="#244b61">03  Как распознать кредит?</text>
<text x="58" y="393" font-size="21" font-weight="bold" fill="#284b5d">Аннуитет:</text><text x="214" y="393" font-size="20" fill="#454949">равные ежегодные платежи</text>
<text x="58" y="428" font-size="21" font-weight="bold" fill="#284b5d">Дифференцированный:</text><text x="327" y="428" font-size="20" fill="#454949">равные части долга</text>
<text x="58" y="464" font-size="21" font-weight="bold" fill="#284b5d">Произвольный:</text><text x="237" y="464" font-size="20" fill="#454949">остатки по заданному графику</text>
<text x="58" y="494" font-size="18" fill="#9b623c">Долг → проценты → платёж → новый остаток</text>
<rect x="718" y="324" width="367" height="194" rx="12" fill="#faf6ed" stroke="#b8a58f" stroke-width="1.6"/>
<text x="739" y="359" font-size="25" font-weight="bold" fill="#244b61">04  Переплата</text>
<text x="739" y="399" font-size="23" fill="#214c60" font-weight="bold">P = T − S</text>
<text x="739" y="430" font-size="21" fill="#214c60" font-weight="bold">q = P / S · 100%</text>
<text x="739" y="460" font-size="18" fill="#454949">T — сумма всех платежей</text>
<text x="739" y="487" font-size="18" fill="#454949">S — исходный кредит</text>
<path d="M42 540 H1082" stroke="#5c7887" stroke-width="1.5"/>
<text x="46" y="566" font-size="18" fill="#244b61">Проверяйте формулировки, вычисления и единицы измерения.</text>
<text x="46" y="590" font-size="15" fill="#667273">Лёвин Артём Александрович · эксклюзивно для Тимофея Васильченко · 20.10.2026</text></g></svg>