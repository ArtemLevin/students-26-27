<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">Морская карта алгебры — Володя Хачатурян</title>
<desc id="desc">Пять ветвей: десятичные дроби, уравнения, квадратные уравнения, неравенства и системы, формулы сокращённого умножения.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f4e8"/><stop offset=".48" stop-color="#fffdf5"/><stop offset="1" stop-color="#eaf3f3"/></linearGradient>
 <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b2d4dc" stop-opacity=".6"/><stop offset="1" stop-color="#e1eeed" stop-opacity=".25"/></linearGradient>
 <filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter>
 <style>
  .title{font:italic 700 62px Georgia,serif;fill:#173c53}
  .sub{font:26px Georgia,serif;fill:#375967}
  .head{font:700 29px Georgia,serif;fill:#fff}
  .body{font:25px Georgia,serif;fill:#203f4d}
  .formula{font:25px Georgia,serif;fill:#153b50}
  .small{font:22px Georgia,serif;fill:#355966}
  .card{fill:#f5faf6;stroke:#acc7c9;stroke-width:2}
  .banner{fill:#17445d}
 </style>
</defs>
<rect width="1400" height="960" fill="url(#paper)"/>
<path d="M0 165 Q170 110 320 171 T650 164 T1000 177 T1400 154 V260 H0Z" fill="#b8d8dc" opacity=".35" filter="url(#wash)"/>
<path d="M0 840 Q180 800 345 845 T720 840 T1120 834 T1400 847 V960 H0Z" fill="#8eb8c0" opacity=".24" filter="url(#wash)"/>
<!-- Lighthouse and sailing ship -->
<g stroke="#244d60" stroke-width="3" fill="none" opacity=".9"><path d="M74 160v-70h43v70M69 88h53l-10-14H80Z"/><path d="M84 108h22m-20 22h18"/><path d="M58 167q39-21 82 0"/><path d="M1250 163q44 28 104 0l-18 22h-65Z"/><path d="M1297 94v70m0-64l-41 56h41m5-56l42 56h-42"/><path d="M1212 63q15-10 29 0m-5 20q15-10 29 0"/></g>
<text x="700" y="73" text-anchor="middle" class="title">Морская карта алгебры</text>
<text x="700" y="116" text-anchor="middle" class="sub">17 ноября 2026 · Ключевые идеи урока</text>
<!-- five card layout -->
<g transform="translate(65 226)">
 <rect width="407" height="255" rx="20" class="card"/>
 <path d="M1 28q203-27 405 0v54H1Z" class="banner" filter="url(#wash)"/>
 <text x="22" y="64" class="head">01  Десятичные дроби</text>
 <text x="24" y="118" class="body">Умножайте делимое и делитель</text>
 <text x="24" y="150" class="body">на одно и то же число.</text>
 <text x="24" y="197" class="formula">1,4 : 0,25 = 140 : 25 = 5,6</text>
 <text x="24" y="235" class="small">Проверьте обратным умножением.</text>
</g>
<g transform="translate(498 226)">
 <rect width="407" height="255" rx="20" class="card"/>
 <path d="M1 28q203-27 405 0v54H1Z" class="banner" filter="url(#wash)"/>
 <text x="22" y="64" class="head">02  Уравнения</text>
 <text x="24" y="119" class="formula">a − b = c  →  b = a − c</text>
 <text x="24" y="155" class="formula">a : b = c  →  b = a : c</text>
 <text x="24" y="201" class="body">Скобки → перенос → подобные.</text>
 <text x="24" y="235" class="small">Следите за знаком минус.</text>
</g>
<g transform="translate(931 226)">
 <rect width="407" height="255" rx="20" class="card"/>
 <path d="M1 28q203-27 405 0v54H1Z" class="banner" filter="url(#wash)"/>
 <text x="22" y="64" class="head">03  Квадратные уравнения</text>
 <text x="24" y="118" class="formula">D = b² − 4ac</text>
 <text x="24" y="157" class="formula">x² − x = 0 → x(x − 1) = 0</text>
 <text x="24" y="198" class="body">Сначала ищите общий множитель.</text>
 <text x="24" y="233" class="small">Подставляйте минусы в скобках.</text>
</g>
<!-- Central navigation symbol -->
<path d="M704 490v78m-360 0h720" stroke="#2a7387" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M347 568v31m715-31v31" stroke="#2a7387" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="704" cy="541" r="50" fill="#eef9f7" stroke="#2a7387" stroke-width="4"/>
<path d="M704 500l12 41-12 41-12-41Z" fill="#2a7387"/><path d="M663 541l41-12 41 12-41 12Z" fill="#8dbac1"/><circle cx="704" cy="541" r="8" fill="#173c53"/>
<g transform="translate(66 615)">
 <rect width="624" height="236" rx="20" class="card"/>
 <path d="M1 28q311-27 623 0v54H1Z" class="banner" filter="url(#wash)"/>
 <text x="25" y="64" class="head">04  Неравенства и системы</text>
 <text x="28" y="117" class="body">Строгое: ○ и круглая скобка.</text>
 <text x="28" y="153" class="body">Нестрогое: ● и квадратная скобка.</text>
 <text x="28" y="190" class="formula">−x ≤ −9  →  x ≥ 9</text>
 <text x="28" y="223" class="small">Система: ищите пересечение решений.</text>
</g>
<g transform="translate(712 615)">
 <rect width="624" height="236" rx="20" class="card"/>
 <path d="M1 28q311-27 623 0v54H1Z" class="banner" filter="url(#wash)"/>
 <text x="25" y="64" class="head">05  Формулы сокращённого умножения</text>
 <text x="28" y="122" class="formula">a² − b² = (a − b)(a + b)</text>
 <text x="28" y="164" class="formula">(a − b)² = a² − 2ab + b²</text>
 <text x="28" y="204" class="small">Минус уже учтён. Последний член: плюс.</text>
</g>
<path d="M58 898Q380 877 704 904T1343 890" fill="none" stroke="#76a9b5" stroke-width="3" opacity=".5"/>
<text x="700" y="929" text-anchor="middle" class="small">Артём Александрович Лёвин · эксклюзивно для Володи Хачатуряна</text>
</svg>