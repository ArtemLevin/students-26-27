<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>КТП · София Лузянина · ЕГЭ по физике</title>
<link rel="stylesheet" href="../../../design-system/tokens.css"><link rel="stylesheet" href="../../../design-system/foundations.css"><link rel="stylesheet" href="../../../design-system/archetypes.css"><link rel="stylesheet" href="../../../design-system/student-sites.css">
<style>body{background:var(--la-site-bg,#f6f3ed);color:var(--la-site-text,#24282a);font:16px/1.6 system-ui;margin:0}.shell{max-width:1100px;margin:auto;padding:clamp(1rem,4vw,2.5rem)}header{border-bottom:1px solid #aaa7;padding-block:2rem}h1{font:normal clamp(2.1rem,6vw,4.5rem) Georgia,serif;margin:.25rem 0}a{color:inherit}h2{font:normal 2rem Georgia,serif}.item{border-bottom:1px solid #aaa8;padding:1rem 0}small{opacity:.75}a:focus-visible{outline:3px solid #b27b25;outline-offset:4px}</style></head>
<body data-atlas data-atlas-adapter="universal" data-atlas-composition="cosmos" data-atlas-accent="burgundy" data-atlas-density="balanced" data-atlas-motion="calm"><main class="shell"><a href="index.html">← К карте компетенций</a><header><small>LEVIN / ATLAS · ЕГЭ по физике · 11 класс</small><h1>Учебный маршрут</h1><p>София Лузянина · календарно-тематический план</p></header><section aria-live="polite"><h2>План → факт</h2><p id="state">Загрузка канонических данных…</p><div id="lessons"></div></section></main><footer class="shell"><small>Лёвин Артём Александрович · эксклюзивно для Софии Лузяниной</small></footer>
<script type="module">
const status=document.getElementById('state'),host=document.getElementById('lessons');
async function read(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
try{
const contract=await read('../student-contract.json');
const path=p=>{if(!p.startsWith('site/')||p.includes('..'))throw Error('Неверный путь');return '../'+p};
const [plan,state]=await Promise.all([read(path(contract.planning.plan)),read(path(contract.planning.state))]);
if(contract.studentId!=='sofya_luzianina'||plan.studentId!==contract.studentId||state.studentId!==contract.studentId||plan.programVersion!==state.programVersion)throw Error('Несогласованное состояние КТП');
status.textContent=plan.lessons.length?'В плане '+plan.lessons.length+' занятий':'Календарно-тематический план будет сформирован после анализа диагностики. Опубликованных занятий пока нет.';
for(const row of plan.lessons){const e=document.createElement('article');e.className='item';const h=document.createElement('h3');h.textContent=row.topic;const p=document.createElement('p');p.textContent=row.content;const s=document.createElement('small');s.textContent=(row.plannedDate||'дата уточняется')+' · '+(state.records[row.id]?.status||'planned');e.append(h,s,p);host.appendChild(e)}
}catch(e){status.textContent='КТП недоступен: '+e.message}
</script></body></html>
