<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дифференцированная схема кредитования — Николь Саркисьянц</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238b3038'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' fill='white'%3E%E2%82%BD%3C/text%3E%3C/svg%3E">
<style>body{margin:0;background:#f4efe7;color:#272423;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.boot{max-width:760px;margin:12vh auto;padding:24px;border:1px solid #d8c9ba;border-radius:20px;background:#fffdf8}h1{font-family:Georgia,serif}</style>
</head>
<body>
<main id="boot" class="boot" aria-live="polite"><h1>Открываем учебное пособие…</h1><p>Подготавливаем интерактивную страницу.</p></main>
<script>window.__NIKOL_PAGE_PARTS=[];</script>
<script src="04.08.26.assets/part-01.js"></script>
<script src="04.08.26.assets/part-02.js"></script>
<script src="04.08.26.assets/part-03.js"></script>
<script src="04.08.26.assets/part-04.js"></script>
<script src="04.08.26.assets/part-05.js"></script>
<script src="04.08.26.assets/part-06.js"></script>
<script src="04.08.26.assets/part-07.js"></script>
<script src="04.08.26.assets/part-08.js"></script>
<script src="04.08.26.assets/part-09.js"></script>
<script src="04.08.26.assets/part-10.js"></script>
<script src="04.08.26.assets/part-11.js"></script>
<script src="04.08.26.assets/part-12.js"></script>
<script src="04.08.26.assets/part-13.js"></script>
<script>
(()=>{try{
  const parts=window.__NIKOL_PAGE_PARTS;
  if(!Array.isArray(parts)||parts.length!==13) throw new Error('Загружены не все части учебной страницы');
  const html=parts.join('');
  if(!html.startsWith('<!doctype html>')||!html.includes('Дифференцированная схема кредитования')) throw new Error('Учебная страница собрана некорректно');
  document.open();document.write(html);document.close();
}catch(e){
  const boot=document.getElementById('boot');
  boot.innerHTML='<h1>Не удалось открыть пособие</h1><p>Ошибка загрузки: '+String(e&&e.message||e)+'</p>';
}})();
</script>
</body>
</html>
