m 0 1rem}.formula-big{display:grid;place-items:center;min-height:120px;border:1px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:18px;background:color-mix(in srgb,var(--accent) 6%,var(--panel));overflow-x:auto;padding:1rem}.formula-big math{font-size:clamp(1.25rem,3vw,2.2rem)}.chain{display:flex;align-items:stretch;gap:.6rem;flex-wrap:wrap;margin-top:1rem}.node{flex:1 1 150px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:.8rem;text-align:center;min-height:72px;display:grid;place-items:center}.node.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}.arrow{display:grid;place-items:center;color:var(--accent);font-weight:900}.explain{margin-top:1rem;padding:.8rem 1rem;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel));border-radius:0 12px 12px 0}.stage-foot{padding:.8rem 1rem;border-top:1px solid var(--line);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.stage-foot button{min-height:42px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:.55rem .75rem}.stage-foot input{accent-color:var(--accent);width:min(300px,40vw)}.stage-foot output{color:var(--muted);min-width:3.5rem}.side{padding:1rem;overflow:auto}.side h2{font:700 1.35rem Georgia,serif}.modes{display:grid;gap:.5rem}.modes button,.control{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:.75rem;text-align:left;min-height:48px}.modes button.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));font-weight:800}.control{margin-top:1rem}.control label{display:block;font-weight:750;margin-bottom:.45rem}.control select,.control input[type=range]{width:100%}.seg{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}.seg button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:.55rem}.seg button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.tipbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:900}.tooltip{position:fixed;z-index:60;max-width:min(320px,calc(100vw - 2rem));padding:.75rem;background:var(--ink);color:var(--bg);border-radius:12px;box-shadow:var(--shadow)}.status{padding:.75rem;border-radius:12px;background:var(--panel2);color:var(--muted);margin-top:1rem}.legend{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:.7rem}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.25rem}.legend .a{background:var(--accent)}.legend .b{background:var(--blue)}.legend .c{background:var(--gold)}:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

<body><div class="shell">

<section class="stage" aria-labelledby="title"><header class="stage-head"><p class="eyebrow">Эксперимент</p><h1 id="title">Формулы в обе стороны</h1><p id="subtitle">Переключайте направление формулы и наблюдайте, какой структурой она становится для решения задачи.</p></header><div class="viewport" id="viewport" tabindex="0" aria-label="Рабочая область. Перетаскивайте для панорамирования, используйте колесо для масштаба."><div class="world" id="world"><div class="board" id="board"></div></div></div><footer class="stage-foot"><button id="minus" type="button" aria-label="Уменьшить масштаб">−</button><input id="zoom" type="range" min="70" max="170" value="100" aria-label="Масштаб"><button id="plus" type="button" aria-label="Увеличить масштаб">+</button><output id="zoomOut">100%</output><button id="reset" type="button">Сброс</button><button class="tipbtn" data-tip="Масштаб меняется ползунком, кнопками или колесом мыши. Перетаскивание рабочей области меняет положение модели." aria-label="Подсказка о рабочей области">?</button></footer></section>
<aside class="side"><p class="eyebrow">Режимы</p><h2>Что исследуем</h2><div class="modes" role="tablist"><button data-mode="formulas" type="button">Формулы в обе стороны</button><button data-mode="bases" type="button">Приведение оснований</button><button data-mode="example" type="button">Пример 5 и 25</button><button data-mode="root" type="button">Пример с корнем</button></div><div id="controls"></div><div class="status" id="status" aria-live="polite"></div><div class="legend"><span><i class="a"></i>основание</span><span><i class="b"></i>показатель</span><span><i class="c"></i>результат</span></div></aside>

<script>
(()=>{'use strict';
const MODES=['formulas','bases','example','root'];const params=new URLSearchParams(location.search);let mode=MODES.includes(params.get('mode'))?params.get('mode'):'formulas';
const S={zoom:1,x:0,y:0,formula:0,direction:'forward',base:0,step:0};const store='darya-140926-lab';try{const old=JSON.parse(localStorage.getItem(store)||'null');if(old&&typeof old==='object')Object.assign(S,old)}catch(_){}S.mode=mode;
const formulas=[
 {name:'Умножение одинаковых оснований',left:'<math><msup><mi>a</mi><mi>m</mi></msup><mo>·</mo><msup><mi>a</mi><mi>n</mi></msup></math>',right:'<math><msup><mi>a</mi><mrow><mi>m</mi><mo>+</mo><mi>n</mi></mrow></msup></math>',note:'При одинаковом основании и умножении показатели складываются.'},
 {name:'Деление одинаковых оснований',left:'<math><mfrac><msup><mi>a</mi><mi>m</mi></msup><msup><mi>a</mi><mi>n</mi></msup></mfrac></math>',right:'<math><msup><mi>a</mi><mrow><mi>m</mi><mo>−</mo><mi>n</mi></mrow></msup></math>',note:'При делении одинаковых оснований показатели вычитаются; основание не равно нулю.'},
 {name:'Степень произведения',left:'<math><msup><mrow><mo>(</mo><mi>a</mi><mi>b</mi><mo>)</mo></mrow><mi>n</mi></msup></math>',right:'<math><msup><mi>a</mi><mi>n</mi></msup><msup><mi>b</mi><mi>n</mi></msup></math>',note:'Показатель можно распределить на множители.'},
 {name:'Степень в степени',left:'<math><msup><mrow><mo>(</mo><msup><mi>a</mi><mi>m</mi></msup><mo>)</mo></mrow><mi>n</mi></msup></math>',right:'<math><msup><mi>a</mi><mrow><mi>m</mi><mi>n</mi></mrow></msup></math>',note:'При степени в степени показатели перемножаются.'},
 {name:'Отрицательный показатель',left:'<math><mfrac><mn>1</mn><msup><mi>a</mi><mi>n</mi></msup></mfrac></math>',right:'<math><msup><mi>a</mi><mrow><mo>−</mo><mi>n</mi></mrow></msup></math>',note:'Дробь и отрицательная степень — две записи одной структуры при ненулевом основании.'},
 {name:'Корень как степень',left:'<math><mroot><msup><mi>a</mi><mi>n</mi></msup><mi>k</mi></mroot></math>',right:'<math><msup><mi>a</mi><mfrac><mi>n</mi><mi>k</mi></mfrac></msup></math>',note:'Внутренний показатель делится на показатель корня.'}
];
const bases=[['25','5²','Составное число становится степенью пятёрки.'],['81','3 · 3 · 3 · 3 → 3⁴','Факторизация показывает четыре одинаковых множителя 3.'],['8','2³','Восьмёрка — три множителя 2.'],['27','3³','Двадцать семь — три множителя 3.'],['6','2 · 3','Для составного основания 6 полезно разложение на простые множители.']];
const exSteps=[['5⁰·³⁶ · 25⁰·³²','Исходное выражение. Сначала сканируем основания.'],['5⁰·³⁶ · (5²)⁰·³²','25 заменено на 5².'],['5⁰·³⁶ · 5⁰·⁶⁴','Раскрыта степень в степени.'],['5¹','Показатели 0,36 и 0,64 сложены.'],['5','Итог примера.']];
const rootSteps=[['(2¹⁄³ · 2¹⁄⁴ / ¹²√2)²','Исходное выражение содержит корень в основании структуры.'],['(2¹⁄³ · 2¹⁄⁴ / 2¹⁄¹²)²','Корень двенадцатой степени из 2 заменён степенью 2¹⁄¹².'],['(2^(1/3+1/4−1/12))²','Одинаковые основания собраны в одну степень.'],['(2¹⁄²)²','Показатель упрощён до 1/2.'],['2','Степень в степени даёт ответ 2.']];
const els={board:document.getElementById('board'),controls:document.getElementById('controls'),status:document.getElementById('status'),title:document.getElementById('title'),subtitle:document.getElementById('subtitle'),world:document.getElementById('world'),viewport:document.getElementById('viewport'),zoom:document.getElementById('zoom'),zoomOut:document.getElementById('zoomOut')};
function save(){try{localStorage.setItem(store,JSON.stringify(S))}catch(_){}}
function setMode(m){mode=m;S.mode=m;S.step=0;history.replaceState(null,'','?mode='+m);render();save()}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{const on=b.dataset.mode===mode;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on))});if(mode==='formulas')renderFormulas();if(mode==='bases')renderBases();if(mode==='example')renderSteps(exSteps,'Пример: 5⁰·³⁶ · 25⁰·³²','Пошагово проследите, как составное основание превращает выражение в одну степень.');if(mode==='root')renderSteps(rootSteps,'Пример с корнем','Пошагово проследите переход от корня к рациональному показателю.');paintTransform()}
function renderFormulas(){const f=formulas[S.formula%formulas.length],forward=S.direction==='forward';els.title.textContent='Формулы в обе стороны';els.subtitle.textContent='Одна формула работает как преобразование слева направо и справа налево.';els.board.innerHTML=`<h2>${f.name}</h2><div class="formula-big">${forward?f.left:f.right}<span class="arrow">→</span>${forward?f.right:f.left}</div><div class="explain">${f.note}</div>`;els.controls.innerHTML=`<div class="control"><label for="formula">Формула</label><select id="formula">${formulas.map((x,i)=>`<option value="${i}" ${i===S.formula?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="control"><label>Направление</label><div class="seg"><button data-dir="forward" class="${forward?'active':''}">Слева → направо</button><button data-dir="back" class="${!forward?'active':''}">Справа → налево</button></div></div><div class="control"><button class="tipbtn" data-tip="Спросите себя: какая форма выражения сейчас удобнее для следующего действия — раскрытая или собранная?" aria-label="Подсказка о направлении">?</button> Формулу выбирают по структуре выражения.</div>`;els.status.textContent='Вывод: направление формулы выбирается по следующему полезному преобразованию.';document.getElementById('formula').onchange=e=>{S.formula=+e.target.value;render();save()};els.controls.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{S.direction=b.dataset.dir;render();save()});wireTips()}
function renderBases(){const b=bases[S.base%bases.length];els.title.textContent='Приведение оснований';els.subtitle.textContent='Выбирайте только примеры, которые встречались на занятии.';els.board.innerHTML=`<h2>Основание ${b[0]}</h2><div class="chain"><div class="node active">${b[0]}</div><div class="arrow">→</div><div class="node">${b[1]}</div></div><div class="explain">${b[2]}</div>`;els.controls.innerHTML=`<div class="control"><label for="base">Исходное основание</label><select id="base">${bases.map((x,i)=>`<option value="${i}" ${i===S.base?'selected':''}>${x[0]}</option>`).join('')}</select></div><div class="control"><button class="tipbtn" data-tip="Если удобная степень не видна сразу, используйте факторизацию — разложение на простые множители." aria-label="Подсказка о факторизации">?</button> Ищите одинаковые простые множители.</div>`;els.status.textContent='Вывод: преобразование основания должно открывать возможность применить формулу степеней.';document.getElementById('base').onchange=e=>{S.base=+e.target.value;render();save()};wireTips()}
function renderSteps(arr,title,sub){S.step=Math.min(S.step,arr.length-1);els.title.textContent=title;els.subtitle.textContent=sub;els.board.innerHTML=`<h2>Шаг ${S.step+1} из ${arr.length}</h2><div class="formula-big">${arr[S.step][0]}</div><div class="explain">${arr[S.step][1]}</div><div class="chain">${arr.map((x,i)=>`<div class="node ${i===S.step?'active':''}">${i+1}</div>`).join('<div class="arrow">→</div>')}</div>`;els.controls.innerHTML=`<div class="control"><label for="step">Шаг преобразования</label><input id="step" type="range" min="0" max="${arr.length-1}" value="${S.step}"></div><div class="seg"><button id="prev">← Предыдущий</button><button id="next">Следующий →</button></div><div class="control"><button class="tipbtn" data-tip="Следите за причиной каждого шага: преобразование основания → подходящая формула → упрощение показателя." aria-label="Подсказка о шагах">?</button> Каждый переход должен иметь конкретную причину.</div>`;els.status.textContent=arr[S.step][1];document.getElementById('step').oninput=e=>{S.step=+e.target.value;render();save()};document.getElementById('prev').onclick=()=>{S.step=Math.max(0,S.step-1);render();save()};document.getElementById('next').onclick=()=>{S.step=Math.min(arr.length-1,S.step+1);render();save()};wireTips()}
function paintTransform(){els.world.style.transform=`translate(${S.x}px,${S.y}px) scale(${S.zoom})`;els.zoom.value=Math.round(S.zoom*100);els.zoomOut.textContent=Math.round(S.zoom*100)+'%'}
function zoomBy(d){S.zoom=Math.max(.7,Math.min(1.7,S.zoom+d));paintTransform();save()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.getElementById('minus').onclick=()=>zoomBy(-.1);document.getElementById('plus').onclick=()=>zoomBy(.1);els.zoom.oninput=e=>{S.zoom=+e.target.value/100;paintTransform();save()};document.getElementById('reset').onclick=()=>{S.zoom=1;S.x=0;S.y=0;paintTransform();save()};
els.viewport.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?.08:-.08)},{passive:false});let drag=null;els.viewport.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:S.x,sy:S.y};els.viewport.setPointerCapture(e.pointerId)});els.viewport.addEventListener('pointermove',e=>{if(!drag)return;S.x=drag.sx+e.clientX-drag.x;S.y=drag.sy+e.clientY-drag.y;paintTransform()});els.viewport.addEventListener('pointerup',()=>{drag=null;save()});els.viewport.addEventListener('dblclick',()=>{S.x=0;S.y=0;S.zoom=1;paintTransform();save()});
const themeBtn=document.getElementById('theme');let theme;try{theme=localStorage.getItem('darya-140926-lab-theme')}catch(_){}document.documentElement.dataset.theme=theme||'light';themeBtn.onclick=()=>{const v=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=v;try{localStorage.setItem('darya-140926-lab-theme',v)}catch(_){}};
const tip=document.getElementById('tip');function hideTip(){tip.hidden=true}function wireTips(){document.querySelectorAll('[data-tip]').forEach(btn=>{if(btn.dataset.bound)return;btn.dataset.bound='1';const show=()=>{tip.textContent=btn.dataset.tip;tip.hidden=false;const r=btn.getBoundingClientRect(),w=Math.min(320,innerWidth-32);tip.style.width=w+'px';tip.style.left=Math.max(16,Math.min(innerWidth-w-16,r.left))+'px';let y=r.bottom+8;if(y+tip.offsetHeight>innerHeight-16)y=Math.max(16,r.top-tip.offsetHeight-8);tip.style.top=y+'px'};btn.addEventListener('mouseenter',show);btn.addEventListener('focus',show);btn.addEventListener('mouseleave',hideTip);btn.addEventListener('blur',hideTip);btn.addEventListener('click',e=>{e.stopPropagation();tip.hidden?show():hideTip()})})}addEventListener('click',hideTip);addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});wireTips();render();
})();
</script></body></html>
